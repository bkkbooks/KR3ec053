body:
  text: 卷三薤白藥之辛溫而滑澤者惟薤白為然最能通胸中之陽與散大腸之結故仲聖治胸痹用薤白治泄利下重亦用薤白但胸痹為陽微痢則有冷有熱第藉以疏利壅滯故外臺於冷痢熱痢皆有治以薤白者生薑生薑是老薑所生之子薑乾薑則老薑造成者故乾薑得秋氣多功兼收斂生薑得夏氣多功主橫散乾薑溫太陰之陰生薑宣陽明之陽一臟一腑亦治分母子生薑氣薄發泄能由胃通肺以散邪凡外感鼻塞與噫氣嘔吐胸痹喉間凝痰結氣皆主之惟不能治咳小柴胡湯咳去生薑痰飲門凡言咳者亦皆無生薑以生薑純乎辛散適以傷肺不能止咳太陽病表不解而有咳如小青龍湯尚不用生薑何論他經乃肺痿門之咳有用之者肺家邪實非太陽之表病比正不妨與麻黃同泄肺邪厚朴麻黃湯有麻黃而不用生薑者以脈浮則外達自易已有麻黃散表石膏清熱便當以乾薑溫而斂之澤漆湯無麻黃而即用生薑者脈沉則有伏飲在裡澤漆紫參輩之苦寒所以驅之於下生薑桂枝等之辛甘所以和之於上用麻黃則失之上散用乾薑則嫌於中守也或曰小青龍湯射干麻黃湯真武湯皆有水飲而咳而一用乾薑一用生薑一生薑乾薑並用何治之不侔若是耶曰此正方義之當尋究者矣小青龍湯外寒與內飲相搏麻黃桂枝所以散外寒細辛半夏所以蠲內飲以芍藥輔辛夏則水氣必由小便而去此內外分解之法不宜重擾其肺使內外連橫故溫肺之乾薑斂肺之五味則進之而劫肺之生薑則退之也射干麻黃湯喉中水雞聲乃火吸其痰痰不得下而作聲其始必有風寒外邪襲入於肺故咳而上氣與小青龍相似而實有不同彼用麻黃為發太陽之表邪必得加桂此用麻黃但搜肺家之伏邪不必有桂彼以辛夏蠲飲法當溫肺溫肺故用乾薑此以辛夏蠲飲法當清肺清肺故用射干彼導心下之水走小便故加芍藥此散上逆之痰在喉中故加生薑蓋乾薑不獨增肺熱而亦非肺家散劑也真武湯因發汗太過引動腎水上泛為悸為眩為身瞤非真陽本虛不至於是方名真武是表熱不足慮而寒水必當亟鎮附子補陽白朮崇土所以鎮寒水者至矣驅已泛之水以歸於壑則苓芍不可無散逆氣逐陰邪以旋轉其病機則生薑尤不可缺若寒水射肺而有咳亦即治以肺咳之藥加細辛乾薑五味咳非主病與小青龍有間故小青龍細辛乾薑各三兩而此止各一兩生薑乃證中要藥不以有乾薑而去之也生薑瀉心湯有生薑又用乾薑以生薑治乾噫食臭乾薑治腹鳴下利也通脈四逆湯有乾薑又加生薑以乾薑止利通脈生薑散寒治嘔也生薑去臭氣通神明其用全在於肺胃而胃與脾以膜相連故脾家氣分有治之者如厚朴生薑甘草半夏人參湯治腹脹是也血分亦有治者如當歸生薑羊肉湯治腹痛是也驅使之妙不在一物而在全方是故制方尤難於識藥薑棗調營衛與薑多於棗之義詳見大棗其有生薑無大棗者仲聖每與桂枝半夏橘紅等物並用重在鬯陽故不取大棗之甘壅乾薑乾薑以母薑去皮依法造之色黃白而氣味辛溫體質堅結為溫中土之專藥理中湯用之正如其本量其性散不如守故能由胃達肺而無泄邪出汗止嘔行水之長炮黑亦入腎而無附子烏頭之大力凡仲聖方用乾薑總不外乎溫中其故可玩索而得也通脈四逆湯即四逆湯倍加乾薑脈不出又加人參似乾薑與人參皆能通脈功不止於溫中矣不知壅遏營氣令無所避是謂脈營出中焦中焦泌糟粕蒸津液下利則中焦失職焉得不脈微欲絶欲脈之出自非溫中止利不可必利止而脈不出則其故不在中焦而在主脈之心然後加以補心通血脈之人參非乾薑不通脈非通脈不關溫中也肺痿有得之燥熱有得之虛冷虛冷之痿以甘草乾薑湯治之謂乾薑溫肺是固然矣豈知金生於土土不溫者上必虛上虛則不能制下其頭眩多涎唾者上虛也遺尿小便數者下虛也而皆由於中之不溫也然則乾薑非不溫肺惟不越脾以溫肺耳或曰傷寒誤攻其表服甘草乾薑湯便厥愈足溫則乾薑不獨溫中且更溫下矣曰乾薑詎能溫下惟炮之而後能耳然雖炮用其溫下之氣猶不畢貫更進以芍藥甘草湯而不貫者始貫腳始伸而不攣此其旨甚微非一二言所得罄焉夫脈浮自汗出心煩微惡寒者邪在表也小便數腳攣急者太陽寒邪襲入少陰或先有伏寒因而致劇也醫以桂枝湯但攻其表內有芍藥酸寒入里反增下寒於是得之即厥始而心煩微惡寒者茲更腎寒而躁陰中之陽又隨桂枝外發之勢而欲越故咽乾與吐逆並作此時自汗之表邪已受治於桂枝但以炮薑溫下炙草和中未有不陽復而自愈者而足溫而攣急如故寧非溫下之力猶有歉哉然非真陽虧損附子可無用也前為芍藥所誤者今乃以芍藥伸腳矣芍藥何以能然正惟炮薑以芍藥抑之而後能盡復其陽也肺痿何以不更進芍藥甘草湯以但遺尿小便數而腳不攣急且炮薑並欲其溫肺也則謂乾薑若不炮溫中而不溫下可也諸四逆湯治少陰病而用乾薑似乾薑亦所以溫下不知少陰寒甚必上侮及脾用附子以斬將搴旗猶當佐乾薑以儲糧堅壁理中丸乾薑用三兩以溫中固乾薑責也四逆湯乾薑用兩半以溫少陰有附子任之乾薑為附子後殿也更觀腎著湯病屬下焦而方中有脾藥無腎藥益以見溫下之必當溫中矣四逆湯重在厥逆下利是兼證有乾薑不必有蔥白白通湯治少陰下利是正病無兼證不升其陰氣以與陽通則利終不止故君蔥白而協以薑附桃花湯乾薑只一兩則少而又少矣且無附子無蔥白何以為解曰此非少陰純寒之證也以石脂粳米固下和中略施乾薑使就溫化不利其便不清其血而但止其利法之至超至妙者也若赤石脂禹餘糧湯利在下焦而治以中焦藥不應則桃花湯之有乾薑不尚於中宮有涉哉乾薑溫脾而上及肺以治肺咳而下連脾正為相當如小青龍湯以乾薑治寒咳而用至三兩微利亦不去乾薑是也本經乾薑主止血仁齋直指云血遇熱則宣行故止血多用涼藥然亦有氣虛挾寒陰陽不相為守營氣虛散血亦錯行者竊謂血統於脾有出中焦營氣虛散之證非溫中土不可金匱膠艾湯無干薑而千金方有之黃土湯雖無干薑而灶中黃土其用與乾薑無二乾薑溫中自有止血之理雖然不能無佐使之品也大抵吐血而至不止則在上者宜抑之漏血而至不止則在下者宜舉之凡用柏葉阿膠之類為佐使者所以導血歸經用黃芩童便之類為佐使者所以養陰和陽非能抑之能舉之也獨柏葉湯之用馬通有匪夷所思者馬之氣最盛者能使血隨汗出而一身之物非性寒即有毒惟通溫而無毒雖穢滓乎固化氣化血行脈絡之餘而性能下行者也此佐乾薑以抑為止者也婦人陷經漏下黑不解膠薑湯主之黑多由於熱而虛寒之人血出絡而凝漸漸變紫變黑亦未嘗無之膠薑湯之薑其為乾薑無疑乃陳修園以此二味治是證一再用之不瘥後易乾薑為生薑並加阿膠大棗煎服立止謂生薑散寒升氣合陷者舉之之義此與馬通一抑一舉可為對待然先服之乾薑未必無功或如仲聖法以生干並用當收效尤捷耳仲聖方乾薑黃連並用之證必兼有嘔嘔屬少陽故方中必有黃芩人參少陽專門之藥蓋少陽為三陽之樞以黃連降胃陽乾薑升脾陰脾升胃降少陽乃得轉樞此少陽無往來寒熱之治法治在此而效見於彼者也苦瓠大水面目四肢浮腫因在內而證在外也以苦瓠之瓤與子治之則棄其外而取其內也瓤與子為一瓠之津液所儲逮其漸干漸斂氣遒力厚煉津液為精華以此馭人身梗化之水自無歸命投誠一遵約束然則瓠其何以處之其氣味則苦寒也性則就下也瓠既就下而他有不就下者乎此本經所由殿之以下水也桑耳桑耳木耳之生於桑者雖有五色今但論黑桑為箕星之精逮其朽也經盛夏濕熱之蒸騰結而為耳猶腎液之上朝故色黑具好風之本性故入肝是以於血分之濕熱最能效力血分之濕熱惟女子為易成病漏下赤白汁者陰為陽迫而下泄也血病症瘕積聚者陰為陽遏而致壅也陰通陰傷寒熱者陰為陽負而思競也此陰之不足非陽之有餘但當化陰以升陰不必抑陽以損陽桑耳性涼潤而蒸騰上出所以能化陰以升陰也杏仁杏有脈絡為心果仁則主通脈絡之氣而為肺果其性直降而兼橫擴橫擴與直降互相牽制而不得逞故非加他藥不能橫擴不能直降然用杏仁於橫擴有兼取其直降者用杏仁於直降有兼取其橫擴者證若兩有所需杏仁亦兩呈其技也麻黃湯者傷寒之汗劑也既用麻黃何以又加杏仁則以杏仁兼能下氣止喘也表實而邪不得解固喘邪解而氣不得下亦喘杏仁既走表而復入里則外散之氣亦相與由中道而下是故麻杏甘石湯有麻黃又有杏仁則為治喘葛根湯有麻黃無杏仁則證本無喘然而麻黃非不治喘小青龍湯云喘去麻黃加杏仁又何以有宜不宜之別耶蓋麻黃者上發心液亦下通腎氣小青龍心下之水已與腎臟之水相吸引若再以麻黃動其腎氣喘將愈不能止杏仁肺藥非腎藥故去彼加此所謂用杏仁於橫擴兼取其直降者此也大陷胸丸者傷寒之下劑也結胸而云項亦強如柔痙狀是項強外與大陷胸湯無異而證則較重故彼可速攻而愈此必變丸而緩攻杏仁一味專為項強而設項強由陽邪爍液所致杏仁研之如脂而性兼橫擴再佐以芒硝之津潤白蜜之和甘何難化強為柔然結胸之項強非下不和亦非下不陷杏仁固大黃之功臣葶藶甘遂之益友也所謂用杏仁於直降兼取其橫擴者此也傷寒發汗以麻黃為主杏仁為輔治喘以杏仁為主麻黃為輔故二物並用其效始捷夫喘在傷寒為表實肺郁在雜證則有熱喘有虛喘有飲氣喘不止一端小青龍喘去麻黃加杏仁即非治傷寒之喘故其方亦多用於雜證然而仲聖用藥之道但於配合異同分數多寡之中一為轉移便大不相侔大青龍傷寒最要之方也麻杏並用豈為治喘其故則在麻黃加麻黃湯一倍杏仁減七十個為四十又得生薑之升石膏之寒杏仁自隨麻黃而橫擴不致馳思於直降推此以求麻杏並用而非為治喘者又得四方焉一曰麻黃加朮湯濕家身煩疼為寒濕之氣鬱於肌表麻黃湯正與相宜病由於濕故加白朮以收濕而中氣既固則杏仁亦只為利肺氣之用而已一曰麻黃杏仁薏苡甘草湯傷於風濕而至發熱日晡所劇非麻杏所能獨治矣薏苡清熱去濕治久風濕痹故加之但其分數則麻黃只用麻黃湯六中之一杏仁七中之一薏苡亦與麻黃相埒此小制治上之法杏仁所以無直降之權也一曰文蛤湯此即大青龍去桂枝加文蛤貪飲由於熱甚故用文蛤石膏特多麻黃減大青龍一半者以表邪微而不欲其過汗也若無蛤膏之鹹寒則麻黃恐尚不用至三兩然則用麻黃而復佐以生薑杏仁自無不汗之理杏仁雖兼有直降之長制之以蛤膏其與麻薑比而與蛤膏遠者勢固然也一曰厚朴麻黃湯此即小青龍加減而治亦大異曰咳而脈浮而不詳其證則試以本方藥味測之乾薑五味細辛治寒咳之藥也而咳因於寒可知麻杏與厚朴並用厚朴亦溫散之藥也而表有寒邪宜發可知有細辛又加半夏則必以之蠲飲有五味又加小麥則既治咳自當安肺此必因肺痿已見一斑故加石膏以存津而化燥與小青龍加石膏之意頗同然彼為肺脹已成故驅寒飲使下行此為肺痿始萌故乘脈浮之際亟解其表邪桂枝芍藥所以用於彼而不用於此厚朴用至五兩又無芍藥則杏仁又何能效其直降之職是為去杏仁之直降而取其橫擴杏仁直降橫擴雖同無狠力有借於他藥而以二者權之直降之力差優於橫擴故甄權主發汗而本經不主發汗主下氣茯苓杏仁甘草湯注家多以杏仁為散結愚獨以為下氣何以言之胸痹胸中氣塞短氣看似甚劇實則較前條用枳實薤白桂枝湯為輕此蓋痰飲為患陽尚不虛無取薤桂稀飲治以是湯膠痰則主橘枳生薑湯稀飲而致氣塞短氣者必因小便不利而飲停於胸胸膈或素不舒飲停則痹本經茯苓主胸脅逆氣心下結痛利小便可知散停飲之結茯苓實司其職茯苓淡滲散結是有形之飲杏仁苦溫下降是無形之氣二者合而痹者斯開塞者斯通然他方治胸痹無甘草而此有之者以二物皆下行非以甘草載之則勢不少駐而去疾不盡耳外臺走馬湯下劑也中惡心痛腹脹大便不通徐忠可謂客忤沈目南謂絞腸烏痧按方用巴豆自當有惡毒之邪壅塞臟腑須臾即斃之勢故以巴豆逐有形之實邪杏仁下無形之虛氣為急救之策與茯苓杏仁甘草湯之用杏仁取資無異是為去杏仁之橫擴而取其直降有以杏仁輔麻黃髮汗而可用於寒劑者傷寒論治黃疸之方凡三茵陳蒿湯使濕熱從小便去以小便不利腹微滿陽明病之宜下解者也梔子柏皮湯身黃髮熱非太陽發熱比柏皮為陽明經腑之藥故以清肌表之濕熱別録療肌膚熱赤起鄒氏謂柏皮之用正在表裡之間而佐以梔子甘草亦下行利小便之輕劑也此皆於杏仁無與者麻黃連翹赤小豆湯云瘀熱在裡身必發黃而無小便不利與發熱等證則其里為太陽之裡説本柯氏太陽瘀熱非汗不解但發表不遠熱而陽黃之濕熱則非熱藥所宜惟以連翹梓皮赤小豆徹熱利濕當治里之巨任而後麻黃杏仁散之於表濕熱得以汗解此治太陽瘀熱發黃非治頭痛發熱身疼骨痛故麻黃杏仁視麻黃湯減少其數而用於寒劑亦不以掣寒劑之肘也有以杏仁治腫而正取其不發汗者水去嘔止其人形腫一條痰飲篇尤氏謂胃氣已和而肺壅未通麻黃可以通之甚是惟於不用麻黃用杏仁之故則疏之未當夫麻黃髮陽猶之發汗以血虛而不敢發汗猶之奪血者無汗蓋形腫必通血絡麻黃與杏仁所同有是能也麻黃髮汗而杏仁不發汗則麻黃不宜而杏仁正宜杏仁不獨發汗此非其明徵歟有以杏仁治喘而不用於汗劑者桂枝加厚朴杏仁湯太陽病誤下無結胸下利諸變證而但微喘喘既微則表實之不解者亦僅矣桂枝湯固不解表實以麻黃施於微實之表邪又豈得為當惟厚朴溫散勝於桂枝與桂枝湯協以解表則不至有大汗之虞然不大汗表固已解而表解而氣不下則喘猶不止夫優於下氣而解表亦兼有所資者杏仁是也退麻黃而進杏仁殆以是夫杏仁研之如脂以濡潤之物而擅橫擴直降之長故於傷寒雜證皆多所資藉麻仁丸用杏仁則於濡潤中兼取其直降也麻仁與杏仁皆能潤液化燥而麻仁擴脾之約杏仁抑肺使下説詳大麻仁不可謂無通便之功矣大黃蟅蟲丸用杏仁則於濡潤中兼取其橫擴也是方種種治法無非為補虛緩中之計惟引地黃入脈絡以行滋柔之化者非杏仁而何雖桃仁亦只與蟅蟲輩比烈矣抑有但取其濡潤以佐他藥而橫擴與直降兩無所見者礬石丸是也子臟中有堅癖乾血縱以桃仁乾漆蟅蟲輩為坐藥未必遂能去之況橫擴直降第恃有杏仁乎夫曰經水閉不利者有閉時有不閉時不閉時亦不如平人之利也臟堅癖不止醫宗金鑑不止不去也中有乾血下白物者子臟中有堅癖不可去之物實為乾血而不能如干血急治也有乾血則經之蓄泄不以時而濕熱釀為白物則自下也此當置乾血而先治其白物礬石卻濕除熱劇者不過再內而愈然非佐杏仁白蜜以緩之和之未必收效如是之捷蛇床子散亦坐藥也彼治陰寒但任蛇床子佐白粉為以柔濟剛此治白物但任礬石佐杏仁為以潤濟燥杏仁潤而不膩不致減礬石之力則有之若云協以散結豈仲聖意哉杏仁橫擴不及麻黃之峻而於風虛之證卻正相宜又最宜於頭面之風潔古云治上焦風熱東垣云除肺中風熱石頑雲氣下則熱自解風自散竊謂風散則熱自解並非以熱藥治熱風考千金杏酥治風虛頭痛杏仁搗膏塗頭面風腫治頭中痛身熱風熱治頭面上風治頭中風癢白屑各方中皆有杏仁又薯蕷湯薯蕷丸亦皆有杏仁其所治之證皆有頭目眩冒由是推之即金匱薯蕷丸風藥頗多何嘗不以杏仁治頭面風所謂風氣百疾者固無一不慮之周也烏梅梅花苞於盛冬梅實成於初夏得木氣之全而味酸謂為肝藥夫何待言然非專入肝不兼走他經也其氣平屬金其味酸中有澀澀為辛酸之變亦屬金實熟則色黃而味帶甘烏梅乃半黃時所熏則亦入脾胃瀕湖謂舌下有四竅兩竅通膽液故食梅則津生不知膽液上潮口中必苦觀素問味過於酸肝氣以津可知津生是生於肝不生於膽津生亦不是肝升譬之手巾用熱湯浸過絞之則熱氣四出巾已就斂酸斂之能生津理亦如是肝何至升且得之而復其下行之常矣夫膽主動主升肝主靜主降梅實燻黑味酸而苦雖是由肝歸腎然能激肝中之津以止渴不能壯腎中之水以滅火素問酸苦湧泄為陰核之於梅湧即津生之謂泄則氣為之下熱煩滿為之除氣下熱煩滿除而心以安本經固貼切之至至止肢體痛偏枯不仁死肌鄒氏謂古今方書無用梅治肢體痛偏枯不仁之方宜連下死肌讀為治此等之死肌竊謂止字疑有誤或即下文去字而復出一字耳肢體痛偏枯不仁不過血絡凝瘀雖死肌尚有可為故與青黑痣並足以去之也諸家之論有與愚相反者焉有可以印證者焉試臚舉之張隱菴云其味酸其氣溫平而澀澀附於酸主下氣者得春生肝木之味生氣上升則逆氣自下除熱煩滿者稟冬令水陰之精水精上滋則煩熱除而胸膈不滿烏梅無生木氣起腎陰之能上已言之張氏執是以用烏梅必有為所誤者其弊在溫平酸澀之用全置不講而徒以空談為超妙也陳修園拾張之唾餘別無所見盧子繇則以本經主治一歸之生津至謂吮腎液以潤筋膜鄒氏所見又與盧同以生津為吸寒水以制火不知本經之除熱是泄熱非制熱葉氏亦云烏梅泄熱見臨證指南酸苦湧泄之義不明便無處不窒其論烏梅丸治蛔厥也曰吐蛔為陽氣爍津致蛔無所吸受而上出則梅生津於上豈是養蛔於上腎陰虛不能上濟者不得用梅則蛔本在下何以有腎陰而不知吸此既窒滯鮮通矣又謂蛔厥非臟寒即氣上撞心心中疼熱之現據不知厥陰病多陰陽錯雜沈堯封云厥陰於卦為震一陽居二陰之下病則陽泛於上陰伏於下而下寒上熱之證作蛔上入膈是下寒之據消渴心中疼熱是上熱之據凡吐蛔氣上撞心皆是厥陰過升之病治宜下降其逆上之陽烏梅丸無論黃連烏梅黃柏為苦酸鹹純陰下降之藥即附子直達命門亦何非下降可謂精審之至矣鄒氏於厥非臟寒句自注云從醫宗金鑑不知金鑑於林氏主臟寒之論仍列於下並未刪駁又尤在涇解心中疼熱食則吐蛔統謂之邪熱姑無論於烏梅丸之治不合即厥陰病之陰陽錯雜亦似有未察者惟唐容川以西人空氣冷熱發明厥陰之道足以上契聖心下迪學者空氣非愚所知不具述其析疼熱吐蛔為下寒上熱也曰消渴氣上撞心心中疼熱飢句為厥陰包絡挾心火之熱發動於上不欲食食則吐蛔下之利不止為厥陰肝氣挾寒水之寒相應而起夫吐蛔一也知此條非純熱即知彼條亦非純寒烏梅丸所以寒熱並進而非臟寒蛔不上而入膈尚何疑乎桃仁桃有膚毛為肺果仁則主攻瘀血而為肝藥兼疏膚腠之瘀惟其為肝藥故桃核承氣湯抵當湯抵當丸治在少腹鱉甲煎丸治在脅下大黃牡丹湯治在大腸桂枝茯苓丸治在症痼下瘀血湯治在臍下惟其為肺果兼疏膚腠之瘀故大黃蟅蟲丸治肌膚甲錯千金葦莖湯治胸中甲錯王海藏以桂枝紅花湯加海蛤桃仁治婦人血結胸桃仁之用盡於是矣本經桃仁主瘀血血閉癥瘕邪氣鄒氏本經疏證無症字張隱菴以邪氣單頂癥瘕謂血與寒汁沫留聚於腸胃之外凝結為癥瘕鄒氏則連上主瘀血血閉為句如釋以他處文法如紫葳主癥瘕血閉之寒熱非主癥瘕血閉等例有所不可特變其説以邪氣為瘀血血閉瘕受病之因噫鄒氏之不知闕疑亦甚矣其援仲聖方以自解也曰用桃仁之外候有三一表證未罷一少腹有故一身中甲錯若三者一件不見必無用桃仁之事夫少腹有故身中甲錯是著其證非溯其因於邪氣何與至表證未罷如桃核承氣湯抵當湯抵當丸則以表證雖未罷而傷寒至熱結膀胱則不當解表惟當攻裡其方豈半治里半治表哉桃仁若與桂枝解表則抵當何以無桂枝哉仲聖用藥殊有分寸抵當治瘀血之已結故純用血藥峻攻桃核承氣治瘀血之將結已結將結説本洄溪故兼以桂枝甘草化氣桂枝茯苓丸下症之方也血病非得氣藥不化故逐瘀止丹皮桃仁而以苓芍藥桂枝入病所為下症之前導何嘗有一毫表證鄒氏於藥用方義往往得其偏端謬為穿鑿實足誤人學者不可不察也綱目引典術云桃乃西方之木五木之精味辛氣惡能辟邪氣制百鬼本草中如孟詵於桃膠則云主惡鬼邪氣陳藏器於桃橛則云辟邪惡氣即桃仁能治尸疰鬼疰亦見於肘後諸方然則本經此處邪氣二字或指邪鬼氣言之未可知也大棗大棗色赤味甘為火土合德甘中帶辛其木多刺則微兼乎金故能安中潤液而通九竅通九竅之效非如細辛木通速而易見以火金之用為土德所掩也生薑味辛色黃由陽明入衛大棗味甘色赤由太陰入營其能入營由於甘中有辛惟甘守之用多得生薑乃不至過守生薑辛通之用多得大棗乃不至過通二物並用所以為和營衛之主劑太陰濕土貴乎濕潤濕潤太過則宜白朮濕潤不及則宜大棗大棗肉厚含津不能擠泌而分正有似乎濕土故本經主安中養脾少津液然其甘壅之弊亦伏於是故腹滿最忌胸滿心滿不忌脅下者少陽厥陰往來之路而肝血脾實統之棗補脾而性膩亦能滯肝故脅下至於痞硬亦忌之但滿不忌硬在心下非脅下比矣然脾之支脈從胃注心棗不能無忌而較脅下則次之仲聖法和營衛以生薑三兩大棗十二枚為相當之數生薑瀉心湯旋覆代赭湯大柴胡湯皆心下硬也棗如常數而生薑用至四兩五兩以硬不在脅下故棗不去棗之弊宜杜故生薑加多也然則甘草瀉心湯何以心下硬而生薑且無之是則有故也下利日數十行穀不化腹中雷鳴脾之虛甚矣棗乃脾家專藥脾虛自捷趨於脾何至上怫其心此與半夏瀉心湯皆病屬下後非若生薑瀉心旋覆代赭之為汗後大柴胡之有往來寒熱宜和營衛而生薑必不可去也腹滿必不宜棗然亦間有用者厚朴七物湯之腹滿是實滿實則當下棗尤大忌不知病不止腹滿也發熱十日脈浮數表亦有邪治兼表裡故合小承氣桂枝兩湯而微變之厚朴治腹滿專藥既以為君又加生薑至五兩減棗為十枚何患乎棗之甘壅仲聖所以不去之者桂枝湯為解肌和營衛之劑解肌不能無桂枝和營衛不能有薑無棗芍藥所以去之者病本無汗不當斂其衛氣況有小承氣更加芍藥則是脾約之治法桂枝生薑尚何望其解肌是則腹滿之有棗為與生薑和營衛又有層層顧慮之精心寓乎其間非苟焉者也有和營衛而薑棗之數加多者竹葉湯是也風之中人每帶嚴寒肅殺之氣而來適逢産後陽虛遂至發熱頭痛面赤而喘是邪發太陽兼真陽上越之證喘非衛實故只以桂枝桔防開太陽而不用麻杏若面赤而頭項亦強則為邪入陽明將欲作痙故以葛根起陰氣而柔筋附子用大與甘草安中驅寒而回陽此表裡之法已備矣面赤雖為陽越亦由風邪化熱所致在上之風熱惟竹葉能散之故以竹葉標方名明非他中風之比藥具陰陽故又加人參以和之且參能偕葛根生津協附草固里也然則薑棗之加多何為産後本已汗出表虛此復取汗以解邪豈尋常和營衛之數能勝其任者哉有和營衛而薑棗之數加少者柴胡桂枝湯是也柴胡桂枝兩方皆取微似汗此合兩方為一方不在取汗而在化太少兩經之邪使藥力微偏於里故雖和營衛而薑棗特減其數也有薑棗並用而數不相當即非和營衛者一為吳茱萸湯嘔加生薑寒多加生薑內有久寒加吳茱萸生薑仲聖固恆言之矣蓋吳茱萸闢厥陰之寒邪生薑散陽明之嘔逆生薑治寒是散而上之吳茱萸治寒是闢而下之吳茱萸湯二物並用所治皆寒證之重者故生薑用至六兩胃受肝邪其虛已甚故以棗與人參大補其中非與生薑和營衛也一為當歸四逆加吳茱萸生薑湯當歸四逆之用棗説具於下此加茱薑因內有久寒非茱薑不足以除之其數更多於吳茱萸湯者以此兼脈細欲絶之血寒也一為橘皮竹茹湯橘薑並用之方有橘枳生薑湯有橘皮湯胸中氣塞短氣只肺胃之氣結乾嘔噦手足厥明系噦由於嘔而作視單嘔者輕乾嘔而噦故氣不行於四肢亦只須利脾肺之氣宣陽明之陽蓋以橘皮辛溫而苦能利水穀為脾肺之散藥泄藥生薑辛而微溫為肺胃之散藥升藥二物有相須之益故常並用此噦逆而用橘薑意亦如是徐氏以橘皮與竹茹一寒一溫為對待釋之失其旨矣夫胃逆總由於肝逆膽逆肝逆則寒以吳茱萸逐肝寒膽逆則熱以竹茹泄膽熱此天然對待之藥方用竹茹是為膽逆而噦惟橘皮用至二斤生薑用至半斤熱除氣平而中亦憊矣大棗參草所以補中而善後也一為黃耆桂枝五物湯桂枝湯外證得之為解肌和營衛內證得之為化氣調陰陽徐忠可語此治血痹陰陽俱微故於桂枝湯中重加生薑以宣陽加黃耆以開痹棗得芍藥則化陰得桂枝則化陽雖安中而仍能走表若再加甘草則守之太過故大棗不可無而甘草必去之一為射干麻黃湯證屬肺家邪實用生薑是與麻黃同泄肺邪肺泄則傷即宜安中生金而杜後患故入大棗為隨剿隨撫之策以無桂枝杏仁故麻黃生薑俱用至四兩大棗只緣麻薑多而佐之故減為七枚一為炙甘草湯病至脈結代心動悸不止營衛之不和矣治以益營補中則脈復而悸平生薑與參桂麻麥膠地清酒並施所以益營而通脈營出中焦中不治則血不生故用棗草以補中而數較生薑為多也有薑棗並用而數相當亦非和營衛者黃芩加半夏生薑湯是也黃芩湯之用棗説具於下此加夏薑專為治嘔薑不加多者多則於自利有妨也薑棗之數相當者適然之事也桂枝湯內外證皆治小建中湯即桂枝湯加飴糖故不以薑棗之數相當列入此條試更舉有棗無薑之方疏之以畢其義一為當歸四逆湯厥陰血虛中寒用桂枝湯內四物加當歸細辛通草所以溫血散寒而通脈散不宜過故生薑去之棗加多者以能補中而隨當歸輩生血液也一為黃芩湯太陽少陽合病下利與太陽陽明合病下利何以治法迥異蓋太陽去陽明最近雖下利而太陽之邪在表者曾不少衰故以葛根從陽明達太陽之藥協麻桂解之於表加芍藥者約三物峻發之性而使之回旋兩經也太陽去少陽較遠既下利則熱氣內淫不能挽少陽之邪轉從太陽而出故以黃芩清少陽之藥專治其利加芍藥者恐病邪猶戀太陽而不使之合也或曰葛根湯發汗必虛其表不可無薑棗和營衛黃芩湯之不用薑固其宜矣獨棗何以不去耶曰此正治少陽下利法也利在太陰少陰宜燥宜溫此為少陽熱耗其液非清不治何敢再犯溫燥惟利則脾虛補脾而復能潤液者舍大棗莫屬況變柴胡湯而仍用和法棗與甘草皆不得無之若陽明下利之宜大小承氣者棗草又大忌矣一為黃連湯凡病但有熱無寒據脈證一二可斷為少陽者如嘔而發熱者小柴胡湯主之傷寒脈弦細頭痛發熱者屬少陽所謂有柴胡證但見一證便是不必悉具也如寒熱兼有之少陽病在表者為往來寒熱在裡者為喜嘔為腹中痛其有表無寒熱而但里有寒熱者如黃連湯腹中痛者寒也欲嘔吐者熱也寒在脾熱在胃乃不曰脾胃病而以為少陽病者何也方中行條辨列少陽篇金鑑亦依之蓋少陽居半表半裡出表挾陽而犯胃則欲嘔吐入里化陰而侮脾則腹中痛胃即熱則胸不能獨寒胸中有熱胃中有邪氣二句謂胸中有熱由胃中有邪氣也胃中之邪即少陽之邪也病屬少陽自當以小柴胡湯增減治之表無寒熱故去柴胡腹中痛故去黃芩治欲嘔之胃熱故以黃連佐半夏治腹痛之脾寒故以乾薑佐人參胃治則降脾治則升脾升胃降少陽可不治而自治矣而猶有慮焉者藥兼寒熱不和其在裡之陰陽則少陽之氣未必肯抑然而自下故又加桂枝協甘草以化氣而和之有桂枝若不去生薑則桂枝趨重於表用之何益且表無寒熱營衛無待於和棗則補中而能滋熱耗之液故生薑不可有而大棗不可無也一為甘麥大棗湯臟燥或主五臟或主心臟或主肺臟或主子臟竊於數説中衡之似以子臟為當子臟即子宮悲傷欲哭諸端雖見於心肺腎三經而總由於子宮燥氣乘之而致子宮之燥則由胃家陰液不足以滋之也略參唐容川説甘麥甘涼所以益陰清熱大棗甘而微溫復詬其中宮之氣藏陰之受蔭者大矣治在滋燥而屏血藥不用豈血虛勞損者比乎一為十棗湯芫花甘遂大戟皆毒藥而並用之以逐飲且不下不止飲隨下去則脾傷而液虧矣藥之足以補脾潤液而御毒者無過大棗若云培土以制水則峻逐之際何藉於制夫三物走駛而大棗遲重相反而適相濟蓋與和營衛之偶生薑瀉肺滿之偶葶藶又初無二致也一為茯苓桂枝甘草大棗湯發汗後仲聖每以薑棗和營衛此發汗後而臍下悸欲作奔豚則腎氣正思上乘不得兼顧其表矣茯苓桂枝所以泄腎水驅腎寒不用薑者慮其與桂枝升表也甘草大棗則補中宮以御之一為附子粳米湯説具飴糖木瓜木瓜味酸氣溫而質津潤皮始青而終黃肉先白而後赤為肺胃肝脾血分之藥津潤之物似濕證非宜然風以勝之土以制之溫其氣以行之濕之挾寒者詎不能療肝主風木木得濕則盛既卻濕而平木故風亦自息其味酸能收而不能散能下抑不能上升故所主為筋轉筋弛之證在下焦者多在上中焦者少用是物者能於仲聖風濕寒濕諸方之所以不用而轉求其可用則思過半矣轉筋由於霍亂霍亂而不轉筋者非木瓜所司其證有寒有熱治法天淵不得稍存偏見至於轉筋愚則謂縱屬熱證亦必微兼冷氣蓋筋屬肝肝就濕而拒冷亦就亦拒斯足筋為轉足腓屬陽明木瓜入陽明筋轉之所以溫之潤之兩適其性若非溺祕邪無出路必無不愈之理且木瓜溫而非熱潤而非燥雖熱證何至有害要在製劑配合之有道耳考古方用木瓜之證如腳氣腳痿腹脅脹滿多與辛溫藥為伍不外驅寒濕之邪輯浮散之氣雖功在降抑而終不離乎斂故其治筋病於轉戾為宜拘攣則非其所長獨許叔微以木瓜治項強筋急謂少陰之筋從足至項為肝腎受邪所致是病雖在上而因仍在下其以乳香沒藥為佐使則其以伸筋任乳沒不以責木瓜亦可見矣枇杷葉枇杷葉背有黃毛黃入胃而毛屬肺其味苦平故能和肺胃而降氣別録主卒啘不止鄒氏不言啘為何病而但以陰和陽陽入陰釋之似精而實泛矣夫卒啘者厄逆之謂不止者連續之謂厄逆多卒發而連續其所以主之者何故蓋胃為肝干則逆胃逆而肺欲降則厄枇杷葉青翠不雕煮汁則冷有抑肝陽之能且使肺胃咸循其降納之職陶隱居云若不暇煮但嚼汁咽亦瘥其效之速如是然則柿蒂所以治冷厄枇杷葉所以治熱厄非天然對待之劑耶用枇杷葉者於熱嗽熱嘔多有之熱厄少見但能認定枇杷葉為降氣治熱之物則以之治嗽治厄皆發無不中蜀椒蜀椒為足太陰及右腎氣分之藥祛脾腎之寒濕而不治風寒風濕若但寒無濕亦有不宜治寒濕無分脾腎而補火則獨在腎何以言之性溫燥而下行足以祛寒濕而不足以祛風皮紅膜白間以黃肉極里之子則黑為由肺歷脾入腎之象故能使水中泛出之火仍歸水中熱則肺病宜不相涉矣而何以亦兼隸之肺有寒飲無寒濕寒飲之病從不以椒治但寒之病亦未嘗以椒治惟脾腎之寒濕上衝而為肺病挾火者以椒引而下之始為恰當脾腎病在本臟肺病則由脾腎連及所治雖同而本末攸異此愚所以不以手太陰藥並提之也椒既由肺抵腎勢不中停自當以溫腎為首功故他物溫脾寒除脾濕效惟在脾而已椒則歸宿在腎不第供職於脾雖然脾居中宮不能飛渡有腎病脾不病而可以椒治者乎則試取仲聖方核之烏頭赤石脂丸邪在上焦而用烏附乾薑石脂中下焦之藥非脾腎有寒濕不爾更佐以蜀椒非引火下歸不爾白朮散尤氏謂治寒濕之劑術芎與椒牡並施意自在於溫下他如大建中湯烏梅丸一為嘔痛腹滿一為蛔厥嘔煩皆病在脾腎而陰中有陽而其用蜀椒也又豈有二道哉吳茱萸吳茱萸樹高丈餘皮青緑色實結梢頭其氣燥故得木氣多而用在於肝葉紫花紫實紫紫乃水火相亂之色實熟於秋季氣味苦辛而溫性且烈是於水火相亂之中操轉旋撥反之權故能入肝伸陽戢陰而闢寒邪味辛則升苦則降辛能散苦能堅亦升亦降亦散亦堅故上不至極上下不至極下第為闢肝中之寒邪而已嘔吐有寒有熱不因少陽干胃即屬厥陰乾胃少陽干胃則如心煩喜嘔與嘔而發熱皆是厥陰乾胃則如嘔而胸滿與乾嘔吐涎沫頭痛皆是仲聖小柴胡湯吳茱萸湯分主甚明雖然有嘔吐主以吳茱萸湯而曰陽明病少陰病者人必謂於厥陰無與矣而不知實厥陰病之見於陽明少陰也何以言之食谷欲嘔者肝受寒邪上攻其胃不食谷則肝氣猶舒食谷則肝不能容而欲嘔與胃虛之有胃反迥殊故非吳茱萸湯不治夫肝邪上攻則胃病為木乘土下迫則腎病為子傳母逮子傳母則吐利交作而不止一吐矣少陰自病下利已耳未必兼吐吐而利矣未必兼逆冷煩躁吐利而且手足逆冷煩躁欲死非肝邪盛極而何此時療之舍吳茱萸湯亦無別法也吳茱萸湯方義詳大棗愚既以吳茱萸為肝藥夫血藏於肝溫肝自當溫血而不知吳茱萸能散血中之氣寒非能溫血中之血寒也厥陰病至於吐利手足逆冷煩躁欲死若是血病何得無當歸當歸四逆湯脈細欲絶血寒之證也何以反無吳茱萸及知有久寒而後加之即其非胃藥腎藥亦有可證者在陽明乃兩陽合明寒不易受仲聖言胃中虛冷者不一無用吳茱萸之方縱云吳茱萸兼治胃寒夫豈不聞乾嘔吐涎沫頭痛之厥陰病非吳茱萸不治乎吳茱萸既為肝寒要藥以移治胃寒肝不寒之病寧能無誤故仲聖恐人誤用又申之曰得湯反劇者屬上焦然則治上焦之藥何在半夏乾薑散正治乾嘔吐逆吐涎沫之胃寒也他如甘草瀉心湯黃連湯中有乾薑亦所以治胃寒愚於此又悟乾薑吳茱萸與黃連黃芩為對待矣本經黃連主腸澼腹痛黃芩主腸澼不主腹痛故小柴胡湯腹痛去黃芩而黃連湯腹痛則用黃連同一寒藥不能通用如是豈有同一熱藥可漫無區別愚不以吳茱萸為腎藥者蓋亦以別有腎藥與吳茱萸分疆而治者也溫腎者為附子溫脾者為乾薑太陰藏寒曰宜四逆輩以四逆湯非溫脾之正方也溫脾正方為理中丸理中丸固有乾薑無附子而四逆湯治腎有附子又有乾薑則又何也蓋腎寒必上侮其脾乾薑在脾為中權在腎為前茅故薑附不可缺一吳茱萸豈其比乎夫腎臟者真陽所寓有扶陽以抑陰無闢陰以傷陽吳茱萸得廁名於少陰者非能治腎寒也治肝寒之流及於腎者也就是數者反復核之尚何疑吳茱萸之非血藥非胃藥非腎藥哉溫經湯有瘀血在少腹而以吳茱萸為君非以其能行瘀也婦人年五十所而病非新得宜緩圖不宜峻攻故不用下瘀血湯抵當湯而以桂枝芍藥丹皮三味行瘀即以三味協參草芎歸膠麥薑夏補中調氣和血濡燥為之綢繆者已無微不至矣更何需苦溫辛烈之吳茱萸哉不知婦人之病多因虛積冷結氣瘀血在少腹不去其為有久寒可知衝任之血肝實主之肝中積結之氣非吳茱萸詎能闢去此實是證之樞紐曰溫經者紀其實也吳茱萸上不至極上下不至極下然吳茱萸湯之厥陰頭痛溫經湯之瘀血在少腹何非極上極下要皆為闢肝寒之效所及非能徑抵頭與少腹也由是推之吳茱萸之用亦綦廣矣胃主降脾主升脾之所以升實得風木製化之益故肝病者脾必病吳茱萸能入肝驅邪化陰凝為陽和脾何能不溫腹痛腹脹何能不治其性苦過於辛降多而升少肝主疏泄肝平則氣自下此所以又利大腸壅氣治滯下也抑有用之為反佐者古方左金丸治肝臟火實左脅作痛似非吳茱萸熱藥所宜顧其方黃連多於吳茱萸五倍肝實非吳茱萸不泄連多茱少則不至助熱且足以解鬱滯之熱肝脾兩獲其益故腹痛用之亦每有神驗活法在人未可為膠柱鼓瑟者道也藕雞頭實藕始終以生以長以穿穴於水中而孔竅玲瓏絲綸內隱故能入心所主之血又味甘入脾而氣則寒故為心脾二經涼血散瘀之藥雞頭植於水與藕同味甘平補中亦同惟藕始終不離水而善穿泥雞頭則取苞中之實而苞有青刺結必向陽藕氣寒而雞頭氣溫藕性潤而雞頭性燥藕所以為血藥者以其在水中穿穴也雞頭所以為氣藥者以向陽而得天氣也藕氣寒性潤善穿故能散血除熱雞頭氣溫性燥有刺故能除濕通痹雞頭主濕痹取其能通然其通以澀為通故本經又以益精氣繼之後世用於遺精帶濁小便不禁之方頗多則澀精之功較勝於通痹之功矣土寄旺於四時而人身之土亦然天地生補土之物以為人用亦然白朮補土為補土之本宮固醫無不知矣竊謂補心中之土者蓮實也補肝中之土者薏苡也補肺中之土者山藥也補腎中之土者雞頭實也白朮而外四物皆飲饌之常品可見心肝肺腎土有所歉亦賴飲食以補之偶有所見附志於此柏實柏為百木之長葉獨西指是為金木相媾仁則色黃白而味辛甘氣清香有脂而燥雖潤不膩故肝得之而風虛能去脾得之而濕痹能通肺得之而大腸虛祕能已竹皮大丸喘加柏實者肺病亦肝病也蓋婦人乳中煩嘔是肝氣之逆逆則不下歸腎而上衝肺柏實得西指之氣能降肺以輯肝喘寧有不止此與他喘證不同故用藥亦異也桂枝素問辛甘發散為陽此固不易之至理然亦看用法何如桂枝甘草湯純乎辛甘反能止汗以甘過於辛也辛若兼苦發汗斯峻桂枝辛而不苦且與甘埒色赤氣溫有條理如脈絡質復輕揚故只能於營衛之間調和其氣血俾風寒之邪無所容而自解本經如麻黃羌活防風蔥白川芎等皆主發表出汗而桂枝無之桂枝所優為在溫經通脈內外證咸宜不得認桂枝為汗藥也麻黃桂枝兩湯一治無汗一治有汗分別甚明且云桂枝本為解肌若其人脈浮緊發熱汗不出者不可與也申警何等嚴切果證與方合如法服之未有不汗出而愈者否則謬欲取汗害乃大矣桂枝湯一方論者紛紛就愚所見惟成無己尤在涇劉潛江三家最為允當三家之中又以劉為勝特方用芍藥為臣其所以然之故皆未盡發出芍藥分數不減於桂枝自來佐芍藥以解表者古方有之乎無有也然則芍藥誠是方之關鍵矣劉説載本經疏證麻黃下鄒氏疏麻黃第二條自昔人泥於傷寒脈法篇至不為虛設矣真洞見兩方精奧惟潛江云桂枝發於陽入於陰且助以芍藥之通營乃能遂其由陽和陰之用不知桂枝兼入營衛氣惟外揚而不內向仲聖用桂枝解表之方頗多非概佐以芍藥此所以加芍藥者太陽中風風傷其衛衛曳營氣以外泄故陽脈浮而發熱陰脈弱而出汗衛由是而強營由是而弱是衛不與營和非營不與衛和桂枝能和兩弱之營衛而不能和衛不就營之營衛能由陰達陽而不能由陽返陰芍藥正與相反斂之以芍藥則衛不外泄而入里以就營又啜粥以充其胃溫復以遏其表桂芍並用為一散一斂粥復並行為一充一遏法如是之密者何也非此而營衛不和則邪汗不去正汗不生也潛江惟看芍藥尚不甚真故核之方證皆微有隔閡余則矢穿七札矣天地間凡名陰名陽之物皆陰中有陽陽中有陰非判然各出始名之為陰為陽者風與衛皆陽也風自傷衛寒與營皆陰也寒自傷營但中風豈是有風無寒傷寒豈是有寒無風仲聖文多前後詳略互見與夫言外之旨要在人潛思而得之昔人泥於仲聖風則傷衛寒則傷營之言柯氏以下多非之今唐氏容川又謂太陽寒水之氣發於至陰而充於皮毛皮毛為衛所居故寒當傷衛厥陰風木屬肝肝主營血故風當傷營無汗用麻黃明是治衛氣之藥有汗用桂枝明是治營血之藥桂枝證嗇嗇惡寒者是言皮毛一層自汗皮毛開故遇寒則欲閉而作嗇嗇之狀因皮毛開衛氣無守故惡寒也淅淅惡風者是言肌肉一層汗既漏出如淅米之狀故曰淅淅風來乘之直入肌肉則營血受傷故惡風也噫容川既謂西法與仲景書字字符合何以論仲聖之方絶不顧仲聖之論斯亦可異之甚矣桂枝湯方義愚已列前茲再就容川之言明辨之麻黃桂枝兩方只受邪淺深之分無風寒各病之別故麻黃治傷寒亦曰惡風桂枝治中風亦曰惡寒乃容川視兩證若風馬牛不相及又以桂枝之中風為風中厥陰直入肌肉此金匱要略之中風非傷寒論之所謂中風出入甚巨烏得不審汗自出者不藥而汗自出之謂正風傷衛之證據容川謂自汗皮毛開是無故插入雜證之自汗矣否則風不傷衛何以皮毛自開汗自出衛分毫不作主一任風邪飛渡內汗漏出豈有表間藩籬盡撤而仲聖尚思以桂枝湯治之之理況傷衛者為寒為麻黃證而麻黃湯內之桂枝容川則謂從血分外達筋節寒不傷營何以加此無干之血藥凡此揆之仲聖本論悉多枘鑿實不能為容川解也容川之論桂枝湯全方也曰邪在營分用甘棗補脾從脾之膏油外達以托肌肉之邪用白芍行肝血從肝膈透連網外達肌肉以行營血之滯用生薑宣三焦少陽之氣從連網達腠理以散外邪尤重在桂枝一味能宣心陽從小腸連網以達於外使營血充於肌肉間而邪不得留然則此方正是和肌肉治營血之方正是小腸血分之方若不知水火合化之理則此方之根源不明也按仲聖桂芍並用之義愚已具前薑棗為和營衛亦詳大棗蓋桂芍和營衛為解表薑棗和營衛為補表炙甘草則安內攘外司調人之職者以仲聖書統考之自知鄙説之非妄容川以甘棗為托邪則薑棗之義亡而桂芍為無功矣芍藥何能外達營弱何嘗營滯論經絡則三焦小腸與膀胱原屬貫通論病證則六經各有界址未便牽混且五物非合以散邪之藥縱如其言豈不取汗甚捷而何以汗不出者反不可與吾恐容川所謂根源者非此方之根源矣容川之於內經仲聖書宜活看者偏板看之宜合看分看者偏分看合看之自相齟齬處亦往往有之傷寒六經沿張令韶陳修園之誤不分手足夫六經配六氣主足不主手有確不可易之理不能意為合併試問小腸丙火可以膀胱寒水之方桂枝麻黃治之乎容川以風屬厥陰便謂太陽中風即中厥陰不知寒水乃風木之母風從皮毛而入母先受之病自在太陽不在厥陰又誤以心主營血為肝主營血桂枝證為風傷營非風傷衛展轉淆混胡可為後世訓者厥陰為陰之盡多純寒之證其有寒熱錯雜者以內包少陽相火也故風有寒有熱亦當兼少陽言之震為東方之卦東為生風之方少陽甲木正符易之震卦震不言木而言雷者明陽動之時甲木之所由生也一陽在下陽之所以稚也巽為木為風易則明示之矣風木自屬厥陰厥陰陰已盡故一陰居下巽以厥陰而位東南非東不生風木亦足見風之為陽邪也由是觀之風之寒者厥陰之本氣熱者少陽之兼氣其在內經所謂厥陰不從標本從乎中也容川又泥之至矣謂中氣為化是指沖和之陽而言不指火熱而言不知厥陰總不離乎少陽有化時亦有不化時譬之夫婦倡隨時是夫婦反目時非夫婦乎且容川第以陽言沖和則少陽一經宜無時不沖和何以竟有火熱之證此理不易曉乎容川又於厥陰病分肝與包絡為二言寒則舍包絡謂肝挾腎水而生寒言熱則舍肝謂包絡挾心火而生熱夫肝至挾腎包絡至挾心旗鼓各建必有非常之寒熱病執是説以治寒熱兼有之肝病庸有當乎西醫考究形質至細至精原非欺人特人身陰陽消息與病氣出入之機有未可以形質印定者若太陽病以厥陰擬方厥陰病以包絡與腎擬方漫謂於古法有合則於談中西醫也何容易焉容川於修園書謂非攻修園欲襄其不逮愚於容川亦云醫不講內經不講形質則已講內經講形質而於仲聖方仍枘鑿而不入何裨於醫張令韶唐容川其彰彰者矣姑舉太陽一經言之太陽病下之後其氣上衝者可與桂枝湯方誤下無不邪陷邪陷而氣衝是下藥激動其太陽之腑氣經所謂是動則病沖也表病仍在故可與桂枝湯或疑氣衝何竟不治不知膀胱受寒下之纍惟辛溫能止其沖桂枝乃下衝妙藥仲聖屢用之既下衝而復能解表孰有善於桂枝湯者不曰宜桂枝湯而曰可與桂枝湯方是用其方而猶有斟酌之意在或桂枝加重或外加茯苓固可揣而知者用前法三字洄溪謂指誤治極是否則服湯後自應不上衝而又云不可與何耶愚之解是方如是修園則否而又引張令韶云太陽之氣由至陰而上於胸膈由胸膈而出於肌腠由肌腠而達於皮毛愚不知其所指殆為氣衝而發夫太陽之脈動則病沖不能不涉及衝脈然其所以然亦只得付之蓋闕而令韶不知何以云然太陽為一身之外衛脈皆行身之背有靈樞經脈篇可稽如令韶言則是行身之前矣令韶論傷寒不分手足經豈因手太陽脈有循咽下膈一語耶若然則以經文計之當由小腸至胃由胃至膈由膈至咽亦不從皮毛而出於足太陽之治實去而千里雖然其所言手太陽也其所用之藥則不知非手太陽也石勒所謂賴有是者也胸脅為少陽厥陰兩經經脈之所至故胸滿脅痛為傷寒少陽病若脅中痞硬則加牡蠣厥陰藥何經見何經之病與靈樞經脈篇毫髮不爽而容川論太陽病十日已去脈浮細而嗜臥一節謂脈浮為外已解脈細嗜臥則是病及少陰元陽不得外出當用附子細辛湯治之考少陰篇無此方必是謂麻黃附子細辛湯而佚去麻黃二字乃其於少陰篇解麻黃附子細辛湯則云邪從表入合於太陽經仍當從表以汗解之且於發熱上加惡寒字茲擬移治脈浮細嗜臥之太陽病以脈浮為外已解豈用於彼為解外用於此則否耶又有奇者於胸滿脅痛之下小柴胡湯之上添入脈細嗜臥豈脈細嗜臥無兼證則應用麻黃附子細辛湯有兼證則脈細嗜臥可全然不顧耶於脈但浮之下麻黃湯之上添入嗜臥嗜臥非少陽證乃謂解表以達少陽之樞則少陰之氣自出而其所治之方則非少陰非少陽仍仲聖之麻黃湯也豈麻黃湯不妨治少陽病耶至謂胸滿脅痛是因三焦之膈膜不暢致腎氣不得外出則視手足少陽全無區別而不知有大不可者在容川既尊內經尊仲聖矣試問靈樞足少陽口苦胸脅痛等證手少陽有之乎小柴胡湯之為治足少陽尚何疑乎容川所謂中西匯通者大率類是其全書傷寒淺注補正金匱淺注補正豈勝指摘偶有所觸附志於此願以質世之深於長沙學者傷寒六經不分手足已屬大謬而容川更於形質可通之處悉力推演其説勢不至茫無畔域盡失古聖分經之旨不止而容川不自知也此其弊蓋自其治本草始矣於桂枝湯論桂枝曰桂枝宣心陽從小腸連網以達於外於麻黃湯論桂枝曰桂枝從肝之血分外達筋節宣之使出於五苓散論桂枝曰導心火下交於水以化氣於桂枝去桂加茯苓白朮湯論五苓散曰用桂枝以宣太陽之氣氣外達則水自下行而小便利於本草問答論桂枝曰桂枝色赤味辛亦是入心肝血分之藥而五苓散桂苓五味甘草湯均取其入膀胱化氣非桂枝自能化氣實因苓澤利水引桂枝入於水中以化水為氣按其説紛然淆亂茫無真見既以桂枝為心藥肝藥矣又云亦是入心肝血分之藥不知究是何藥既云宣太陽之氣氣外達則水自下行矣自應不入膀胱又云取其入膀胱化氣既云入膀胱化氣矣又云非桂枝自能化氣得苓澤而後化水為氣水既化而為氣其尚有不化之水走小便否耶以其説還叩之容川當亦有啞然笑者夫桂枝非不入心入肝也知其入心入肝而不知其為中風自汗之太陽藥不可也惟知其為太陽藥而不達皮毛以泄汗則桂枝湯不止治自汗之邪桂枝亦不止為太陽之藥此其法備見於仲聖方今具論如下桂枝用一分之方曰竹皮大丸乳子之婦煩亂嘔逆此陽明熱熾中氣大虛之候鎮中宮而寧天君惟甘草為補虛之選故非多其數不為功然補虛不先之以拯亂必無益而有害石膏白薇皆陽明藥所以平嘔逆而召浮陽陽明之熱由膽而來竹茹所以清膽火以寒藥於病為宜而扶生氣非宜甘藥於虛為宜而有胃熱非宜故甘草生用則不致過守略加桂枝則與甘草辛甘相合以化氣如是而拯亂之藥皆得有補虛之益故名之曰安中益氣竹皮大丸桂枝用二分之方曰蜘蛛散桂只二分勢不能入下焦妙在以蜘蛛十四枚炒焦引之故蜘蛛得桂而升桂得蜘蛛而降孤疝時上時下蜘蛛協桂亦時上時下所以能泄肝邪而治狐疝也曰五苓散汗出而津虧胃燥則消渴膀胱之氣不化則水蓄而小便不利脈浮微熱則表邪猶在二苓澤瀉所以導水利小便白朮所以補脾生津桂枝少用所以解表且與四物共以散服多飲暖水則太陽經府之氣俱化此蓋表裡分治而又欲其和衷共濟也桂枝用三分之方曰土瓜根散四物皆止三分杵為散而酒服取其清疏通降能行瘀而澤枯其中又有分有合桂與酒橫行脈絡蟅與芍下入少腹土瓜根則合上下以聯貫之所以為治經水似通非通之良劑也桂枝與他藥各等分之方曰桂枝茯苓丸桂枝無下症之能下症而用桂枝似非多不濟矣然妊娠之時宜漸磨不宜急攻逐瘀止丹皮桃仁而以桂苓化氣為血藥之前驅芍藥行陰為氣藥之管束五味各等分蜜丸原非溫經湯下瘀血湯之比桂枝奚嫌其少少用而無虞其不下趨者則又藉苓芍之力也曰半夏散及湯此必少陰寒邪挾痰涎壅於咽中作痛不然三物辛甘溫燥而甘草且以炙用於熱痛決非所宜不得以從治為解可見桂枝少而服散並能上治咽痛君以半夏協以炙草皆所以化氣而和解之也桂枝用一兩之方曰桂枝甘草龍骨牡蠣湯煩躁由於燒針是心腎胥為之震懾矣龍牡所以鎮腎陽桂甘所以安心陽因無他證故亦不加他藥桂枝特少者不使隨龍牡以下趨甘草倍桂枝者並益中氣而和三物也曰枳實薤白桂枝湯胸痹是病名下乃詳言其證以胸痹有不同也氣至於結胸至於滿薤栝力有不逮矣故更以桂枝佐薤白散結厚朴佐栝蔞泄滿枳實用為君者所以平脅逆也曰竹葉湯此中風由寒化熱將由太陽入陽明而真陽適虛之證桂枝解表化氣以鏟寒邪之根只用一兩者以病本無汗多則侵葛防發散之權也桂枝用二兩之方曰麻黃湯桂枝所到之處皆麻黃所到之處既用麻黃又加桂枝愚於麻黃已略著其説試更申之傷寒之邪錮閉營衛至於頭痛身痛腰痛骨節痛發之既暴而所及復廣非得橫厲無前之麻黃不足以戡定禍亂非得從容不迫之桂枝不足以搜捕餘孽且麻黃性剛桂枝性柔以剛遇柔並能少節其性不致直前不顧桂枝只二兩者以倚重在麻黃也曰桂枝加黃耆湯此段敘黃汗之證甚雜注家亦頗顢頇大抵營衛之間水與熱交蒸而滯其行度非挾寒挾虛不爾欲溫經化氣以泄黃汗而取正汗自惟桂枝湯為當第桂枝湯所治為衛強此則衛弱故加黃耆益衛氣而疏之更減桂芍以節其內向而外交於衛斯邪不能容而正乃復矣桂芍黃耆三味為黃汗必需之藥彼耆芍桂酒湯多其數而又重加苦酒者以脈沉非此不能泄邪也曰厚朴七物湯桂只二兩加生薑用至五兩則散寒之力優不致因桂留邪矣表裡兼治故以大棗安中甘草和之草不炙者以有小承氣攻裡不宜過守也薑多棗少者病非自汗不以補表也曰茯苓甘草湯傷寒汗出而渴者五苓散主之汗出屬表邪未盡渴則太陽之邪已由標傳本以五苓散表裡兩解之其小便不利可知此與脈浮小便不利微熱消渴與五苓散者正復無異下云不渴者茯苓甘草湯主之是明指尚有表邪而言不渴則胃不熱而水停於上又與真武湯及茯苓桂枝白朮甘草湯之汗出液虛腎水上救相似不過有微甚之分耳彼甚此微故但以茯苓一味消心下之水桂甘生薑解其表邪即無他慮桂甘少用者並輔其扶心陽治悸也無芍藥者邪已傳本若再斂之則表不解也無大棗者茯苓少則腎不傷不必滋液也曰茯苓澤瀉湯胃反由胃中虛冷桂枝協生薑散寒協甘草溫中以治在上焦故只用二兩余詳茯苓曰桃核承氣湯此於外解後用之桂枝豈為解表而設太陽傳本熱與血結而為少腹急結桃仁黃硝皆所以攻之氣為血帥氣行而血乃行故以桂枝入膀胱化氣甘草則甘以緩急也桂只二兩何以能入膀胱以大黃輩得之則與俱下且多則助膀胱之熱也曰桂枝加葛根湯葛根治項背強𠘧𠘧義詳葛根葛根湯與此只麻黃一味有無之分以彼為無汗惡風此為汗出惡風也太陽病汗出惡風桂枝湯正其所宜惟加葛根以治項背強𠘧𠘧則以解肌起陰氣為重和營衛次之故桂芍減桂枝湯各一兩曰溫經湯桂枝少則疏通經脈約以芍藥則能入下焦化氣用薑不用棗者不以補表也余詳吳茱萸曰木防己湯膈屬肺胃腎三焦之脈所歷支飲橫於膈間滯其肺胃之氣則喘則滿則心下痞堅下與腎相感召則腎氣上乘而面色黧黑脈得沉緊病固不獨在上也防己外白內黃有黑紋如車輻氣味辛平能行膈間之水由三焦以下輸於腎腎得之則氣平佐以桂枝一苦一辛以散結則心下之痞堅去然停飲至數十日之久肺胃已鬱而成熱非泄熱則喘滿不止故又佐以石膏吐下之後中氣與津液大虧故又佐以人參又云虛者即愈實者三日復發虛與實皆指腎氣而言腎虛則肺降而腎安實則非鹹寒以利之淡滲以伐之氣必復上注家不知其證之關腎好為影響之談那得於藥證有合桂枝用二兩半之方曰薯蕷丸風氣百疾蓋即風虛之證久踞於肌肉筋節間而非初感之可以汗解者也虛勞諸不足乃其病根所在方以補虛為主驅風次之薯蕷人參白朮甘草地黃麥冬阿膠大棗填補者也餘十三味疏瘀郁調陰陽以補虛而驅風者也其真正風藥只防風一味耳填補中兼能驅風者以薯蕷為最故君之桂枝用三兩之方曰桂枝生薑枳實湯心中痞懸痛與胸痹痛有別故不用瓜栝薤白懸痛由下有逆上之氣使痛不得下如物之空懸其為心陽不布陰邪得以竊據無疑故用薑桂各三兩以伸陽而散邪諸逆不離乎肝枳實酸入肝而苦降逆逆降則痛除而心陽得復矣曰防己茯苓湯桂枝得防己黃耆則能行皮膚之水重加茯苓者引三物下降使由小便去也水在皮膚下之速則有遺邪故加甘草以緩之曰苓桂朮甘湯痰飲者寒飲也心陽不足痰飲得以竊據膈間故胸滿木得水而風動土不能為之防故脅滿而目亦眩滿曰支者明滿之由肝來也以桂甘益心陽而化氣白朮崇脾土而燥濕茯苓則自心下導飲而泄之此治寒飲之主方也曰桂枝去芍藥加蜀漆龍骨牡蠣救逆湯此與桂枝龍骨牡蠣湯治無大異惟驚狂起臥不安較煩躁尤重故桂甘龍牡皆倍增之彼無表邪而此則脈浮故加蜀漆協桂枝以散邪既解其表必補其表故加薑棗以和營衛用桂枝湯而必去芍藥者以不汗出也曰栝蔞桂枝湯仲聖於桂枝加葛根湯云反汗出惡風此云脈反沉遲反字自宜著眼蓋太陽證備必身熱頭痛汗出脈不應沉遲而沉遲故云反柔痙原有沉遲之脈故又以此為痙而申明之證皆桂枝湯所有故用桂枝湯全方身體強𠘧𠘧然則非痙不爾加栝蔞不加葛根者即體強與項強之別其濡養筋脈以治強直則二物一也曰烏頭桂枝湯寒疝腹中痛逆冷手足不仁若身疼痛若者及也非或然之詞以身疼痛為表證故加一若字以別之此表裡傷於寒邪之重者烏頭驅表裡之寒桂枝湯化表裡之氣互相為用烏頭以蜜煎則毒解而性和桂枝湯用治腹痛亦散表邪故芍藥不再加桂枝湯與烏頭均濃煎而得蜜之甘潤則補中緩急處處皆彌綸無間故其知也如醉狀而邪則吐之豈灸刺諸藥所能及歟曰黃耆桂枝五物湯血痹陰陽俱微桂枝湯調陰陽有餘而通痹不足故加黃耆以疏衛增生薑以宣陽義主理虛而守補太過則非血痹所宜故甘草去之無表邪故不取汗不溫復與桂枝加黃耆湯似同而實異者此也曰澤漆湯此與厚朴麻黃湯皆外寒與內飲相搏而咳者脈浮者表邪方盛故重與解表此咳而脈沉非無表邪但輕微耳彼用麻杏此用桂薑猶麻黃湯桂枝湯之分傷寒中風也飲亦彼重此輕故彼用半夏六升此用半升彼熱邪在肺故加石膏此熱邪較下故加黃芩彼治咳用薑辛五味即小青龍成法水停在上此水不上乘故但以澤漆紫參白前降逆導飲而咳亦止鄒氏釋澤漆至精謂能使水氣還歸於腎是用澤漆亦與用五味有微似之處然則彼無人參何為彼所治皆一氣外散人參乃止咳善後之策於散寒蠲飲無與也此則表裡分投上下背馳安得不以人參調和之曰白虎加桂枝湯尤氏釋此方極當惟以桂枝為因而達之頗涉顢頇不如趙氏療骨節痹痛之説然不發明伏氣亦猶之泛也蓋寒邪伏於腎臟至春夏發出雖已無寒但熱而骨節煩疼則仍是根株未拔肝主筋諸筋皆屬於節桂枝亦肝藥故加桂枝以搜骨節煩疼之伏邪否則但以白虎治熱瘧終不服也曰侯氏黑散大風有菊花防風輩任之桂枝是與川芎當歸治心中惡寒曰當歸四逆湯厥陰病血虛而寒中之故手足厥寒脈細欲絶當歸為君補其血虛桂枝通草所以散寒而通脈大棗甘草所以益中而培脈脈細欲絶邪已及腎故加細辛以驅腎寒猶少陰病之兼肝藥也用桂枝湯而無薑者惡其發散以傷陰也曰炙甘草湯脈結代是營血虛衰心主營而生脈故動悸地麥膠麻所以養營陰桂枝甘草所以扶心陽人參所以生脈薑棗所以和營衛然甘草協參棗則又能補中生薑協桂草則又能宣壅棗草皆多於薑者不使過散以傷神也清酒煮者欲引諸藥以通絡也曰桂枝加附子湯此與桂枝去芍藥加附子湯只爭芍藥一味之出入彼去芍藥為下後脈促胸滿加附子為微惡寒此四肢微急難以屈伸亦陽虛之象不可無附子汗漏不止小便難則表邪未盡而津液又虧矣桂枝湯正治自汗和營衛之方芍藥極要何可去之曰桂枝加厚朴杏仁湯説詳杏仁曰防己地黃湯説詳防己曰桂枝加芍藥湯此條注家泥於太陽病醫反下之句又但以桂枝湯為太陽病解表之方或云非脾臟之寒或云和太陰之經或云發太陽之邪或云越外入之邪或云舉誤陷之邪皆於是證是方不關痛癢太陽病誤下之後至於腹滿時痛是已入太陰之臟矣太陰為陰之至決無升理就證論證焉得不先救其藥誤夫桂枝湯之為用甚多或以本方略為增減或只選二三味或只用桂枝以及桂枝湯再加他藥之或多或少即證治懸殊不得執太陽表邪為例況以桂枝解表遇無汗者概不用芍藥今以芍藥為少而再加一倍豈尚存解表之見耶大痛實者於此湯再加大黃一兩寧非太陽病之陷入者而得謂舉邪使出耶然則桂枝加芍藥湯斷不必於解表致思更有可比例以明之者小建中湯比桂枝加芍藥湯只多飴糖一味耳千金再加當歸名內補當歸建中湯其芍藥亦仍是此數前聖後賢心心相印未聞此兩方亦發其表邪夫太陰者陰臟也統血者也為下藥所苦致陰氣結而不舒腹滿時痛芍藥雖寒而能破脾家血中之氣結善治腹痛然結固破矣非有桂枝則黍谷之春終不得回以桂枝有外心無內心重加芍藥以斂之則能入脾而不走表且桂枝得生薑則散寒得甘草大棗則補中皆賴芍藥為之前導故非用加一倍不可結破中補而陽亦復腹滿時痛惡能不愈此滿痛之治法急痛非小建中不可以飴能緩急亦能助滿方劑自各有當也徐忠可謂自究心金匱用桂枝取效變幻出奇不可方物旨哉言乎曰桂枝加龍骨牡蠣湯愚以此為專治脈得諸芤動微緊男子失精女子夢交之方已於解天雄略及之按用桂枝湯原方必於桂枝湯所治有吻合之處脈芤動微緊有陰陽乖忤之象桂枝湯正所以和陰陽陰陽乖忤則精不守神不藏龍牡能召陽斂陰澀精安神故加之也桂枝用四兩之方曰桂苓五味甘草湯此支飲漬肺而咳引動腎氣從下上衝復從上下流陰股其多唾口燥及小便難時覆冒諸端皆因是而致治以茯苓消飲桂枝下衝甘草培中土以杜腎水之上乘五味攝腎陰以召肺氣之下降證甚繁而藥甚簡所謂握要以圖也凡仲聖治寒飲之咳無不以薑辛五味並用茲有五味無薑辛以薑辛助面熱故去之五味補尺微故取之也桂枝為下衝專藥雖助陽不得而避也逮服之而沖氣果低反更咳胸滿正當以桂枝治胸滿矣而轉去桂加薑辛曷故蓋薑辛與五味本不能偏廢咳而胸滿咳治則胸滿亦治加薑辛為與五味治咳也面熱本不宜桂枝沖氣低則去之便也若茯苓蠲肺飲伐腎邪則斷無可去之理矣曰桂枝附子湯傷寒至八九日風寒之邪未盡適遇陽虛之體里濕與外風相搏遂致身體疼煩不能自轉側脈浮為風澀與虛為陽虛挾濕陽虛而無別因故不嘔不渴此桂枝湯為解表必需之劑陽虛則非附子扶陽不可協桂枝又足以並驅風濕故加之脈浮無汗則不宜斂故去芍藥桂枝加桂枝湯一兩者重則能達下利小便也曰甘草附子湯桂枝與附子皆風寒風濕並治惟附子尤能扶陽此風濕相搏陽虛之甚非附子不勝其任故方名隱桂枝而標附子以甘草冠首者濕不宜人參身腫又不宜薑棗甘草補中緩外功不可沒也附子化濕而不能御濕加白朮者崇土以御濕也小便不利並以桂枝利小便故多其數也曰桂枝人參湯此理中湯加桂枝也理中為治霍亂寒多之方此數下致虛雖挾熱而利脈必微弱説本金鑑當以寒多論治乾薑甘術溫中補虛即理中之成法彼兼嘔吐故甘草生用以和胃此利下虛甚宜於守補故甘草炙之而又多其數桂枝後煎而必用四兩者欲其解表而並散心下痞硬也霍亂為上下不和此為表裡不和故均用人參以和之曰桂枝甘草湯發汗過多傷其心氣致叉手冒心心悸欲按與真武湯汗後腎水上乘有他證者不同只須補其心氣桂枝湯桂甘二味即屬妙法桂枝不以利小便而亦用四兩者心氣虛甚非多不濟且輕揚之性上虛則即歸上勢固然也曰茯苓桂枝甘草大棗湯桂枝甘草湯為汗後心悸欲按此為汗後臍下悸因同而證不同彼必心氣素虧此必腎氣易動也腎病治腎桂枝自應四兩而亦用炙草二兩者何哉桂甘無他藥則辛甘合化心受其益此以茯苓半斤先煮大瀉腎水桂枝亦多自隨茯苓以入腎伐腎邪而化氣棗草皆中宮物此際必協以御腎無待言者有甘草而又加大棗者扶陽之後宜以甘潤益陰且不助腎也曰桂枝芍藥知母湯是條尤氏誤於知母一味只知其能除熱遂謂溫溫欲吐金鑑云溫溫當是嗢嗢是濕熱從下上衝生薑多用是止嘔降逆唐容川則以是條與下條合看全歸之於虛其解方亦全屬理虛又云凡仲聖所稱欲吐多是火逆不知寒逆更多溫溫欲吐四字此見之少陰病何以忘之又以知母為清血中鬱熱知母豈是血藥似此武斷杜撰令人駭絶就愚所見之書惟趙氏以德風寒濕痹其營衛與知母治腳腫之説實勝諸家惜未發其所以然耳夫風寒濕三氣合而成痹非各占一所今約略指之頭眩者風淫於上短氣者濕阻於中欲吐者寒逆其胃濕易下流故腳腫如脫三氣固結不解致三焦失其統御水穀不能化精微而充肌肉故諸肢節疼痛身體尪羸其為虛其不待言矣然風則陽受痹則陰受痹病未有能一汗而愈者補則助邪補亦未可以易言者按桂枝等九味皆仲聖屢用之藥麻黃附子有不以除寒者乎白朮有不以除濕者乎防風有不以除風者乎桂枝湯有不以調陰陽和營衛者乎附子除寒即屬補陽白朮除濕即屬補土不專為補計亦可見矣凡桂枝湯所主之證必有自汗無汗用之必非解表麻黃湯有桂枝麻多於桂也此桂多於麻且約之以芍藥蓋欲使諸治邪之藥以桂芍引之甘草和之留連於營衛經絡肢節以成潛移默化之功夫復何疑去大棗者潤液則羈濕也生薑加多者以能助朮附升陽為桂芍促駕且性味與四物相得也然則桂苓之功固不在小知母何為而亦與之同標方名也夫知母者趙氏所謂治腳腫即本經所謂除邪氣肢體浮腫下水者也功豈出桂芍下哉桂枝用五兩之方曰桂枝加桂湯此與茯苓桂枝甘草大棗湯皆所以制奔豚而桂枝有四兩五兩之分者彼為臍下悸而尚未上衝且已多用茯苓伐腎邪故四兩不為少此則重傷於寒腎氣從少腹上衝至心桂枝散寒而更下其沖故於桂枝湯再加桂枝二兩仲聖用桂只是桂枝蓋即一物而加之減之便各有功效不同以諸方參考之自見不必疑此之加桂為肉桂也桂枝用六兩之方曰天雄散桂枝用至六兩僅見是方蓋以天雄益腎精更以桂枝化腎氣以龍骨召自下上越之陽更以桂枝扶自上下濟之陽以白朮培土而守之更以桂枝溫土而發之是桂枝足以輔三物之不逮非用之至多則輕易之性治上不能治中下也仲聖用桂枝之廣大精微愚已備陳其法試更以桂枝湯推類言之夫桂枝湯不獨治太陽病也治陽明病亦有之如陽明病脈遲汗出多微惡寒者表未解也可發汗宜桂枝湯是桂枝湯用之於陽經外證總以汗出為斷太陽表實者不汗出汗出必表虛故可以桂枝湯調營衛陽明病本自汗出而汗出之證則有不同汗出而惡熱不惡寒與得之一日不發熱而惡寒二日寒自罷而發熱者陽明熱病也此汗出且多脈復遲則非熱蒸之汗出而為表虛有寒邪之汗出微惡寒而非背微惡寒又無燥渴心煩之裡證則非解後之餘邪而為表邪之未解雖陽明之邪較深於太陽而宜以桂枝湯生正汗而發邪汗則理實無二也謹按金鑑云汗出多之下當有發熱二字若無此二字脈遲汗出多微惡寒乃是表陽虛桂枝附子湯證也豈有用桂枝湯發汗之理乎竊思仲聖此條確切桂枝湯證似無佚脫之字至桂枝附子湯以芍藥易附子正是汗出與不汗出分別緊要之處風濕相搏之宜以附子扶陽與陽明中風之表虛只須用桂枝者似亦有異然歟非歟姑謹志之用桂枝湯而非自汗出者亦有之如太陰病脈浮者可發汗宜桂枝湯按太陰之為病一條是太陰臟病提綱此脈浮是經病斷無腹滿而吐等證然則太陰病三字從何著落竊謂他條太陰中風四肢煩疼即屬太陰經病之提綱邪中陰經詎能汗解桂枝湯是和劑亦非汗劑注家不究桂枝湯發汗之所以然而第執可發汗三字模糊以辛甘發散釋之柯氏更誤認脈浮為風熱不思桂枝湯之發汗是何等發汗必其先表虛汗出服湯後再啜粥溫復然後邪汗去而正汗以生今太陰中風本不能有汗陰經之表證本不能以麻黃葛根等發汗舍桂枝湯解肌調營衛尚有宜於是者乎王宇泰云陰不得有汗故不言無汗三陰兼表病俱不當大發汗非深明於仲聖法者不能為此言用桂枝湯而但身體疼痛者亦有之下利腹脹滿身體疼痛者先溫其里乃攻其表溫里宜四逆湯功表宜桂枝湯一條金匱亦載入竊疑本系雜證而復出於傷寒論者下利之下金匱多一後字蓋太陰所受寒濕下利之後脾陽式微腹故脹滿外則經氣亦虛風邪乘之與里濕相搏體為之痛然經臟並治非法以四逆湯先溫其里則寒濕去而表邪亦孤後以桂枝湯解肌散風而和營衛自易如反掌不云發汗者即金匱所謂但微微似欲汗出者風濕俱去也更有用桂枝湯於婦人妊娠者金匱婦人妊娠篇第一條妊娠至六十日不能食自屬阻病阻病用桂枝湯似有未合徐氏謂桂枝湯內證得之為化氣調陰陽瘥勝諸家而終未親切竊思仲聖於病證但標數字而即云宜某方者多有之此或尚有的對之證欲人就其方思之而自得耳按太陰中風四肢煩疼太陰病脈浮者宜桂枝湯而千金半夏茯苓湯治妊娠阻病為後世所宗卻有四肢煩疼惡寒汗出等證方中橘薑辛夏與桂枝湯亦頗有似處就是測之妊娠阻病必得有太陰外證者以桂枝湯治之方不致誤雖然不知強解儒者所戒宜金鑑謂有脫簡而不加注也絶之是絶其醫藥婁全善治一婦即遵此法而愈又女科輯要載一老婦勸人停藥後如其言然則以絶之為絶其病根或泥於安胎治之而逆是絶其妊娠者當爽然失矣

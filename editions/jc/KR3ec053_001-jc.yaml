body:
  text: 卷一石膏鄒氏云石膏體質最重光明潤澤乃隨擊即解紛紛星散而絲絲縱列無一縷橫陳故其性主解橫溢之熱邪此正石膏解肌之所以然至其氣味辛甘亦兼具解肌之長質重而大寒則不足於發汗乃別錄於杏仁曰解肌於大戟曰發汗石膏則以解肌發汗連稱豈以仲聖嘗用於發汗耶不知石膏治傷寒陽明病之自汗不治太陽病之無汗若太陽表實而兼陽明熱鬱則以麻黃髮汗石膏泄熱無舍麻黃而專用石膏者白虎湯治無表證之自汗且戒人以無汗勿與即後世發表經驗之方亦從無用石膏者所謂發表不遠熱也然則解肌非歟夫白虎證至表裡俱熱雖尚未入血成腑實而陽明氣分之熱已勢成連衡非得辛甘寒解肌之石膏由里達表以散其連衡之勢熱焉得除而汗焉得止是得石膏解肌所以止汗非所以出汗他如竹葉石膏湯白虎加桂枝湯非不用於無汗而其證則非發表之證學者勿過泥別錄可耳又王海藏謂石膏發汗朱丹溪謂石膏出汗皆以空文附和未能實申其義竊思方書石膏主治如時氣肌肉壯熱煩渴喘逆中風眩暈陽毒發斑等證無一可以發汗而愈者病之倚重石膏莫如熱疫余師愚清瘟敗毒散一劑用至六兩八兩而其所著疫證一得則諄諄以發表致戒顧松園以白虎湯治汪纘功陽明熱證每劑石膏用至三兩兩服熱頓減而遍身冷汗肢冷發呃群醫譁然阻勿再進顧引仲聖熱深厥深及喻氏陽證忽變陰厥萬中無一之說與辯勿聽迨投參附回陽之劑而汗益多體益冷復求顧診顧仍以前法用石膏三兩而二服後即汗止身溫見陸定圃冷廬醫話此尤可為石膏解肌不發汗之明證要之顧有定識定力全在審證之的而仲聖與喻氏有功後世亦可見矣本經中風寒熱四字劉潛江鄒潤安皆作兩項看甚是惟鄒以下文心下逆氣驚喘口乾舌焦不能息為即中風與寒熱之候強為牽合殊不切當劉謂陽不足而陰有餘者風之虛也陰不足而陽有餘者風之淫也茲味之陰有餘正對待陽有餘之證而治其風淫講石膏治中風極真講寒熱則以五蒸湯內三焦之乍寒乍熱用石膏釋之而五蒸湯卻不僅恃石膏除寒熱也竊思中風用石膏如金匱風引湯古今錄驗續命湯皆是寒熱用石膏當以外臺石膏一味治陽邪入里傳為骨蒸令人先寒後熱漸成羸瘦有汗而脈長者為切又白虎加人參湯治太陽中熱汗出惡寒身熱而渴亦可為石膏治寒熱之據然此二證與陽虛之寒陰虛之熱傷寒有表證之惡寒皆迥乎不同未可漫施而不細辨也石膏甘淡入胃辛入肺體重易碎亦升亦降則入三焦以清肅之寒滌蒸郁之熱只在三經氣分而不入於血其為胃藥非脾藥亦由於是然則腹中堅痛必苦寒入血如大黃方克勝任即枳樸芍藥亦只堪用為臣使石膏斷不能攻堅而止痛本經腹中堅痛四字必是後世傳寫舛誤原文寧有是哉仲聖方石膏麻黃並用與大黃協附子變其性為溫藥相似更設多方以增損而軒輊之覺變幻紛紜令人目眩然只認定麻黃散寒發汗石膏泄熱止汗相為制還相為用推此以求何方不可解何方不可通大青龍湯咸以為發汗之猛劑矣竊謂發汗之猛當推麻黃湯不當推大青龍麻黃湯中桂枝杏仁皆堪為麻黃髮汗效力而無石膏以制麻黃大青龍麻黃受石膏之制六兩猶之三兩杏仁又少三十枚用於脈浮緊身疼痛則曰中風用於傷寒則曰脈浮緩身不疼但重中風自較傷寒為輕身不疼但重自非但取解表柯韻伯謂大青龍方後之汗出多者溫粉撲之一服汗者停後服汗多亡陽遂虛惡風煩躁不得眠也宜移列麻黃湯後蓋從溫服八合並汗後煩躁與未汗煩躁悟出可謂讀書得間諸家震於青龍之名念有汗多亡陽之戒遂以麻黃得石膏譬龍之興雲致雨其於白虎非驅風之方小青龍無石膏亦名青龍越婢麻膏之多如大青龍而不言取汗皆有所難通則不顧也然則名大小青龍何哉蓋龍者屈伸飛潛不可方物能召陽而化陰者也麻黃能由至陰以達至陽而性味輕揚得石膏芍藥則屈而入里得桂枝杏仁則伸而出表石膏寒重之質復辛甘津潤而解肌並堪為麻黃策應故名之曰大青龍小青龍心下有水氣以石膏寒重而去之麻黃可任其發矣而麻黃三兩芍藥亦三兩麻黃雖發亦絀其辛夏諸味又皆消水下行蓋龍之潛者故名之曰小青龍越婢湯之麻黃亦制於石膏者而故制之而故多之則越婢之證使然也風水惡風一身悉腫脈浮不渴種種皆麻黃證惟裡熱之續自汗出則不能無石膏有石膏故用麻黃至六兩石膏因有麻黃故雖無大熱而用至半斤其不以石膏倍麻黃者化陰尤要於退陽也或問越婢以汗出用石膏大青龍以煩躁用石膏別有說詳麻黃無陽明熱邪者宜不得而用矣乃傷寒脈浮緩身不疼但重乍有輕時大青龍湯發之徐洄溪謂此條必有誤其信然乎曰此正合青龍屈伸飛潛之義也尤在涇云經謂脈緩者多熱傷寒邪在表則身疼邪入里則身重寒已變熱而脈緩經脈不為拘急故身不疼而但重而其脈猶浮則邪氣在或進或退之時故身體有乍重乍輕之候也不曰主之而曰發之者謂邪欲入里而以藥發之使從表出也詮解之精諸家不及夫邪欲入里而以藥發之非麻黃得石膏寒重之質如青龍出而復入入而復出何能如是若視石膏為汗藥麻黃不因石膏而加多諸家多作此誤則此條真大可疑矣越婢石膏多於麻黃止二兩即不以龍名不以汗多示禁大青龍石膏斷不至如雞子大一塊別有說詳麻黃且石膏多則不能發汗又有可證者麻杏甘膏湯之石膏倍麻黃是也麻黃四兩雖不及大青龍之六兩而較麻黃湯之三兩尚多一兩即杏仁少於麻黃湯二十枚而麻黃一兩則非杏仁二十枚可比此湯何不用於無汗之證而反用於汗出應止之證則以石膏制麻黃更甚於越婢耳方解別詳麻黃石膏止陽明熱熾之汗亦止肺經熱壅之喘既有麻黃原可不加杏仁因麻黃受制力微故輔以杏仁解表間餘邪無大熱而用石膏至半斤其義與越婢正同乃柯氏不察改汗出而喘無大熱為無汗而喘大熱反謂前輩因循不改不知用石膏正為汗出若無汗而喘乃麻黃湯證與此懸絕矣更證之桂枝二越婢一湯大青龍謂脈微弱汗出惡風者不可服此云脈微弱此無陽也不可更汗豈猶以麻黃髮之石膏寒之夫不可更汗必先已發汗或本有自汗觀其用桂枝湯全方而不去芍藥可見至又加以麻膏則非與桂枝麻黃各半湯互參不明按桂枝麻黃各半湯發熱惡寒熱多寒少與此同而彼如瘧狀脈微緩有邪退欲愈之象若脈微非緩而惡寒面反有熱色則以桂枝麻黃各半湯微汗之此脈微弱而惡寒陽微之體亦無自愈之理桂枝湯所以和陽協麻黃則散余寒而解表邪法已備矣加石膏何為者為熱多耶乃熱多不過較多於寒若脈非微弱亦將如桂枝麻黃各半湯之欲愈而何熱之足慮然則加石膏者專為陽虛不任麻黃之發而以石膏制之化峻厲為和平也藥止七味皆傷寒重證之選而各大減其分數遂為治餘邪之妙法用石膏而不以泄熱如大黃之用以瀉心用以利小便同一巧也生薑多於他味者以能輔桂甘生陽又為石膏防弊也赤石脂石脂揭兩石中取之鄒氏云兩石必同根歧出而相併脂者黏合兩石之膠故所治皆同本異趨而不相浹之病得此乃匯於一處專力以化之仲聖所用石脂四方固與鄒說符合劉潛江不以東垣海藏瀕湖仲醇專主收澀為然就本經補髓益氣鬯發其義雖不如鄒氏之親切證明而所見自超抑愚竊有以伸之別錄於赤石脂曰補髓好顏色則其補髓確是腦髓與白石脂之補骨髓有別本經且主頭瘍何東垣但以為性降乎夫髓生於精精生於穀谷入氣滿淖澤注於骨骨屬屈伸泄澤補益腦髓是中土者生精化髓之源也而石脂味甘大溫補益脾胃質黏能和胃陰性燥復扶脾陽其所以上際則辛入肺為之所以至腦則酸入肝為之外臺述刪繁論凡髓虛實之應主於肝膽石脂確有補腦髓之理千金赤石脂散治冷飲過度致令脾胃氣弱痰飲吐水無時本事方云試之甚驗蓋即鄒氏所謂聯合其渙散者謂石脂為胃藥非脾藥可乎夫下之精秘則上之髓盈石脂補髓亦半由於秘精秘精易而補髓難故本經別錄皆於補髓上冠以久服字千金羌活補髓丸不收石脂而無比山藥丸曰此藥通中入腦鼻必痠痛勿怪入腦自指石脂而石脂未嘗專任可知虛損之難療而無近效也硝石芒硝硝石即火硝亦名焰硝芒硝硝之經煎煉而凝底成塊者為朴硝亦名皮硝在上生細芒如鋒者為芒硝均即水硝李瀕湖謂朴硝下走火硝上升火硝得火則焰生與樟腦火酒之性同本經言其寒別錄言其大寒實乃大溫劉氏引伸其說謂水硝治熱之結熱結多屬血分所謂陰不降陽不化者也能行陰中之陽結則陰降陽自化矣火硝治熱之郁熱鬱多屬氣分所謂陽不升陰不暢者也能達陽中之陰鬱則陽化陰自暢矣鄒氏又以火硝為性向陽解自陰而陽之盛熱水硝為性向陰故逐伏在陽之實結斯三家可謂發前人所未發矣雖然愚竊有未安焉陰陽之理至為微妙就物論物易圓其說以物合證與方而論之則難於確當難於瑩徹渾言之而深何如切言之而淺也火硝固上升而散固在氣分然其升散者為陰中熱鬱之氣非陽中熱鬱之氣病在陰經陰臟為陰病有陰邪亦為陰蓋其辛溫際上鹹苦入下凡在上在下之病胥治之而總歸於解陰中之熱鬱劉氏達陽中陰鬱一語得毋猶有可商試核之證來復丹二氣丹玉真丸皆陰邪中有伏熱金匱硝石礬石散尤彰彰者惟大黃硝石湯用以下奪不與升散之旨相戾歟乃其證為黃癉腹滿小便不利面赤熱為陽邪得濕而鬱且獨在裡裡實而表和是亦陰中之邪也陰中之邪非鹹苦何以得入舍芒硝用硝石者以表雖汗出而表間之濕熱自在硝石辛溫勝於鹹苦故於大黃柏梔下奪之中加茲一味以達表而散邪夫火硝之不易明者為其以溫治熱耳若水硝以寒治熱曰走血曰潤下曰耎堅曰破結固宜古今無異詞然亦何嘗易明哉大承氣調胃承氣桃核承氣洵可謂去血中熱結矣獨大陷胸湯丸用芒硝至一升半升而其所治為結胸縱云破結軟堅非多不濟獨不慮下降之物用之多不愈速其降耶是則有故矣芒硝乃煎硝時結之於上者細芒如鋒質本輕於朴硝味復兼辛寧無上升之性寧不入氣分後世且以治口舌咽喉諸熱證謂芒硝不能際上治上可乎由斯以觀劉氏陰中陽結之說恐亦有未然者仲聖有言病發於陽而反下之熱入因作結胸據此自非陰中之陽結又凡仲聖用芒硝之方皆陽證無伏陰用硝石之方則一證中有陰有陽然則行陰中陽結者乃硝石非芒硝芒硝者逐陽證之熱結者也芒硝鹹寒勝於苦辛多煮則下益速下速則遺上邪故仲聖必後納微煮而少揚之硝石辛溫勝於鹹苦微煮則升之亟升亟則不入下故仲聖於二升中煮取一升而少抑之此似二物正相對待劉氏於二物亦似以對待釋之而不知非也咸與寒皆陰也其微辛不過挾有升性並不能治陰邪咸與溫則陰陽異趣矣溫而兼辛辛溫而兼辛潤則必陰中有陽邪之證始克任之其中奧旨猝不易悟故曰非對待也抑劉氏以入血分為陰中乎血分為陰則大承氣當曰太陰病不當曰陽明病桃核承氣當曰少陰病不當曰太陽病芒硝蓋血藥而亦不專入血者與大黃頗有似處大黃味苦入心能開胸膈之熱結若與芒硝皆不宜於氣病胸膈之間其能堪此重劑哉鄒氏以火硝向陽水硝向陰為臟病移腑腑病移軀體之所以然此尤不可不辨者本經積熱曰五臟豈悉能入胃使脹閉病曰百病豈盡在於軀體謂火硝性向陽解自陰而陽之盛熱向陽自即入陽何以先入於陰寧得謂非其所向謂水硝性向陰逐伏在陽之實結所逐在陽所向亦必在陽反是則有異謀人固有之物所必無此等近似之談並無真理可求徒眩人目耳鄒氏更有誤者謂己椒藶黃丸加芒硝以治渴是去其痼癖正使津液流行小柴胡湯加芒硝以止痢是去其積聚正所以止下痢噫是亦不深思矣己椒藶黃丸之證原非固癖大黃決不止用一兩有方解詳大黃芒硝亦不後加況方後云先食飲服一丸日三服稍增口中有津液渴者加芒硝半兩是無芒硝津液非不能生豈加芒硝之津液與此有異耶徐氏尤氏皆云渴是胃熱故加芒硝鄒氏坐泥本經太過耳柴胡加芒硝湯云潮熱者實也熱實無不下之理以柴胡加芒硝湯主之即所以治熱實云納芒硝更煮微沸分溫再服不解更作加芒硝非欲其解而何鄒氏之說何與相反殆誤會今反利句耳不知仲聖明云微利明云下非其治下之而仍潮熱安得不以對證之下藥繼之此讀古書所以貴細心尋繹也甘草甘草中黃皮赤確是心脾二經之藥然五臟六腑皆受氣於脾心為一身之宰甘草味至甘性至平故能由心脾以及於他臟他腑無處不到無邪不祛其功能全在於甘甘則補甘則緩凡仲聖方補虛緩急必以炙用瀉火則生用雖瀉亦兼有緩意如治咽痛肺痿火在上焦者為多以其為心藥也甘草瀉心湯是瀉心痞非瀉心火瀉痞有黃連芩夏甘草特以補胃故炙用炙用而以甘草瀉心名湯者甘草之奏績可思也李東垣謂甘草生用瀉心火熟用散表寒散表寒之方無如桂枝麻黃二湯自汗者表虛故桂枝湯以桂芍散邪風薑棗和營衛無汗者表實故麻黃湯以麻桂散寒更加杏仁然解表而不安中則中氣一匱他患隨生故二湯皆有炙甘草以安中表實與表虛不同故二湯甘草亦分多寡可見用炙甘草者所以資鎮撫非以資摧陷也東垣不加分辨非示學者以準的之道東垣又云心火乘脾腹中急痛腹肉急縮者甘草宜倍用之按小建中湯治裡急腹痛甘草炙用病非心火乘脾生甘草瀉心火而不治心火乘脾之腹痛本經黃連主腹痛治心火乘脾之腹痛即仲聖黃連湯是東垣之說殊有未合劉潛江發心火乘脾之義而深贊之鄒氏又引東垣此說以證梔子甘草豉湯之虛煩不得眠不得眠豈是脾病三君皆名家而於甘草不細辨如是真為不解王海藏謂附子理中湯用甘草恐其僭上調胃承氣湯用甘草恐其速下按傷寒論無附子理中湯理中湯之附子腹滿則加腹滿而加附子蓋以其為中宮藥不可缺也若恐附子僭上則白通湯乃少陰下利用附子何以反無甘草至生用而不炙用則固有義在寒多之霍亂非全不挾熱溫中補虛既有乾薑參朮故加以生甘草之微涼即別錄除煩滿東垣養陰血之謂以是湯用於胸痹則生甘草亦因氣結在胸不欲其過守也調胃承氣湯是治胃氣不和之內實以調胃為下是下法之元妙者舍枳樸而取炙甘草以與黃硝一補一攻適得調和之義非止防其速下也海藏又謂鳳髓丹用甘草以緩腎急而生元氣竊謂亦非也是方不知制自何人名醫方論云治夢遺失精及與鬼交醫方集解云治心火旺盛腎精不固易於施泄其方義之精微則未有見及之者夫元陰聽命於元陽元陽聽命於天君故心火熾而感其腎腎感之而陽動陰隨有必然者黃柏靖腎中之火防腎中之水火不作則陽蟄水不泛則陰堅砂仁攝火土之氣於水而使腎得藏密然心腎二家交通最易治腎而不治心未善也生甘草瀉心火寧心氣大甘為土之正味且能止腎水越上之火洄溪語集解治心火旺盛一語實即用甘草之意若梢能去莖中痛則可謂之緩腎急而甘草身不與也甘草與人參皆能補中氣調諸藥而仲聖用於方劑則確有分別不稍通融姑舉二方以明之厥陰病有嘔吐則兼少陽仲聖法轉少陽之樞多以乾薑黃連並用余已著其說於乾薑乾薑黃連人參湯是以小柴胡湯加減乃舍甘草而用人參幾不可曉夫不曰食入口即吐乎少陽上升之氣得食即拒難緩須臾甘草甘壅詎能任受人參甘與苦均為和少陽之專藥樞機利則食自下甘草所以非其匹也其舍人參而用甘草者梔子豉湯治虛煩不得眠若少氣則梔子甘草豉湯主之此在粗工必以人參益氣矣庸詎知人參益氣而亦升氣梔豉湯之吐由二物一升一降之相激得人參則升不成升降不成降挾其補性反足窒邪夫懊憹者反復之甚少氣者懊憹之甚非元氣之有虧乃鬱熱之傷氣梔豉能吐去其邪不能安定其氣此仲聖所以有取於甘平清心火之甘草而人參亦不得躋其列也鄒氏以黃耆桂枝五物湯為治下治下制方宜急急則去甘草而多其分數桂枝加黃耆湯為治上治上制方宜緩緩則加甘草而減其分數於是於血痹則但摘尺中小緊句為病在下且別引本篇首條以證其治下之說不思尺中小緊下句身體不仁謂為非病寧有是理本篇首條本與本病不屬況有關上小緊句豈尺中小緊為病在下關上小緊亦病在下乎於黃汗則摘腰以上汗出句為病在上且別引本篇第二條以證其治上之說不思腰以上汗出下句腰臗馳痛小便不利謂非下體寧有是理本篇第二條非本條之病而引之則他條又有黃汗之為病身體腫汗沾衣等句亦得謂但指上體乎血痹篇尤注闡發宜針引陽氣句至為精審黃耆桂枝五物湯尤雲和營之滯助衛之行亦針引陽氣之意經所謂陰陽形氣俱不足者勿刺以針而調以甘藥也引經語解此方亦正切合夫血痹者痹在表不痹在裡以甘藥代針亦調其表非調其里耆桂薑棗甘與辛合所以補虛而宣陽芍藥佐桂則能入營而調血去甘草且加多生薑者不欲其中守而欲其解表也甘草中又有斟酌如此以非桂枝湯加減故不曰桂枝加黃耆湯然則桂枝加黃耆湯可不於桂枝湯一致思乎愚於黃耆已詳著於方之義甘草自是桂枝湯不可少之物安得去之桂芍減而甘草不減則陽虛之與邪風有異也鄒氏不悟仲聖制方之所以然而肆其臆說疵纇叢生無謂甚矣黃耆營氣始手太陰而出於中焦衛氣始足太陽而出於下焦營奉胃中水穀之精氣以行於經隧衛舉胃中水穀之悍氣以行於肌表黃耆中央黃次層白外皮褐北產體虛松而有孔味甘微溫葉則狀似羊齒明系由胃達肺向外而不中守有外皮以格之卻又不泄出獨莖直上根長二三尺故能由極下以至極上凡其所歷皆營衛與足太陽手太陰經行之境論其致用則未易一二明也劉潛江疏黃耆以治陽不足而陰亦不利之病不治陽有餘而陰不足之病與陽不得正其治於上陰即不能順其化於下四語最為扼要其解內經陽者衛外而為固陰者藏精而起亟雖稍落寬廓而理固如是乃鄒氏以陽不勝陰則五臟氣爭九竅不通與衛外起亟強為牽合不知衛生總微論以黃耆一味治小便不利乃提陽於上而陰自利於下也即經所謂起亟劉氏所謂順其化於下也五臟氣爭之九竅不通則是陰之爭而非陰之不利與此蓋毫釐之差耳黃耆與牛膝皆根長二三尺別錄皆言利陰氣惟牛膝一莖直下而味苦酸平黃耆一莖直上而味甘微溫故牛膝利陰氣是下利其陰氣黃耆利陰氣是從陰中曳陽而上而陰以利牛膝有降無升黃耆有升無降皆屢驗不爽劉氏謂黃耆先自下而上又自上而下鄒氏謂黃耆能升而降能降而升此蓋黃耆疏營衛之後營衛則然黃耆無此狡獪也凡藥之用宏而不專主於一者辨之不精即致貽誤如黃耆補表而不實表不實表故不能止汗如人參之屬疏表而不解表不解表故不能發汗如麻黃之屬其亦能止汗發汗者則借黃耆疏通營衛調和陰陽之力也金匱方黃耆無不生用後世多以蜜炙然遇中虛之證炙使向里尚無不可陳修園乃更分為鹽水酒醋諸炒法則大拂其性矣繆仲醇謂黃耆功能實表有表邪者勿用豈知黃耆惟不實表故表邪亦有用之者如本經之排膿止痛金匱之治風濕風水黃汗皆堪為不實表之據若傷寒之邪宜從表泄黃耆雖不實表而亦無解表之長且有補虛羈邪之患斷非所宜也足太陽脈上額交巔黃耆入太陽經故能上至於頭膀胱與腎為表裡故亦能益腎氣以化陰而上升凡方書治尿血等證皆是汪訒庵云陰虛者宜少用恐升氣於表而里愈虛斯言得之矣試以金匱用黃耆諸方言之小建中湯尤在涇詮解之精實勝諸家惟黃耆建中湯加黃耆兩半第視為充虛塞空則失之泛矣諸不足三字所該者廣營衛二氣豈能升降無愆芍藥用至六兩意在斂里破脾結加黃耆則為疏營衛之氣俾胃中津液得輸於營衛而無阻核之黃耆桂枝五物湯黃耆與生薑俱較此加倍且減芍藥去甘草顯為宣通血痹而然豈建中加黃耆是徒取補塞乎桂枝加黃耆湯之黃耆則尤非徒補之謂矣黃汗與中風汗自出之汗同為邪汗同宜化邪汗為正汗桂枝湯正的對之方然黃汗由於陽虛與桂枝證之但須泄邪者瘥有不同故減少桂芍而加疏表補虛之黃耆以泄邪而化氣至腰臗痛身重小便不利則由陽不下通尤非黃耆不能下疏其衛黃癉脈浮亦用之者正以黃耆為太陽藥也然則耆芍桂酒湯何為抑之以苦酒哉蓋黃汗同而身腫不同渴亦不同腫則陽微表虛不任汗解渴則水氣鬱於三焦腎陰不得上朝自當以通陽化氣瀉水為亟耆芍桂枝取以通陽而化氣苦酒則泄熱瀉水而下達三物得之由三焦一氣直下也去生薑者不使橫擴也去甘棗者恐其中停也用黃耆特多則因其虛以補劑驅邪故須六七日乃解無速效也防己黃耆湯治汗出惡風而不以桂枝湯加減者以彼無濕此有濕也風水亦用此方以與風濕無異也風濕例用麻桂而此不用者蓋彼為身痛此則身重身痛者風盛而喜動身重者濕盛而喜靜脈浮則邪仍在表表可不解乎然汗已出而虛虛可慮濕可不驅乎然濕即去而風必愈淫惟防己解肌表之風濕直泄而不橫泄黃耆宣營衛之壅蔽疏表而亦補表脾土強則能勝濕故佐以術甘薑棗多則妨身重故減其分數又以後坐被上被繞腰下助下焦溫化之氣而邪得以微汗而解視夫徒知發汗利水補虛而不能與病機相赴者真有霄壤之別皮下例宜發汗而防己茯苓湯雖水氣在皮膚中而脈不言浮四肢則聶聶動而腫經云肉蠕動名曰微風是水浸其脾脾陽不能達於四肢而又為微風所搏故動而腫動而不痛脈不浮則發汗非宜防己為風水要藥偶以茯苓使直泄於小便病在皮膚非黃耆不能益氣疏表故加之辛甘合而生陽加桂草者又兼以治其本也汗出表虛而宜止汗之證而四逆加人參與茯苓四逆諸湯仲聖用人參不用黃耆以參能實表耆不實表也感傷風寒而宜發汗之證如桂枝與麻黃諸湯仲聖絕不加耆以表有邪非表之虛也表有邪而挾虛者則參不宜而耆為宜然耆能直疏不能橫解且性味甘溫驅邪豈其所勝故風濕風水黃汗等證仲聖用黃耆亦只為防己茯苓之輔而已惟補虛通痹則耆之專司故黃耆建中湯黃耆桂枝五物湯皆以黃耆統率全方仲聖之辨藥可謂精矣後世用黃耆為表劑而至當者無如唐書許允宗之治柳太后病風以黃耆防風煮數十斛於床下蒸之藥入腠理一周而瘥此必尚有外證可憑故開手即以解散風邪為治經云邪之所湊其氣必虛又云大氣一轉邪風乃散夫補虛散邪法亦多端而黃耆防風收效若是之捷者何也病者脈沉口噤自屬經絡機竅為風邪所中陽虛而陰壅大可想見黃耆非風藥而補陽利陰通其氣道厥有專長防風得之乃克由陽明達表大驅其風此其得訣在認定脈沉可任黃耆否則遇中風脈浮汗出而用之不愈助其虐乎宋人許叔微醫學至深而其用黃耆則似不如允宗之當本事方載邱生病傷寒尺脈遲弱叔微謂未可發汗而以黃耆建中加當歸先調其營血極為有見然尺弱宜兼益腎陰而用由太陽上升之黃耆不無可商好在黃耆兩半而芍藥則倍之故服至五日而尺部亦應也陸定圃冷廬醫話載許辛木部曹謂其嫂吳氏患子死腹中渾身腫脹氣喘身直其兄珊林觀察檢名人醫案得一方以黃耆四兩糯米一酒鍾水煎與服即便通腫消已爛之胎成十數塊逐漸而下一無苦楚又山陰王某患腫脹自頂至踵皆遍氣喘聲嘶大小便不通許亦告以前方煎一大碗服盡而喘平小便大通腫亦隨消繼加祛濕平胃之品至兩月後獨腳面有錢大一塊不消更醫痛詆前方迭進驅濕猛劑竟至危殆仍以前方挽回用黃耆至數斤腳腫全消而愈黃耆治腫脹有此大效得不詫為異事然此亦仲聖早有以示人者金匱凡水濕之證身重身腫皆不禁用黃耆皆使水濕下行許氏所治亦是水腫內經三焦為水道膀胱為水腑黃耆從三焦直升至肺鼓其陽氣疏其壅滯肺得以通調水道陰氣大利此實黃耆之長技其腳面之不易消與用耆至數斤蓋由僅仗此一味而制方之道猶有所歉也人參一物而譭譽交集者惟人參為最好補之家多譽好攻之家多毀其譽者復有補陰補陽之各執而不知皆非也徐洄溪鄒潤安則能得是物之性用矣徐氏云人參得天地精英純粹之氣補氣而無剛燥之病又能入於陰分鄒氏云凡物之陰者喜高燥而惡卑濕物之陽者惡明爽而喜陰翳人參不生原隰汙下而生山谷是其體陰乃偏生於樹下而不喜風日是為陰中之陽人身五臟之氣以轉輸變化為陽藏而不泄為陰人參兼變化藏守之用且其色黃味甘氣涼質潤合乎中土脾臟之德所由入後天而培先天也至論病之何以需參參之何以愈病則二家猶未得其當而陶隱居功同甘草之說為有見矣蓋甘草者春苗夏葉秋花冬實得四氣之全而色黃味甘迥出他黃與甘之上故能不偏陽不偏陰居中宮而通經脈和眾脈與人參有相似之處竊謂得此一言可以測參之全量雖然病之非參不治者詎能代以甘草甘草自甘草人參自人參欲知人參之真非取仲聖方融會而詳辨之庸有冀乎少陽為三陽之樞少陰為三陰之樞凡言樞者皆一經中有陰有陽入則為陰出則為陽猶樞機之轉移少陰水臟而寓君火固陰陽兼具矣少陽似有陽無陰然藏於肝葉是一陽初生而尚不離乎陰故二經相感極易肝病有熱即挾膽火膽病有寒即挾肝風肝氣之上逆即膽膽氣之下降即肝往來寒熱雖少陽病卻非全不涉肝以陽之稚不能竟遠乎陰而有出入相爭之象也爭則宜解宜和人知小柴胡湯為少陽和解之劑不知柴芩專解邪參乃所以和之病兼陰陽何以解之第有寒藥蓋此固少陽勢重退少陽則厥陰自靖且有人參調停其間何患寒熱之不止參為少陽藥有鑿鑿可據者瀉心湯心煩無參而脅下有水氣則用之胸痹諸方無參而脅下逆搶心則用之即小柴胡湯有加減法而獨於嘔於渴於脅下痞硬不去參此可知人參為和少陰之專藥矣少陰之貴於和者躁是也煩出於心躁出於腎故梔子豉湯黃連阿膠湯治煩無參煩不必兼躁躁則必兼有煩煩與躁兼則有陽證有陰證陽證乃太陽表實陽明腑實之下侵及腎非腎自病故大青龍湯大承氣湯治煩躁無參陰證則為腎病上干及心腎陽幾亡腎陰豈能獨善故吳茱萸湯茯苓四逆湯治煩躁有參又可知人參為和少陰之專藥矣用參於和有和其本腑本臟之陰陽者少陽少陰是也若乾薑黃連黃芩人參湯則以證有寒熱而和之木防己湯則以藥兼寒熱而和之桂枝人參湯所以聯表裡之不和生薑瀉心湯所以聯上下之不和大建中湯又以椒姜之溫燥而化之使和和之道不一而不善用之則有不如甘草驅使之易者矣心為牡臟煩而補之則煩彌甚然小柴胡湯煩而兼嘔不忌煩而不嘔去半夏人參謂煩而嘔則不去也徐氏傷寒類方注誤白虎加人參湯煩而兼渴不忌以嘔渴皆少陽木火為之生其津以和之而煩亦自已也胸脅滿硬嘔吐各有正治之藥用參特以和陰陽耳然生津止渴則參有專長不必定用於少陽故津為熱劫之陽明證白虎加人參湯亦用之土虛而津不生之太陰證理中丸亦用之若渴飲而有水蓄於中小便不利者參則不過問也止渴有不需參之證生脈則惟參獨擅蓋脈生於營營屬心心體陰而用陽惟沖和煦育之參能補之故白虎加人參湯之暑病脈虛脈不虛者必有兼證非正暑病也四逆加人參湯之脈微通脈四逆湯之脈不出炙甘草湯之脈結代皆必得有參參之力入腎者輕入心者重故足少陰得其和手少陰得其補亦可為陰中之陽之一證矣參之功在補虛雖止渴亦補然止渴與生脈第證狀之顯著者耳參之補豈止是哉其色黃其味甘其全神自注於脾而擴之又能無處不到故建中湯之名在飴不在參以參之不可以一得名也今試約舉仲聖方之用為補者而言之補脾如理中丸黃連湯參治腹中痛補胃如大半夏湯甘草瀉心湯許氏內臺方有人參補肺胃如竹葉石膏湯補肝如烏梅丸吳茱萸湯補心已列如上他如薯蕷丸溫經湯之補殆不勝其指數參之補可不謂廣也乎心痞最不宜參然以參佐旋覆姜夏則參可用於散痞矣腹脹最不宜參然以參佐厚朴姜夏則參可用於除脹矣參能實表止汗故有表證者忌之若汗出後煩渴不解於寒劑中用之何妨參能羈邪留飲故咳證忌之若肺虛而津已傷於散邪蠲飲中用之何妨參治往來寒熱似瘧皆可用參矣然外有微熱即去參外臺於但寒但熱寒多熱少之瘧亦俱無參惟瘧病發渴者用之蓋補虛則助邪寒熱不均則不可以遽和人參止渴輔芩栝之不逮也參惟益陰故能生津利不止雖脈微欲絕亦不加參以利則陰盛而參復益之也然下與吐兼或吐下之後其中必虛津必傷參又在所必需蓋中土有權則上下悉受其範而不敢違戾也徐洄溪以邪正之分合定人參之去取鄒潤安更指小柴胡湯之去參為邪合之據桂枝新加湯之有參為邪分之據論似精矣而實有不然也身有微熱邪尚在表若又加以實表之參則邪益膠固而不解故必須去之新加湯發汗後其表已虛不慮參之實表脈沉遲尤宜參之生脈以身疼痛之表邪未盡故尚需桂枝湯驅邪惟不能斂外散之氣振內陷之陽加芍藥則散者斂加生薑則陷者振更加以參則脈不沉不遲表不虛合內外同歸於和此二方去參加參之所以然而徐氏鄒氏未見及此不知參者善和陰陽專用以和正不用以驅邪於驅邪之中而加以參稍一不當害即隨之故必得如新加湯驅邪之他藥不致以人參墮其功和正之人參且能為他藥弭其隙始為真知參而用之無誤況邪正之分合當以去某經入某經及病氣之進退衰旺為言不當以一證一脈判邪正定分合傷寒之邪不與正俱陷而終駐於表者未之有也何鄒氏之疏耶傷寒溫熱兩證參之出入關係極重仲聖之法亦極嚴後人得之則效失之則不效竟有彰彰難掩者試更詳之傷寒有表證者仲聖絕不用參不特麻黃大小青龍桂枝等湯絲毫不犯也即小柴胡湯外有微熱亦且去之黃連湯有桂枝而並無表證桂枝人參湯有表證而參不以解表柴胡桂枝湯表裡之邪俱微故表裡兼治表裡兼治故用參以和之此傷寒定法也溫熱病仲聖不備其方而要旨已昭然若揭黃芩湯後世奉為溫病之主方未嘗有參白虎湯治陽明熱盛效如桴鼓亦未嘗有參必自汗而渴且無表證者用之此溫熱定法也迨自隋唐而降仲聖法漸置不講相傳之方如活人書之人參順氣散獨活散未見有宜用參之候許叔微以白虎湯為治中暍而不加參皆誠有可議然其他變仲聖方而不失仲聖法者不可勝舉如以羌防取傷寒之汗蔥豉取溫熱之汗俱不佐參其佐參者五積散邪兼表裡攻其邪復和其正栝蔞根湯則以渴甚參蘇飲則以脈弱升麻葛根湯則以脈弱而渴至萎蕤飲治風熱項強急痛四肢煩熱參似不宜矣而以蔥豉散外萎蕤清裡因風熱爍津故加人參以和表裡而生津凡襲用之佳方未有能出仲聖範圍者至敗毒散方書有無人參者其原方本有人參無表裡上下應和之故而欲扶正以驅邪過矣乃喻西昌以治其時大疫倍加人參得效則非法之法仍以仲聖方為根據何以言之蓋值饑饉兵燹之餘正氣啙敗幸其虛非勞損之虛又用之於群隊表藥補之所以有功仲聖以白虎湯治中暍因虛而加參正是此意然傷寒有表證之虛與溫熱身熱之虛不同為禍為福消息甚微審辨不易彼於原方刪人參者其亦有見於此矣以上所言人參之治惟真正大參試之甚驗若今之黨參有甘無苦何能與人參比烈即別直等參亦未足言沖和煦育之功要其為補皆與人參相近故防誤用之弊亦當與人參並視也沙參本經沙參主血積驚氣除寒熱血積二字惟徐氏最為得解云沙參為肺家氣分中理血之藥色白體輕疏通而不燥潤澤而不滯血阻於肺者非此不能清之曰理血曰血阻曰清之恰合沙參治血之分際與桃仁為肺藥而主瘀血之閉者大有不同熱傷其氣斯氣阻而血亦阻心以擾亂而有驚氣營衛愆其度而有寒熱非甚重之證故得以沙參主之別錄演之為療胸痹則失其實矣沙參生於沙磧而氣微寒色白而折之有白汁莖抽於秋花開於秋得金氣多味微甘則補肺中之土微苦則導肺氣而下之金主攻利寒能清熱復津潤而益陰故肺熱而氣虛者得之斯補血阻者得之斯通驚氣寒熱鹹得之而止肺惡寒咳嗽由肺寒者多故徐氏戒用沙參然衛生方用沙參一味治肺熱咳嗽曰肺熱則有風寒外感與素有內寒者自不相宜若用於肺熱何害桔梗桔梗能升能降能散能泄四者兼具故升不逮升柴降不逮枳樸散不逮麻杏泄不逮硝黃蓋其色白味辛氣微溫純乎肺藥肺惡寒惡熱而中心微黃味又兼苦則能由肺以達腸胃辛升而散苦降而泄苦先辛後降而復升輾轉於咽喉胸腹腸胃之間本經所以主胸腹痛如刀刺腹滿腸鳴幽幽別錄所以主利五臟腸胃咽喉痛也桔梗實不入腎仲聖桔梗湯治少陰病咽痛是腎家邪熱循經而上肺為熱壅以桔梗開提肺氣佐甘草以緩之自然熱散痛止並非治腎鄒氏之論極是氣為血帥氣利則血亦利故桔梗湯並主血痹推之排膿與治肺癰治結胸仲聖諸方無不與本經吻合即肘後方治腸內瘀血丹溪治痢疾腹痛亦只如其分以任之耳物理至微古聖何能盡言得其旨而擴之方為善讀古書易老舟楫之劑載藥不沉之說大為張隱菴所訾其實桔梗降而復升性與肺比不易下沉外科於上焦癰瘍所以非此不可洄溪評外科正宗無異言且易老以為舟楫之劑者與甘草同用也桔梗得甘草自更羈留於上名之為舟楫何害至備要表散寒邪一語桔梗豈勝發汗之任驟閱之不無可詫然古方表劑固多用之蓋其開提氣血通竅宣滯與羌防橘半等為伍殊有捷效鼻塞尤宜惟屬以偏裨之任則可若竟恃為表劑則不能無弊又徐氏謂咳證用桔梗是宋以後法升提究非所宜不知肺苦氣上逆而氣逆之因不一若肺感風寒氣不得宣而逆而咳非開肺鬱而提出之曷云能瘳況桔梗白散治咳而胸滿載在外臺洄溪蓋嘗譏葉氏未閱外臺者何遂忘之謂是宋後法也桔梗與芍藥皆能治痢疾腹痛惟桔梗是治肺氣之鬱於大腸散而上行芍藥是治脾家血中之氣結破而下行若非滯下之痢二者皆不相宜傷寒金匱兩書凡云利者即是瀉非今之所謂痢痢則必加下重字以別之故真武湯若下利者去芍藥四逆散治泄利下重不去通脈四逆湯治下利清穀本無芍藥腹中痛始加之以其為姜附之佐於裡寒無傷也咽痛去之者芍藥不能散上結之陽也桔梗之加全為咽痛雖不治利而利時不去與芍藥不去之意正同利不止無怪脈之不出利止而脈不出則桔梗之散大有妨於生脈與芍藥之有妨咽痛亦同故必須去之而加生脈之人參此仲聖或去或加之所以然也鄒氏不達而謂芍藥止腹痛下利桔梗亦止腹痛下利誤之至矣知母知母為肺胃腎三經清氣熱之藥潔古東垣丹溪咸以知母與黃柏為滋陰之品後人遂視為補劑知母之潤雖不似黃柏之燥然寒滑下行使熱去而陰生則有之究無補性能益陰之不足即以瀉邪火亦當適可而止否則降令太過脾胃受傷真陽暗損誠有如李瀕湖所言者知母本經主消渴千金外臺固恆用之仲聖則更有精焉止渴如五苓散豬苓湯文蛤散皆無知母白虎湯有知母而無渴證加人參乃始治渴蓋以陽明熱盛清熱誠要然膏知無益陰生津之能於清熱之中再加以人參則病去而正即復其用意之周密千金外臺且遜之況他人乎桂枝芍藥知母湯仲聖之用知母即本經所謂除邪氣肢體浮腫下水者鄒氏解之但以知母為治火阻於下則未免膚淺試歷引他說以補之張隱菴云知母皮外有毛故除皮毛之邪氣肉厚皮黃兼得土氣故治肢體浮腫張石頑云除邪氣肢體浮腫是指濕熱水氣而言葉香岩云腎惡燥燥則開闔不利而水反蓄知母寒滑滑利關門而水自下合觀三說而此方之用知母可曉然矣白朮鄒氏云脾主升舉清陽胃主通降濁陰皆屬土而畏濕術開花於初夏結實於伏時偏於濕熱瀰漫之際顯其有猷有為確知其入脾胃能力固中氣外御濕侮矣劉氏亦脾胃同論而以為先胃而後及脾張隱菴則專主益脾而不及胃竊思胃為陽明燥金脾為太陽濕土土必名濕者即隱菴所謂土有濕氣始能灌溉四旁如地得雨露而後發生萬物也白朮味甘多脂有似濕土非脾之正藥而何其肉白老則微紅味復帶辛故能由脾及胃而達肌表別錄云暖胃潔古云除胃熱皆是除濕土之或過功效所及非正治其胃也白朮除脾濕固中氣為中流之砥柱其散表邪非輔以麻黃桂枝附子之屬不能由肌肉而透皮毛蓋其味厚而甘擅長於守也麻黃桂枝附子為走散風寒之劑加以白朮除濕則為治風濕治寒濕無濕不加故麻黃桂枝附子多用於傷寒太陽病而術惟有水氣始用之鄒氏云仲聖治風寒濕痹方多有不用術者以術於風勝濕勝者為最宜寒勝者差減蓋風勝必煩濕勝必重金匱中治痹用術諸方非兼煩必兼重或云身煩疼或云身體疼煩或云骨節煩疼掣痛或云腹重或云頭重或不煩不重而云身體疼手足寒骨節痛是析風與濕與寒而三之矣不知仲聖方言煩者未嘗不兼濕言重者未嘗不兼風言寒者未嘗不兼風與濕核諸本經主風寒濕痹無不吻合鄒氏徒泥於字面而不知細審遂並白朮性用而胥失之矣凡仲聖方用桂至四兩必為利小便與下腎邪桂枝附子去桂加白朮湯又明云大便硬小便自利去桂大便不硬小便不利當加桂是桂枝之能利小便無疑矣乃尤氏解此方云大便硬小便自利知其人在表之陽雖弱而在裡之氣自治則皮中之濕所當驅之於里使水從水道而出不必更出之表以危久弱之陽故去桂枝之辛散加白朮之苦燥合附子之大力健行者於以並走皮中逐水氣夫去桂以小便利也今去桂而猶欲驅濕從水道出不知其意何居況既云當驅之於里不必更出之表而又云加白朮合附子以並走皮中逐水氣不仍出之於表乎是尤氏於本條語意全未體會鄒氏之說差勝於尤而亦未見其當其解去桂加朮也曰脾健則能制水水在內能使下輸膀胱而大便實水在外能使還入胃中而大便濡夫謂使在內之水下輸膀胱實非術之能事仲聖加朮正取其不利小便謂使在外之水還入胃中則殆以大便硬而更崇其土理不可曉作此當然之想耳按仲聖云三服盡其人如冒狀勿怪此以朮附並走皮中逐水氣未得除故使之耳可見朮附並用是使水從表除不從里泄即水不還入胃中之據或謂如大便硬何曰小便數者大便必硬此小便自利即小便數也皮中之水不當留而留水府之水當留而不留脾不舉其職而腸胃與膀胱之傳化咸乖矣去桂加朮則小便節而本有之津液不隨之而亡亦脾職復而後致之津液可由是而裕水濕外除津液內蒸誰謂白朮之加不足以濡大便哉白朮大明主反胃利小便潔古主生津止渴殆不善會仲聖方而致誤耳五苓散藥止五味而交相為用中多奧旨夫所謂脈浮發熱者表證也煩渴小便不利者里證也太陽表邪化熱傳本因而渴飲因而水蓄不化因而小便不利解表止桂枝一味治里亦第利水而不滌熱且利水用至四味不更助燥增熱乎要知表未全解尚屬陽中有陰不似陽明病可任寒藥水為陰邪非辛甘溫不化桂枝雖不以利水而化氣必藉桂枝豬苓茯苓亦太陽藥協桂枝則利水而亦解表五味分兩皆甚少且以散服多飲暖水為出汗計者至矣而治里之法即具於其中桂枝最少欲其達表澤瀉最多取其咸降更以白朮一味益中氣收水濕安靖上下而後表無不解水無不行表解水行則熱自撤渴自止若謂術能止渴利小便則實非其所長茯苓澤瀉湯治胃反吐而渴欲飲水胃反是脾傷不磨並挾飲邪故以白朮健脾勝水非以止胃反生薑半夏為治嘔吐之專藥方有生薑無半夏者以渴忌半夏也白朮味甘多脂原能生津觀桂枝附子去桂加白朮湯之治大便硬可見然其性燥用於有水濕之證誠能使脾運而津生若陰虛津枯責效於白朮則白朮謝不敏矣術之或去或加見於理中丸者為多欲明用術之道於此求之思過半矣曰臍上築者腎氣動也去朮加桂四兩腎氣動是欲作奔豚之徵兆以桂四兩降而泄之原有成法見於傷寒金匱兩書加桂可矣去朮何為夫土能制水故千金以白朮治髓溢似此證正宜崇土然術能御之不能泄之不去朮則術橫亙於中足以掣桂之肘此加桂所以必去朮也曰吐多者去朮加生薑二兩下多者還用術豬苓湯五苓散茯苓澤瀉湯皆有吐不去朮生薑瀉心湯黃芩湯四逆湯白通湯皆有下利不用術茲何為不然不知此為寒霍亂言耳吐多者吐多於下下多者下多於吐吐多於下則里濕尚輕而胃逆為甚加生薑是以辛散之去朮為甘壅也下多於吐則脾濕重矣健脾除濕非術不可故吐多去之而下多必還用之曰渴欲飲水者加朮足前成四兩半術非治渴之物此不特不去而更加於前數何故蓋理中所以溫中所以治寒多不用水之霍亂今渴欲飲水自非燥熱之渴乃因吐利重喪其津而脾弱不振也是雖有參以生津而參以氣勝術以味勝味勝者培中土而滋化源尤為得力故不加參而加朮也曰腹滿者去朮加附子一枚洄溪謂陽虛尤氏謂氣脾鄒氏謂脾實按證是脾寒金匱有腹滿為寒之文又觀所加為附子其為陽虛無疑若是脾實則當與以厚朴七物大柴胡大承氣之屬與此懸絕矣四逆溫腎用姜附此溫脾亦用姜附蓋腎寒陽虛必侵及脾故以姜輔附脾寒陽虛其源由腎故以附輔姜其必去朮者陽虛必氣滯白朮甘壅去之為宜是則尤說為尚得其半也別錄術除心下急滿一語須連上消痰水看然術不能獨任其責亦惟中虛者宜之金匱云病痰飲者當以溫藥和之苓桂朮甘湯四味皆相協以成功無一味可缺用於傷寒則茯苓增一兩以急下其水白朮減一兩以微損其壅為其氣衝故也而要非吐下之後未必以術補虛桂枝人參湯證兼心下痞硬而其用術也以數下之後利下不止虛亦甚也惟桂枝去桂加茯苓白朮湯表證未罷而去桂心下滿痛而加朮幾令人不解然服桂枝湯或下之雖不切中病情而病氣亦已衰矣頭項強痛翕翕發熱而脈不雲浮亦不惡寒惡風翕翕乃微開微闔之象是未可與頭痛發熱並論者獨水停心下滿而微痛無汗而小便不利邪無從出為是證之關鍵蓋太陽為寒水之府頭頂乃太陽經脈之所至若非水停心下前服桂枝湯即強痛可除其不除者半由寒水之不下行也桂枝一味無汗固忌不治表亦無需乎桂故去之利小便當首推茯苓故加之水氣因陽氣不充而停不益其氣病機不轉術益氣而除濕故加之雖然甘壅之術非滿痛之心下所宜其所以得收其效者獨賴有芍藥以斂之耳況術為脾家准對之藥得芍藥自疾趨而入脾得茯苓又相協而利水水行則滿痛必除太陽之微邪何至仍踞於表甘草乃白朮補虛之佐使薑棗調營衛使邪無所容亦足代桂枝而宣力術固不能獨治心滿也別錄術主大風在身面其所謂風即海藏謂術補肝風虛之風劉氏云陽虛陰蓄久而陰不化則陽從之而化風是謂風虛又云陽蓄陰中則氣虛氣虛則生濕是術之治風仍不離乎濕金匱附近效朮附湯一方即治風虛之證也別錄又主風眩頭痛目淚出下句接以消痰水蓋以風眩本於痰水消痰水即所以治風眩鄒氏謂濕與水與飲是一源三歧歷舉金匱治眩與治濕治水各方以證之並謂本經止汗除熱多系風濕相搏之證如五苓散防己黃耆湯甘草附子湯皆止汗除熱之驗而不得用於溫熱之汗出身熱洵屬確論然其於金匱有不得其解者謂小半夏加茯苓湯治飲眩而不用術以心下痞故夫小半夏湯治嘔吐之方也藥止三味而必以小半夏加茯苓名之明乎此以止嘔吐利水為治也雖然嘔吐因膈間有水因膈間有水而眩悸皆術所宜從事即心下痞因飢而得者亦何嘗忌術乃絕不許術闌入其間誠不可解愚蓋細思而得其故焉仲聖下字皆極有斟酌嘔吐而曰卒卒字詎容忽過嘔吐由於卒致則必膈間本無宿水或因清陽偶弛飲停不化遂胃逆而為嘔吐脾固無恙無慮其虛以姜夏宣陽降逆於上茯苓利水於下足以療之而有餘若再以甘壅之術橫於膈間則非徒無益而又害之矣枳實薤白桂枝湯之治胸痹也曰人參湯亦主之一證而虛實不同藥即攻補相反術之宜與不宜不益可見哉黃連王海藏云黃連瀉心實瀉脾劉氏釋之謂中土為心之用心之用病即病乎心是直以心病統歸之脾病矣脾病固能傳心心病豈能不傳脾夫苦入心火就燥黃連苦燥而寒誠為手少陰除濕熱之藥而其花黃實黃根黃脾與腸胃亦皆其所司特氣味俱厚惟治血熱不治氣熱故其功用首在心脾次及腸胃腸胃所治亦屬血中之熱肝腎亦得以黃連治者蓋其莖葉隆冬不雕根則狀如連珠稟寒水之氣而直抵極下也其為入血更不待言矣本經黃連主腹痛黃芩不主腹痛顯以黃連為足太陰藥金匱小柴胡湯腹中痛去黃芩黃連湯腹中痛不去黃連正與本經適合然黃連湯是以乾薑人參治腹痛黃連半夏治嘔吐說詳大棗嘔吐為胃病而胃熱必侵其脾故腹痛亦非純寒之證兼有借於黃連黃連所以標方名者以病由胃中有邪氣明黃連之所獨擅也諸瀉心湯大黃黃芩或用或否黃連則無不用心痞固非黃連不治與乾薑並用則為除胃熱之心痞倚任之重厥由於是乃大黃黃連瀉心湯附子瀉心湯名為瀉心而加以大黃蕩實幾令人疑然而無庸疑也二物同能瀉心同能除胃熱惟黃連燥而不走協大黃則走漬以麻沸湯而不煎且須臾絞汁不使藥力得盡正是攻風痞之妙法他處用以蕩實者曾有是乎尤在涇云陽經之寒變為熱則歸於氣陰經之寒變為熱則歸於血陽經之熱或有歸於血者陰經之熱則必不歸於氣此即陰經之寒變熱而以血藥泄熱者所謂氣痞蓋血中之氣也心下若按之不濡脈若不浮不得謂之氣痞必不藥漬而不煎脈浮在關上又即胃熱用大黃黃連之所以然是方與論固兩相針對矣至附子瀉心湯寒熱互治人所易曉獨又加黃芩何耶蓋附子氣藥浮中沉無所不至劉河間所謂烏附氣暴能衝開道路者以大黃黃連攻痞而下泄附子扶陽而上行譬之剿匪夾擊之後難保無有餘匪之竄逸者加黃芩所以除氣熱之由夾擊而致者也凡仲聖方計慮之周類多如是何見及者之鮮哉以大黃輔黃連之不逮推其法以治滯下變漬為煎亦屬大妙張潔古制芍藥湯用黃連木香於芍藥大黃之中頗得仲聖之意直指之香連丸則少遜矣蓋黃連苦燥木香苦溫皆氣味俱厚二物並用未足以相濟而不免於實腸劉氏甚贊此方謂氣虛而有熱者舍寒涼無以為治但寒涼必益其虛和以木香則寒涼更得奏功竊謂木香固能調氣然不能調氣虛有熱之氣即寒涼藥黃連與大黃亦殊不同繆氏論木香云肺虛有熱者慎毋犯之劉氏何不審之甚抑香連丸在直指不得謂無深慮也黃連二十兩以吳茱萸炒令赤去吳茱萸不用木香四兩八錢不見火醋糊丸配合炮製悉有法度總不欲以苦燥苦溫之性滯於腸間後人紛紛加減大失其旨粗工又於病者初起而用之閉門逐賊鮮有不蒙其害者矣昔人以芍藥治腹痛為土中瀉木余主鄒氏破陰結之說獨謂以木疏土說詳芍藥若黃連治腹痛真乃土中瀉木矣夫肝與膽為表裡熱必屬膽寒必屬肝熱而不上衝則為肝陽乘脾腹乃作痛左金丸治脅痛之方也而以治腹痛極效抑青丸亦然一以吳茱萸一兩佐黃連六兩一以吳茱萸湯浸黃連一宿蓋肝主疏泄二味合用使肝熱下泄而脾土得安此固為土中瀉木矣即就黃連思之黃為燥金苦能達下亦具有制木之義第以吳茱萸佐之更開其去路耳黃連之用見於仲聖方者黃連阿膠湯瀉心湯治心也五瀉心湯黃連湯乾薑黃連黃芩人參湯治胃也黃連粉治脾也烏梅丸治肝也白頭翁湯葛根黃芩黃連湯治腸也其製劑之道或配以大黃芍藥之泄或配半夏栝蔞實之宣或配以乾薑附子之溫或配以阿膠雞子黃之濡或配以人參甘草之補因證制宜所以能收苦燥之益而無苦燥之弊也黃芩人知黃芩為少陽藥而不識其所以然竊思其色青勝於黃得甲膽之氣又中空似膽府氣寒能清膽熱膽屬少陽相火相火者佐君而行其令者也人賴此火以動作云為故氣分之熱少陽為多治氣熱之藥亦惟黃芩為方中易見金以黃為貴而黃屬土黃有土金相兼之德故黃芩亦入肺胃與大腸表裡之熱無不能解本經所以主諸熱黃疸腸澼泄利也黃連入心脾而心脾皆主血黃芩入膽肺而膽肺皆主氣鄒氏三偶之說全然未當即如黃芩湯是用黃芩清少陽氣熱其加芍藥亦非用以入血說詳芍藥本經黃連主腸澼腹痛黃芩主腸澼不主腹痛觀仲聖黃芩湯黃連湯之治正相符合蓋腹痛為太陽病或寒或熱必涉於血黃連入脾清血熱而兼入心胃故治腹痛亦治腸澼黃芩為膽經氣藥能由肺達腸胃而不能入統血之脾故治腸澼不治腹痛潔古以為治脾濕者未之詳審也柴胡人身生髮之氣全賴少陽少陽屬春其時草木句萌以至鬯茂不少停駐然當陰盡生陽之後未離乎陰易為寒氣所郁寒氣鬱則陽不得伸而與陰爭寒熱始作柴胡乃從陰出陽之藥香氣徹霄輕清疏達以治傷寒寒熱往來正為符合鄒氏所謂鬯郁陽以化滯陰也凡證之涉少陽者不獨傷寒也如嘔而發熱嘔屬少陽也熱入血室寒熱有時屬少陽也論凡三條惟此用小柴胡湯大柴胡湯下用柴胡心下滿痛屬少陽也至治勞用柴胡寇氏執定虛損而受邪熱有熱者始可瀕湖駁之則以勞在少陽與他經有熱者悉宜之鄒氏又以二家之說皆似勞非勞如金匱所謂五臟虛熱之熱其虛勞之宜柴胡與否仍置不論竊謂虛勞而用柴胡仍當以少陽為斷少陽與厥陰離合只在幾微熱則為少陽寒則為厥陰有寒有熱則為少陽兼厥陰虛勞有損及肝者其脈必弦弦脈亦屬少陽仲聖薯蕷丸有柴胡何嘗不治虛勞何嘗有發熱之外證再核之保命集之柴胡四物湯局方之逍遙散一治虛勞寒熱一治血虛寒熱皆病之涉少陽者薯蕷丸何獨不涉少陽即四時加減柴胡飲子退五臟虛熱虛鄰於寒虛熱與盛熱自殊正少陽之分際盛熱則不可以柴胡治矣孫琳以柴胡治勞瘧熱從髓出雖骨髓為肝腎所隸而瘧發於膽膽與肝為表裡故少陽之氣治則骨髓之熱已推之聖濟總錄治小兒骨熱潔古謂產後血熱必用皆有少陽相關之理蓋小兒之陽陽而稚者也產後之血傷及肝膽者也扶其生氣正惟柴胡為當特不善審證製劑而第恃此物則失之遠矣昔人用柴胡之方不勝枚舉不必皆柴胡知己而用之而有效者非無故也試即東垣補中益氣湯言之少陽之火即氣食少火之火少火者不寒不熱脾得之而升肺得之而降過寒過熱皆能犯胃作嘔胃豈可升其氣之陷者實少火之不足也柴胡升少陽而使適於中則少陽自遂其生生之性而脾肺悉受其蔭此即十一經取決於膽之謂也東垣以柴胡為升陽明之清氣而後人遂沿其誤治本草者盍深究之本經柴胡去腸胃中結氣謂大柴胡湯用柴胡即去腸胃中結氣原非不是然諸承氣湯何以俱不用柴胡本經所主亦非專屬腸胃夫大柴胡湯之為治也在金匱曰心下滿痛在傷寒曰嘔不止心下急鬱郁微煩曰熱結在裡復往來寒熱其用柴胡豈只為腸胃中有結氣洄溪疏柴胡謂本經治效皆主腸胃已不善會本經而又以為腸胃藥非少陽藥則尤可異之至洄溪不既云木能疏土乎柴胡惟能達少陽之木氣而後少陽得於腸胃疏其頑土本經蓋就愈病之所言之非謂柴胡不入少陽也洄溪亦自相徑庭矣白蘚皮白蘚之根作羊氈氣氈屬風宜治在下之風矣而其根於四五月花開之後即虛惡無用是未花之前其氣上注必力且採於二月風木司令自於治頭風極合至味苦化燥氣寒已熱又能於濕熱大展其用治淋瀝陰腫者根走極下之驗也治黃疸濕痹者皮走肌肉之驗也治四肢不安腹中大熱飲水者皮黃白入肺胃之驗也用之於濕熱不必挾風用之於風不必挾濕而必挾熱否則於是物無當矣龍膽黃芩主少陽之經熱竹茹主少陽之腑熱龍膽則主由少陽入厥陰之熱其味苦中有澀苦主發澀主收即發即收其用在少陽者少在厥陰者多故用龍膽者皆取其瀉肝凡肝之熱有本臟挾膽而熱者有為膽所侵侮而熱者龍膽治膽侮肝之熱能內極於骨間謂之治肝無愧以其未全離少陽故瀉肝之氣熱不瀉肝之血熱龍膽之名所由來也芍藥芍藥十月生芽正月出土夏初開花花大而榮正似少陽漸入陽明故得木氣最盛根外黃內白則為具木氣於土中而土生其金金主攻利又氣味苦平故能入脾破血中之氣結又能斂外散之表氣以返於裡凡仲聖方用芍藥不越此二義以此求之方得芍藥別錄酸微寒隱菴輩多議其非今取嚼之卻帶微澀澀者酸辛之變味況同一物而氣質有厚薄安知古之不異於今即本經之苦平與酸微寒並體之皆不外斂之與破識得芍藥之用而無謂之吹求可已矣鄒氏於仲聖方之有芍藥處處以破陰結解之支離殊甚桂枝湯因衛氣外泄不與營合故於桂甘溫經驅風之中用芍藥攝衛氣就營氣營氣本未嘗結何待於破此斂之義也當歸芍藥散治腹中㽲痛此破之義也桂枝加芍藥湯治腹滿時痛此斂與破兼者也滿須斂痛須破何可執破陰結一說以概諸方腹痛為太陰血中之氣結芍藥以木疏土而破結故為腹痛專藥謂於土中瀉水者猶屬膈膜之論下利乃陰氣下溜土德有慚豈堪更從而破之故下利斷非所宜若滯下之利則正宜決其壅滯芍藥又為要藥潔古芍藥湯用之而以名方可謂得仲聖心法矣仲聖黃芩湯治下利何以有芍藥蓋太少合病邪已近里無用葛根湯之理治之宜從里和黃芩清少陽之熱而其氣輕加芍藥以斂之甘棗以固之則里和而利止且太少合病則病氣未肯驟下欲其里和焉得不斂芍藥之不可少如是甘遂半夏湯證曰脈伏欲自利利反快雖利心下續堅滿脈伏者有留飲在內欲自利利反快者利不即利既利則快心下續堅滿者利後滿減過時又續顯系內有停阻與滯下無異芍藥能破堅積正其所宜且以甘遂逐在上之留飲而又以芍藥斂而降之則上下之邪盡去用芍藥之妙有如此而注家從未見及可異也芍藥甘草附子湯證曰發汗病不解反惡寒者虛故也虛者陽虛汗後氣已外散故以附子扶陽炙甘草補中芍藥斂其外散之氣方義易見而鄒氏以芍藥甘草為得桂枝湯之半盡太陽未盡之風邪此與桂枝湯何涉且以芍藥甘草當桂枝湯之用不可謂非妄矣芍藥為太陰血中之氣藥不能破血中之血結且味澀則破而不泄故凡下瘀血之方芍藥得廁其間者皆偏裨之任也芍藥若用為補劑必配合得宜如四物湯之類方能獲益辛祐之患消渴九年止而復作蘇樸授以芍藥甘草等分為末煎服七日頓愈陳日華謂古人處方殆不可曉實則無不可曉也殆善師成無己酸以收之甘以緩之酸甘相合用補陰血斂逆氣除肺燥之意耳此最得用補之妙法單用詎能即補潔古謂入脾經補中焦東垣謂色在西方故補皆足貽誤後人洄溪又但以為養肝之聖藥其亦昧之至矣古有減芍藥以避中寒之說寇氏然之謂氣虛禁用此亦仲聖早有以示人者傷寒太陰篇云太陰病脈弱其人續自便利設當行大黃芍藥者宜減之以其人胃氣弱易動故也以芍藥與大黃並稱即可知芍藥之為芍藥胃弱宜減更可知應用而尚不可多用何後人直以為補劑而不加深考耶胃弱既宜慎矣乃防己黃耆湯下云胃中不和者加芍藥三分則何以解之夫芍藥者能斂外散之氣以返於裡者也風濕脈浮身重汗出惡風氣之外散為何如故其證有兼喘者有兼氣上衝者和胃非他斂胃氣使下降耳豈芍藥而有和胃之專長又肺與腸胃皆一氣直下芍藥能斂氣入里即能下歸腸胃故芍藥為脾藥而兼為肺藥為胃藥也牡丹心為牡臟主血脈牡丹色丹屬心氣味辛寒故能通血脈除血熱辛寒兼苦直抵下焦故又瀉腎臟陰中之火及肝熱之由腎而致者本經除症堅瘀血留舍腸胃蓋丹皮非腸胃藥而腸胃有症堅瘀血留舍則治之義至精而至確也丹皮與大黃桃仁芒硝皆能治下焦血分之病而仲聖方或四物並用或有大黃桃仁芒硝而無丹皮或有丹皮而無大黃桃仁芒硝或有丹皮桃仁而無大黃芒硝或有大黃桃仁而無丹皮芒硝用舍之間詎無深意竊嘗玩索而得之矣大黃桃仁芒硝是治客熱傳入之血結病之驟得者丹皮是治陰虛生熱之血結病之漸致者大黃芒硝丹皮並滌血熱而大黃下奪而厲芒硝咸降而濡丹皮去瘀生新而養陰堪入於補劑桃仁獨不涼血而破由氣入血之閉滯此四物功用之同而不同也大黃牡丹湯癰膿在大腸丹皮冬瓜仁乃治此證之專藥大黃桃仁芒硝則因發熱惡寒必其始有外邪入里用以下奪而加之故四物皆不可少桃核承氣湯表證未解而熱結膀胱宜大黃桃仁芒硝亟攻其邪而無庸丹皮之養陰溫經湯病屬帶下而血瘀少腹治以化氣調經為主丹皮兼疏其瘀而無取大黃桃仁芒硝之傷正桂枝茯苓丸大意與溫經湯無異而下症以止漏下症為重故用丹皮又加桃仁二物性皆柔緩不傷胎氣若大黃芒硝之鹹苦下泄則非所宜也下瘀血湯產婦有瘀血著臍下非陰虛血熱之比無需乎丹皮芒硝既服枳實芍藥散而不愈自非大黃不能下奪桃仁䗪蟲逐瘀而不峻於產婦最宜雖用大黃而蜜丸酒煮用緩其性仍所以顧產後之虛也知此五方用舍之道而余如鱉甲煎丸腎氣丸可類推矣

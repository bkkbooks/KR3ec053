body:
  text: 卷二木香用木香者多取其調氣顧其氣味辛溫而厚不無重濁之嫌黏牙而苦亦少宣泄之力故必陰中伏陽之證如本經所謂毒疫溫鬼者最為相宜否則一切純寒無熱之氣滯等證佐以生薑橘蔻亦收殊效世有以香連丸治痢而害即隨之者非木香之過而用木香者之過也木香非血藥而有時血亦蒙其利者則于歸脾湯見之歸脾湯證為脾氣虛寒不能攝血其方用心肝脾三臟之藥不為不多獨有統率全方者三物遠志醒心之陽棗仁斂肝之陰足為血之前導然導之至脾而脾之閉拒如故則亦徘徊門外耳木香者能於脾中行陽陽一動而熏然以和血乃歸於其經是木香者啟脾之鑰也其能溫氣以蔭血者如是補骨脂按開寶補骨脂主治以五勞七傷冠首而踵以風虛冷是風虛冷由五勞七傷而致也再繼之以骨髓傷敗腎冷精流又由風虛冷而致也夫腎家之風有因熱而生者如天麻丸之用萆薢元參生地黃也此則因虛冷而生風故宜以味辛大溫之補骨脂拯之虛冷生風之候喻西昌所謂兩腎空虛有如烏風洞慘慘黯黯漫無止息者是也薑黃鬱金唐本草於鬱金曰辛苦寒甚是於薑黃曰辛苦大寒其實溫而非寒惟以為大寒故云除風熱鄒氏不察亦沿其誤並以薑黃主心腹結積為治在上鬱金主血淋尿血為治在下意在求精求切而不知其實非也薑黃辛苦溫而色黃故入脾治腹脹片子薑黃兼治臂痛是為脾家血中之氣藥鬱金苦寒而外黃內赤性復輕揚故入心去惡血解心包絡之熱其治淋血尿血與婦人經脈逆行皆相因而致之效是為心家之血藥此皆歷試不爽者唐本草可不必過執矣荊芥考古治頭項風強一切偏風中風口噤及吐血衄血下血多重任荊芥是其所司總不離血中之風能於血中散風即繫於血中行氣海藏故謂之肝經氣藥但肝經之氣不能不涉及少陽本經所主鼠瘻瘰癧即少陽病也荊芥散血中之風為產後血運第一要藥其芳溫之性又足以療瘰癧瘡疥然無非利血脈去風毒而已謂荊芥為溫升則兼涼降為涼降則兼溫升要其溫勝於涼氣亦帶濁於外感風寒用之必涉血分頭目昏眩者始得永類鈐方治風熱頭痛與石膏辛涼之味等分為末茶調下製劑亦妙矣薄荷薄荷唐本草治賊風傷寒發汗食性本草治陰陽毒傷寒頭痛蘇頌王好古亦皆謂治風寒外此諸家則皆謂治風熱究將何從考古方多用於風熱鮮用於風寒煮汁飲之則潔古所謂去高巔及皮膚風熱者甚驗氣味辛涼而不似荊芥之溫終當以治風熱為斷鄒氏解賊風傷寒謂夏之賊風乃北風定是夏令傷北風之寒此於薄荷之治亦尚有合但鄒氏專主此說而於風熱不推及之且以薄荷根不畏寒苗不畏暑為消息之所在則泥之至矣惟其根不畏寒所以苗不畏暑不畏暑正辛涼之金氣足以當日與麻黃所產之地冬不積雪可對觀而明鄒氏又謂薄荷發寒泣之覆與荊芥香薷等試思香薷何物而可與之等量耶薄荷於頭目肌表之風熱鬱而不散者最能效力若配合得宜亦可治上中焦之裡熱涼膈散龍腦雞蘇丸以除胃熱膽熱腎熱可謂用逾其分矣逍遙散合煨姜又能變涼風為溫風而治骨蒸勞熱彼存膠柱之見者得毋聞而驚怖耶青蒿青蒿有二種一黃色一青色生苗於二月其深青者更異於常蒿至深秋猶碧其氣芳香疏達與柴胡相彷彿非少陽藥而何所以柴胡治瘧青蒿亦治瘧也青蒿芳香疏達則能升開花結子於七八月得金氣多則能降升與降互為牽制故升降皆不得逞而力微但其主留熱在骨節間則更有至理焉青蒿至立秋後便節節生蟲既生蟲仍開花結子其蟲不齧梗不潰出循梗而下入土化他物若青蒿之力有以抑之者然是則以治勞熱骨蒸可謂恰如其當矣夏枯草夏枯草或謂稟純陽之氣或謂稟純陰之性以劉潛江陰在下能生陽陽在上能化陰之說衡之似乎劉說為長但人身之陰陽猶天地之陰陽劉所謂陰在下陽在上者自指陰始生陽極盛而言陽之生陰之化亦必指夏枯草而言不知一陰生於下而草枯矣何陽生之有一陰生於下而草枯其所感者在下之陰非在上之陽又何得謂陽在上而化陰其理似精非精仍不得據此為準竊謂夏枯草生於一陽始生之時當為陰退陽進陰中透陽之物迨交夏至陰進而上則陽退而下此草透陽之生意亦即至此而盡惡得不枯婁全善因其治目珠夜痛點苦寒藥不效之證遂反揣之以為稟純陽之氣夫目珠夜痛為陰中陽結之證夏枯草若氣稟純陽其於陰中之陽必鋤鋙而難入惟其為陰中透陽之物以治陰中陽結之證乃得如飢食渴飲適償其欲就是思之尚有毫釐未合否耶至洄溪謂性稟純陰故一交盛陽陰氣將盡即成熟枯槁竟以夏至陰生之時為陰氣之將盡疏失至此尤令人不解矣漏蘆漏蘆亦蒿類而青蒿治疥瘡痂癢熱在骨節間此治濕痹之惡瘡熱在肌膚青蒿芳香苦寒合濕熱而併除之故宜於由濕轉燥之瘡漏蘆色黑鹹寒熱散於肌表而濕使下滲故宜於濕壅熱熾之瘡古方治發背以漏蘆湯為稱首者背為太陽寒水部分漏蘆鹹寒而有白茸正與相合且熱退即住服明乎越境之不過問也漏蘆下乳汁是下熱結而不下之乳汁能消乳內脹痛非下乳汁之通劑也麻黃鄒氏疏麻黃云麻黃之實中黑外赤其莖宛似脈絡骨節中央赤外黃白實者先天莖者後天先天者物之性其義為由腎及心後天者物之用其義為由心及脾肺由腎及心所謂腎主五液入心為汗也由心及脾肺所以分布心陽外至骨節肌肉皮毛使其間留滯無不傾囊出也故栽此物之地冬不積雪為其能伸陽氣於至陰中不為盛寒所凝耳此論麻黃性用致為精審遠勝諸家按靈樞本藏篇云腎合三焦膀胱三焦膀胱者腠理毫毛其應麻黃雖入腎而中空輕揚故為太陽傷寒泄表發汗之要藥肺之合皮毛入太陽即入肺入肺入心即入營衛麻黃莖並不白鄒氏謂其入肺而有意裝飾之未免蛇足又葉天士陳修園咸謂肝主疏泄以麻黃髮汗為疏泄為入肝不知肝能下泄不能外泄其亦武斷之至矣與麻黃相助為理之物其最要者有六曰杏仁曰桂枝曰芍藥曰石膏曰葛根曰細辛得其故而後知彼知己百戰百勝矣今具論如下杏仁者所以為麻黃之臂助也麻黃開肌腠杏仁通肺絡麻黃性剛杏仁性柔麻黃外擴杏仁內抑二者合而邪乃盡除如麻黃湯治風寒麻黃杏仁薏苡甘草湯治風濕之類皆是桂枝者所以補麻黃之不足也麻黃泄營衛之邪桂枝調營衛之氣桂枝得麻黃不至羈汗麻黃得桂枝即能節汗二者合而正不受傷此麻桂並用之方皆然蓋有視證候之重輕暨他藥之離合以為權衡者矣芍藥者一方之樞紐也一徵之小青龍湯外寒與內飲相搏乾嘔發熱而咳是證之必然非或然麻桂散外寒辛夏蠲內飲姜味止咳逆甘草合諸藥以和之寒則以汗解飲則隨便去惟麻黃入太陽而上行膀胱之氣亦因之而不下行小便不利少腹滿固意中事加芍藥者所以馴麻黃之性而使水飲得下走也若小便本不利則麻黃直去之矣全方蠲飲重於散寒故名之曰小青龍湯再徵之烏頭湯麻黃氣輕驅風寒在肌膚者多烏頭氣重驅風寒在臟腑者多麻黃除濕是濕隨風寒而去烏頭除濕是風寒外散而濕則內消麻黃伸陽而不補烏頭補陽而即伸此治歷節不可屈伸疼痛二物所以必並用之故雖然二物皆出汗而少內心關節之病非可一汗而愈者故又以芍藥從而斂之使宛轉於肢節而盡去其疾黃耆疏營衛之氣則為芍藥之前驅甘草則培中土以和之者也以其有芍藥能使麻烏下達故亦治腳氣舉此二方而他之用芍藥者可推矣傷寒太陽病將入陽明則石膏為必用之藥大青龍湯中風二字是與小青龍湯傷寒二字為互舉之文麻黃湯治傷寒曰脈浮緊無汗此亦浮緊無汗大青龍別一條曰傷寒脈浮緩浮緩有傷寒浮緊豈反無傷寒況傷寒一日太陽受之脈若靜者為不傳頗欲吐若躁脈數急者為傳此之煩躁自因表實而邪不得泄傳入陽明所致沈堯封以煩躁為內伏之暍熱不知陽明非腑實不至煩躁安有內已腑實而外尚發熱惡寒之理以石膏治煩躁謂之治太陽傳入陽明之煩躁與仲聖諸說無不吻合復有何疑且煩躁在心腎而治則在陽明者非無謂也太陽本寒標熱上與心下與腎為緣太陽熱閉則心腎皆為之擾太陽不治則陽明亦所必傳是煩躁非心腎之自病而陽明乃去路之宜肅泄其熱於表清其熱於裡則煩躁不治而自治抑石膏者泄肺即所以泄太陽也太陽衛外之氣從皮毛而合肺而石膏亦輕亦重泄肺清胃兩擅其長故獨用治汗出之熱佐麻黃又治不汗出之熱若離太陽入陽明而成腑實之證則石膏非所克任矣太陽將入陽明葛根亦為必用之藥仲聖文義多有參觀互勘而後明者葛根湯之證曰太陽病項背強𠘧𠘧無汗惡風病云太陽而方則以葛根標名葛根者太陽陽明交嬗藥也何以言之陽明病身熱多汗而葛根治大熱不治多汗且更解肌出汗雖出汗而非散太陽初入之寒所以為治太陽將入陽明之藥太陽寒邪化熱熱爍其液則項背為強葛根起陰氣以滑澤之則變強為柔與麻黃治無汗惡風可稱伯仲然則是證二物足了之矣復以桂枝湯何為蓋汗出表必虛以和陽化陰之藥繼其後則即攻即補元氣不過傷而易復此用藥操縱之法仲聖方類如是也細辛與杏仁皆所以為麻黃之臂助而有大不侔者在杏仁佐麻黃而橫擴是為一柔一剛細辛佐麻黃而直行是為一專一普麻黃驅陰邪發陽氣不僅入少陰而用甚普細辛則色黑入腎赤入心或云赤黑或云深紫紫即赤黑相兼之色也一莖直上氣味辛烈故其破少陰之寒凝銳而能專考仲聖方佐細辛以治上者不一如小青龍湯治水飲厚朴麻黃湯治咳逆桂甘薑棗麻辛附子湯治氣分皆所易曉獨麻黃附子細辛湯治少陰病用細辛則此義塵封久矣試詳言之少陰與太陽為表裡臟若中寒必始得之即吐利厥逆不至發熱今有但欲寐之少陰證而反發熱是無少陰之裡證而有外連太陽之表證自應以麻黃髮汗脈沉者急溫之自應以附子溫經至細辛一味柯韻伯謂散浮陽鄒氏謂無細辛為微發汗則有細辛為大發汗唐容川更以脈沉為陽陷用細辛以升之實於細辛性用與仲聖因證制方之意未經窺見夫細辛與麻黃同能徹上徹下第麻黃中空輕揚用以下行非借他藥之力不可細辛無發表出汗之能本經麻黃髮表出汗細辛無之而於風寒之在上在下附於骨節九竅者則專力以去之絕不旁騖故防己黃耆湯曰下有陳寒者加細辛可見細辛散少陰經氣之寒厥有專長非麻黃可及然則麻黃附子甘草湯無細辛而此何以有細辛彼無里證而此何嘗有里證仲聖用麻黃必曰取微汗此豈堪取大汗則當於始得之與得之二三日及麻黃煎法之不同詳究其義矣經云逆冬氣則少陰不藏腎氣獨沉腎氣沉則脈無不沉即仲聖所云脈微細但欲寐之脈亦未始非沉此單言沉者以其沉之甚耳脈沉自系少陰病本象茲不云少陰病脈沉反發熱而云反發熱脈沉蓋少陰病不應發熱而反發熱發熱則當由太陽而外達矣乃發熱而兼脈沉豈能無二三日變為里證之虞於是以附子專溫其經細辛佐麻黃銳師直入以散在經之邪麻黃先煮減二升者欲其氣之下注不加甘草者恐其緩三物而中停此發熱脈沉始得時之治法若至二三日而無里證則不至或有里證不當以細辛先開其隙故以麻黃附子治發熱脈沉而以甘草易細辛且先煮麻黃只一二沸以節其入里之勢而和其散邪之氣此正合得之二三日之分際彼不言無里證此不言發熱脈沉者互舉之文也仲聖之斟酌病機可謂精矣更以仲聖用麻黃杏仁石膏而治法迥異者言之大青龍湯三物並用為發汗之峻劑麻杏甘膏湯亦三物並用偏治汗出而喘無大熱者何也此節文義是將汗出二字倒裝在不可更行桂枝湯下惟其汗出疑可行桂枝不可行麻黃不知汗出而喘無大熱非桂枝證之汗出而為發汗後表已解之汗出表已解故無大熱喘則尚有餘邪桂枝湯不可行而大青龍不變其法亦不可行夫是故變峻為和以麻黃四兩石膏倍之俾麻黃之技不得逞而餘邪適因之而盡且石膏倍用不特製麻黃之悍泄汗出之熱即杏仁亦必抑其外達之勢以下氣而止喘止喘非麻黃事耶而汗出無大熱之喘則其喘為氣逆多而表郁少故麻黃減之而杏仁增之信乎藥物多寡之所關非細故也石膏以兩計者與麻黃多寡易見麻杏甘膏湯石膏多麻黃一倍核之治法正合若大青龍湯石膏亦多於麻黃則麻黃受制已甚何至有汗多之慮洄溪云大青龍湯一劑除大棗約共十六兩以今稱計之亦重三兩有餘則發汗之重劑矣雖少加石膏終不足以相制也夫所謂十六兩者已將石膏並計在內所謂三兩有餘者以古一兩今二錢零計之不知雞子大一塊洄溪究作今稱幾何余將石膏碎為雞子大稱之總不在三兩之下而洄溪謂一劑共三兩有餘真令人不解王樸莊精於算學謂傷寒方一兩准今七分六釐則更無洄溪二錢零之多今姑即二錢零為一兩計之麻黃六兩亦不過有今稱兩半而石膏雞子大一塊則有今稱三兩是多於麻黃一倍矣恐雞子大一塊字不免有誤世有博雅盍考訂之麥門冬麥冬形象合之本經主治自是胃家正藥徐氏云麥冬甘平滋潤為純補胃陰之藥後人以為肺藥者蓋土能生金肺氣全恃胃陰以生胃氣潤肺自資其益也鄒氏云麥冬之功在提曳胃家陰精潤澤心肺以通脈道以下逆氣以除煩熱若非上焦之證則與之斷不相宜觀此可以正李東垣但謂入手太陰而不及足陽明之非前人謂麥冬復脈通心者不一大都其胸中先有本經胃絡脈絕之見而更徵之以復脈湯生脈散竊謂胃之大絡內通於脈脈絕乃胃絡之不貫非真脈絕麥冬補胃陰以通絡而脈得所資則有之亦非能徑復其脈能徑復其脈者厥惟人參熟玩傷寒金匱兩書自知且心腹結氣傷中傷飽若非胃絡脈絕亦豈麥冬所能治下文之羸瘦短氣即胃絡脈絕之徵本經無一字虛設而又上下相照應如此願與治本經者一質之徐氏極詆以麥冬治咳嗽然千金外臺治咳嗽諸方多有之而實權輿於仲聖之麥門冬湯麥門冬湯千金即列於咳嗽門遇津枯火逆者又何嘗不是要藥也瞿麥瞿麥本淋藥而栝萎瞿麥丸之小便不利與淋證有間何以用瞿麥乃是方之微旨則有可窺見者在焉小便不利而有水氣其為下焦陽虛顯然易見陽虛於下而熱浮於上所以又渴薯蕷附子能溫腎補虛而不能止渴導水故輔以栝蔞根之生津茯苓之化氣然小便不利而用薯附豈無封蟄之虞栝苓又和緩有餘而勇健不足然則排決之任自當屬之瞿麥此以淋藥治小便不利而恰如其當仲聖真神化無方矣葶藶大黃泄血閉而下熱葶藶泄氣閉而逐水凡水氣堅留一處有礙肺降者葶藶悉主之惟泄肺而亦傷胃故葶藶大棗瀉肺湯以大棗輔之甘遂味苦甘所治在中與下能利水穀之道故治留飲宿食葶藶味苦辛所治在上與表但利水道故主結氣飲食寒熱試以大陷胸湯丸證之大黃蕩實滌熱上中下咸到性極峻厲故湯丸皆以為君為陷胸之主藥陷胸湯加芒硝甘遂而一則煮一兩沸一則內末者以二物皆下趨極易欲其迴翔胸膈化水食而軟堅也陷胸丸之證曰項亦強如柔痙狀項強二字實此證之主腦按素問太陰在泉項似拔項似拔者濕上衝也此強而非拔為水結在肺無疑曰如柔痙狀則與柔痙相似而不同可知然則何以治之夫結胸由於誤下誤下故正虛邪入水飲宿食遂互結而不下要其所入之邪太陽病未解之陽邪也陽邪劫液故筋失所養而項強是宜泄其為患之水濡以柔筋之液而大逐其心胃之熱實故用大黃硝遂無二致而法則有變藥亦宜加矣杏硝合研所以潤液而柔項遂蜜同煮所以安正而化結葶藶瀉肺水為是方水結之專任變湯為丸者以項強不可以急圖也葶藶與甘遂可同年語乎哉車前子車前即芣莒神仙服食經云善療孕婦難產及令人有子陸機云嫩苗作茹大滑今人不復啖之苗滑如是其子治難產自亦取其滑胎惟令人有子似未足信不知虛弱之婦無子貴補衝任否則反是車前子非他蓋為治難產之令人有子也車前子為輸泄膀胱濕熱之藥本經主氣癃止痛利水道通小便別錄明目療赤痛其功用已盡於是若以治腎虛目暗則須如加減駐景丸製劑為得原方尚不及之昔人謂車前子利水竅而固精竅似即補腎之謂然茯苓利水不必有熱車前子則非熱不治茯苓尚伐腎邪則車前子之固精竅為何如之固精竅可深思矣萹蓄萹蓄葉綠莖赤稟木火之氣而引蔓促節氣味苦平能通利三焦搜抉隱微濕熱之病故本經主浸淫疥瘙疽痔殺三蟲別錄療女子陰蝕金匱要略云浸淫瘡從口流向四肢者可治從四肢流入口者不可治蓋口為脾竅流向四肢則濕熱不致侮脾脾土有權而可治萹蓄引蔓促節復節節開花可不謂濕熱流向四肢之象歟大黃鄒氏以大黃黃中通理狀如錦紋質色深紫為火貫土中極服盧芷園行火用一語竊思盧氏論素問承製生化之義固精但淺學不易領悟夫大黃火貫土中或當能扶脾陽矣然此其質耳味則大苦氣則大寒且於黃色中貫赤紋則於脾中血分錮土之火自當之輒息錮土之火息而心君生土之火豈有不因之而行其用此所以行君令戡禍亂拓土地而有將軍之號也大黃色黃臭香性與土比故用於脾胃病極合其能行火用上下表里咸到則人多忽之然有一言可以蔽之者曰蕩實滌熱而已熱與實兼者如大小承氣湯下燥屎大陷胸湯丸治結胸抵當湯丸下瘀血大黃附子湯治脅下偏痛其但熱不實者如苓甘五味加姜辛半杏大黃湯治面熱如醉茵陳蒿湯治谷疸瀉心湯治心氣不足此二者之顯有區別者推是以求則如鱉甲煎丸治癥瘕大黃䗪蟲丸治虛勞羸瘦大黃牡丹湯治腸癰大黃黃連瀉心湯治氣痞非熱實而同於熱實亦惟假盪滌之性功擴神奇之妙用而仲聖製劑之道抑更有進者焉己椒藶黃丸曰腸間有水氣水者虛軟之物大黃能蕩實不能搗虛且瀉水已有己椒葶藶更益以大黃何為或謂泄血閉而下熱或謂從大便而分消皆意為揣摩未足徵信獨近人唐容川云三焦者決瀆之官水道出焉三焦即膈膜油網水從胃中四面微竅滲入油網從油網入膀胱若水走腸間則為停水水停而不行於三焦則水不化氣而津不生是以口舌乾燥治法宜將未入腸間之水引之走三焦故道既停腸間之水從腸間而下奪此據西醫油網之說徵以內經三焦核之是證是方無不吻合實勝舊解蓋防己紋如車輻內黃外白有從脾肺斡旋三焦水道之能椒目溫腎以蒸發其脾陽除腹滿而利水猶腎氣丸之有附桂如是而三焦之故道可復矣腸間之水將遂施大黃以下奪乎抑未也夫大腸者糟粕所居大腸有水下即與糟粕俱下雖非燥屎大黃固與有責特其所司全在腸胃力不及肺肺合大腸非肺出治節不能使水食俱下葶藶為從肺至脾之藥本鄒氏疏證利水道兼破積聚故加之以輔大黃之不逮且椒得大黃庶寒溫相濟而腸胃之疾亦必火用行而後已此大黃之治腸間水氣有如此曲折微義不可不知者也夫大黃之為物有定而用大黃之法無定不得仲聖之法則大黃不得盡其才而負大黃實多否則為大黃所誤而大黃之被誣亦多素問至真要大論論制方之法甚備而其間緩急奇偶復極之氣味厚薄制小制大數少數多參伍而錯綜之實有無窮之用仲聖則正本此旨以制方而不容以一端測焉大黃氣味俱厚本峻下之物因其峻下而微變其性以用之則如大承氣抵當湯之大黃酒洗酒浸以兼除太陽餘邪也大黃黃連瀉心湯之大黃以麻沸湯漬之而不煮欲其留戀心下也大黃附子湯大黃與附子並用則變寒下為溫下茵陳蒿湯大黃與茵陳梔子並用則不走大便而走小便大黃用法之不同也如是更以方劑言之尤氏謂小承氣無芒硝而但有枳樸下趨之勢緩故曰小不知小承氣雖有枳樸無芒硝而枳樸分兩亦較大承氣甚少此制之大小即承氣大小所由名豈在芒硝有無之別且芒硝並不專取其下趨調胃承氣芒硝與甘草並用則能調胃大陷胸芒硝與甘遂並用則能陷胸大承氣芒硝只三合而調胃承氣大陷胸轉用至半升一升調胃陷胸有芒硝而抵當湯丸轉無芒硝芒硝之功不專在下趨亦明矣柯韻伯謂藥之生者氣銳而先行熟者氣純而和緩故大承氣以芒硝專化燥屎大黃繼通地道而後枳樸除其痞滿鄒氏韙之其實似是而非也芒硝之不取乎速下上已言之夫多煮者味厚少煮者味薄味厚則下之早味薄則下之遲枳樸先煮欲其徑下消黃則兼資以滌熱非故操之不可故大黃後納芒硝只一兩沸小承氣所以同煮者枳樸既少又無芒硝且大承氣以水一斗煮枳樸取五升納大黃後尚取二升小承氣則僅水四升煮取一升二合大黃雖與枳樸同煮力亦不厚何必再分先後鄒氏謂大陷胸湯用甘遂芒硝之銳猶恐其暫通復閉故大黃先煮使當善後之任置全方配合之道不講而但於先後煮討消息不知芒硝甘遂專治胸間熱結水結故芒硝只一兩沸甘遂內末而不煮大黃本腸胃藥用以為消遂前驅故先煮之鄒氏又謂茵陳蒿湯大黃梔子為前茅茵陳為後勁不知茵陳發揚芳郁稟太陽寒水之氣善解肌表之濕熱欲其驅邪由小便而去必得多煮以厚其力與桂枝利小便非多用不可正復相同大黃只二兩而又後煮則與茵陳走肌表之氣相浹且能促之使下也茵陳梔子皆走小便大黃自亦不走大便矣此仲聖制方之意與素問相印合者也可執一說而不究其所以然哉附子天雄烏頭鄒氏論附子天雄烏頭之性用頗精為節其說曰烏頭老陰之生育已竟者也天雄孤陽之不能生育者也附子即烏頭天雄之種含陰包陽者也老陰生育已竟者其中空以氣為用孤陽不能生育者其中實以精為用氣主發散精主斂藏發散者能外達腠理斂藏者能內入筋骨附子則兼備二氣內充實外強健且其物不假系屬以氣相貫而生故上下表理無乎不到惟其中蓄二物之精斯能兼擅二物之長其用較二物為廣爾本經附子主風寒咳逆邪氣後世緣此多以為治風之藥其實經文深奧義別有在也夫風有傷與中之分傷者傷於營衛中者中於經絡臟腑傷營衛者寒鬱於表而易化熱宜麻桂決不宜附子中經絡臟腑者寒根於裡而陽本虛用麻桂又貴用附子附子非風藥而本經之主風寒蓋指中風之風寒言非指傷風之風寒言也外臺謂中風多從熱起故中風有寒亦有熱風引湯治熱之方也熱不用附子固不待言小續命湯治寒之方也若附子即以驅風何以附子外不少風藥其有附子無風藥如近效朮附湯治風虛者有之未聞能散外入之邪風也鄒氏謂附子之治風寒是陽氣不榮風寒侵侮陽振而風寒自退似非不知附子治風寒之理者乃又謂仲聖用生附子之方皆兼有表證而其所引白通湯附子湯則並無未解之表邪夫白通所以用蔥白者因少陰下利一往不返失地道上行之德蔥白能入少陰而升之非以表汗附子湯證是少陰受寒而陽氣不能四周表何嘗有風脈沉固不當汗且其方伍以參朮之補苓芍之降又豈足勝解表之任至仲聖附子生用非屬汗後即是下利脈沉汗後宜補表陽下利脈沉宜挽其氣生用自勝熟用此仲聖生用之意也或難予曰惡風加附子越婢湯非明證乎何說之傎也曰大青龍汗出惡風者不可服越婢湯加附子則證為汗出惡風若附子又從而汗之獨不畏厥逆筋惕肉瞤耶蓋加附子正以其汗出趙氏云惡風者陽虛故加附子以入陽然則舍附子則有亡陽之禍豈果為驅風哉用附子於中風風寒原可不過分故三生飲無風藥以陽氣一充而邪即自消也若他風寒證則定須分治鄒氏亦頗以附子與表藥對舉暗中逗出足見附子外尚有表藥其所引桂枝加附子湯等八方皆是也惟其中桂枝附子白朮附子甘草附子則為治風濕之方桂甘薑棗麻辛附子則為治氣分之方夫風為陽邪附子陽藥以其人陽虛而寒重非扶陽則風不能以徒驅故扶陽與驅風並行寒為陰邪濕亦為陰邪風濕之風與傷風之風亦致不同非陽虛不爾故亦需附子氣分者水寒之氣結於心下證由少陰陽虛而來故麻辛附子溫少陰而發汗桂甘薑棗化上焦之陽而開結此從表解枳朮湯則從中泄病同而治不同水飲所作四字趙氏本上下條皆有之極是又麻黃附子湯以麻黃髮表而少陰脈沉用之正賴有附子溫少陰也否則脈沉無發汗之理矣附子為溫少陰專藥凡少陰病之宜溫者固取效甚捷然如理中湯治腹滿黃土湯治下血附子瀉心湯治心痞甚至薏苡附子敗醬散治腸癰如此之類亦無往不利惟其挾純陽之性奮至大之力而陰寒遇之輒解無他道也天雄仲聖惟天雄散一方附於桂枝加龍骨牡蠣湯後不言所主何病按此與上節離合之間必有竄亂今細繹其文自夫失精家至為清穀亡血失精當是以天雄散主之下以桂枝加龍骨牡蠣湯主之正為合宜何以言之兩方於失精家原可通用但脈為極虛芤遲證見清穀亡血失精則已腎損及脾不補脾則生精之源絕故白朮用至八兩少腹弦急陰頭寒目眩發落種種腎病自非他補腎藥所能勝任故選用精氣充實不外泄之天雄而以天雄名方至其佐使之桂枝龍骨尤微妙難言桂枝湯桂枝只三兩而此乃倍之欲其於太陽之經府俱到以化氣其證陰既下泄陽自上浮而脾腎咸虛之陽不當潛以鹹寒之牡蠣得龍骨則引火歸土而亦不損其陽且桂枝輔天雄則入腎釋陰輔白朮則入脾溫土龍骨輔天雄則固腎澀精輔白朮則固脾祛濕以天雄散隸於是證義實至精至確若脈得諸芤動微緊雖天雄散亦可服要不如桂枝加龍骨牡蠣湯為尤中窾蓋脈芤動為陽微緊為陰陰陽氣爭則表裡失和治之以此湯桂枝生薑甘棗為陽芍藥為陰龍骨為陽牡蠣為陰於祛邪澀精之中有表裡相得陰陽互維之妙此二方是於小建中湯腎氣丸外又別出良法者就天雄散思之則天雄所謂孤陽不能生育其中實以精為用者不於此可見其概也乎烏頭治風亦惟陽虛而挾寒挾濕者宜之以其中空以氣為用開發腠理過於附子故古方中風證用烏頭較多於附子抉壅通痹亦過於附子故仲聖治歷節不可屈伸疼痛及逆冷手足不仁身疼痛灸刺諸藥不能治皆用烏頭不用附子烏頭與附子同為少陰藥而補益以附子為優發散以烏頭為勝故腎氣丸有附子無烏頭大烏頭煎有烏頭無附子因烏頭氣散不收故不解表之方皆去滓納蜜更煮以節其性仲聖之用烏頭附子可謂各極其妙矣乃烏頭赤石脂丸更二物並用以治心痛徹背背痛徹心取其母子相感以除內外之邪此豈尋常思議所及哉半夏半夏味辛氣平辛則開結平則降逆為治嘔吐胸滿之要藥嘔吐胸滿者少陽證也故小柴胡湯不能缺此推之治心痞治腹脹治咳治咽喉不利一皆開結降逆之功要其所以結與逆者由其有停痰留飲乘陽微以為患半夏體滑性燥足以廓清之也用半夏者率以二陳湯能潤大便半硫丸能治虛秘冷秘謂潤而非燥究亦何嘗不燥也遇津虧無濕之人投之立貽禍殃惟仲聖取其長而棄其短胃反為脾傷不磨非有滯濁乃佐之以人參益之以白蜜俾半夏之燥性盡失而胃中之穀氣以行又竹葉石膏湯麥門冬湯溫經湯三證亦未可以半夏劫液者乃其所伍者為竹葉石膏人參麥冬甘草粳米阿膠丹皮之屬是亦化半夏之燥而展其開降之能所謂化而裁之存乎變也小青龍湯曰渴者去半夏小柴胡湯曰渴者去半夏此可為半夏非不燥之明徵然半夏之燥燥而滑者也能開結能降逆與燥而澀者不同矣蕘花小青龍湯若微利者去麻黃加蕘花蓋利則水氣不徑趨膀胱更以麻黃升太陽則水道益澀水氣必泛而為脹滿太陰篇所謂下利清穀不可攻表汗出必脹滿也蕘花本經主盪滌腸胃留癖利水道則微利不至成滯下而在上之水氣亦去且其用在花走里兼能走表故本經並主傷寒溫瘧飲食寒熱邪氣若以茯苓澤瀉治微利則表邪亦從而陷之矣此仲聖所以有取於蕘花也菟絲子菟絲子汁去面䵟徐氏不解葉香岩謂升少陰徐氏復不信不知此最易曉耳菟絲延草木則根斷子中脂膏最足故補腎精而主升面為陽明之脈而菟絲甘辛而溫能由陽明經上入於面以施其滑澤之功面䵟焉得不去竊願以此釋徐氏之疑脾主肌肉菟絲以寄生根斷之性補益其脾故能充衛氣而肥健老學庵筆記謂久服生疽其氣之溫可知矣他物補腎補之而已此能於補中寓升故其治精自出溺有餘瀝不得以澀劑目之治消渴則是化腎中之陰以升其液亦非滋陰之謂五味子喘與咳皆肺病其有腎氣逆而為喘咳者則不得獨治肺五味子斂肺氣攝腎氣自是要藥然但能安正不能逐邪有邪用之須防收邪氣在內仲聖以五味伍桂枝則云下衝氣去桂加乾薑細辛則云治咳滿可見咳滿之任在姜辛不在五味然而去桂不去五味其他治咳逆諸方又無不三物並用其故何也曰足太陽手太陰同為一身之衛二經之病往往相通小青龍湯傷寒太陽病也而雜證肺病亦恆用之推之苓甘五味姜辛湯厚朴麻黃湯皆肺中有寒飲皆小青龍出入加減小青龍系外寒與內飲相搏故咳逆若兼外寒方中必有麻桂無外寒者無之至三物並用則非分疏不明肺中冷必眩多涎唾甘草乾薑湯以溫之此乾薑溫肺之據用乾薑者肺寒非乾薑不溫也張隱菴之疏細辛也曰氣味辛溫一莖直上色赤黑稟少陰泉下之水氣而上交於太陽審乎是而謂細辛不能發汗耶則細辛辛溫而烈實能由少陰達表謂細辛能發汗耶則細辛細碎之體那得勁力所以發少陰之汗必與麻黃並用而散肺中寒飲則正其所優為二物一溫一散肺邪已足了之而必加以五味且數多於姜辛幾令人不解此則治病即以善後仲聖蓋慮之周也肺苦氣上逆咳則逆喘則且至於脹既張之肺欲翕不得有邪雖去而咳猶不止者謂五味可無乎不可無乎或曰煩躁而喘者加石膏胃熱熏面者加大黃得毋三物亦治熱咳不知飲自寒而挾自熱三物所治仍屬寒飲不得因是致疑或又曰三物治咳惟細辛關係最重而小柴胡湯咳加乾薑五味獨不加細辛豈傳寫有脫佚耶夫寒飲迫肺而咳者可從表解可從下泄少陽在半表半裡間有咳者殆陽不勝陰而以微寒侵肺耳無飲可蠲何需乎細辛此傷寒太陽少陽之分斷不容忽過者也尤氏曰五味子治嗽新病惟熱傷肺者宜之若風寒所客則斂而不去矣久病氣耗者非五味子不能收之然熱痰不除則留固彌堅矣見金匱翼按所論甚是而不免於語病肺為熱傷固非斂不救如孫真人生脈散之以五味治暑病然方中必重任人參麥冬生津止渴之品即尤氏所引治熱咳諸藥不效者方亦何嘗無清滌肺熱如石膏知母枇杷葉之類雖新病不得重任五味有邪應兼除邪治法與寒嗽不殊未便故為軒輊也栝蔞根栝蔞實即天花粉與栝蔞栝蔞根實本經俱苦寒李氏謂根甘微苦酸微寒實甘寒辨之致審草木之根荄其性上行實則性復下降栝蔞根能起陰氣上滋故主燥熱之煩渴實能導痰濁下行故主黏膩之結痛此張氏之說至允用二物者當作如是想栝蔞根與葛根同主消渴身熱而仲聖治痙則一用葛根一用栝蔞根何故蓋無汗而小便反少氣衝口噤是風寒濕之邪相搏於太陽陽明之交而不解用葛根則能隨麻黃輩散之於外栝蔞根無解表之長而證是身體強𠘧𠘧然俾與桂芍諸物養筋脈則適相當此其所以攸異也栝蔞根本治熱治渴乃牡蠣澤瀉散並不言渴而其所伍者為瀉水之物是大病瘥後虛熱不免而水去則陰復傷以栝蔞根潤液而補虛除病即兼善後也栝蔞瞿麥丸上雖為渴而下則有寒下寒故膀胱不利而水蓄水蓄於下則陽浮於上是渴為標寒為本故以薯附溫肺腎而化氣苓麥泄下蓄之水栝蔞根止陽浮之渴不用膏知者以渴非實熱也栝蔞實之長在導痰濁下行故結胸胸痹非此不治然能導之使行不能逐之使去蓋其性柔非濟之以剛則下行不力是故小陷胸湯則有連夏栝蔞薤白等湯則有薤酒桂樸皆伍以苦辛迅利之品用其所長又補其所短也葛根葛根與栝蔞根本經皆主消渴而葛根起陰氣栝蔞根不言起陰氣張隱菴以栝蔞蔓延結實之時根粉盡消結實既成根覆成粉又凡草木根荄性必上行遂謂栝蔞根能起陰氣上滋鄒氏亦韙之愚竊以為不然用葛根者皆知為升陽明之藥栝蔞根無用之為升者雖凡根皆寓有升意而用根之藥不盡屬能升且以粉消為升則有粉方掘正在升力已退之時蓋其所以主消渴者為其性濡潤而味苦寒皮黃肉白能劫肺胃之熱潤肺胃之燥耳別名天花瑞雪亦正取寒潤下降之意葛根則異乎是矣味甘平為陽明之正藥內色潔白則能由胃入肺外色紫黑則又由肺達太陽味甘兼辛則擅發散之長層遞而升復橫溢而散升則升胃津以滋肺散則散表邪以解肌故栝蔞根治身熱是以寒勝熱葛根治身熱是以辛散熱栝蔞根止渴是增益其所無葛根止渴是挹彼以注茲用葛根而過有竭胃汁之虞胃陰下溜亦能起陰氣以止利也葛根湯以桂枝湯加麻黃詎不足發太陽之邪而猶必重用葛根者蓋麻桂二方之證均無項背強𠘧𠘧太陽病而至項背不柔則風寒已化熱爍液將入陽明麻桂皆燥藥未足專任能入陽明起陰氣滑澤其骨節而又能化肌表之熱者舍葛根奚屬此葛根所以為一方之冠也凡寒阻於經欲化未化而有表熱之證葛根能外達而解之若已化熱入里或其熱不應外解則葛根無能為役奔豚湯竹葉湯之用葛根不得謂無表熱應外解也何首烏何首烏種分赤白故氣血兼益藤夜交晝疏故具闔闢之長味厚入腎澀入肝苦則堅溫則補陳修園但知其為苦澀而於益氣血具闔闢之所以然則未之見其必有施之不當而為所誤者矣修園於首烏能止久瘧久痢則韙之而一歸於少陽則知猶未知夫久瘧不止勢必損及於肝肝病腎亦病腎者三陰之樞也欲樞轉而止瘧自當補肝與腎肝主疏泄久痢則疏泄太過腎亦失蟄封之職亦必以補肝腎為要修園既以首烏苦澀而短之安得更有直折之威生髮之氣如彼云云者稱驥以力而不免於鹽車之辱此可為太息者也劉潛江以開寶主瘰癧癰腫頭面風瘡五痔心痛為效在氣血之結而經脈為壅黑髭發悅顏色長筋骨益精髓為效在氣血之劣而形器有損二者證絕相懸而首烏並建厥功正與闔闢之理相合可知開寶非浪許也首烏之用生熟迥殊其已久瘧消腫毒皆是用生者又消腫毒用赤不用白補肝腎則以黑豆拌蒸赤白各半皆法之不可不講者張石頑云今人治津血枯燥大腸風秘鮮首烏數錢煎服即通其滋水之速與肉蓯蓉潤燥通大便相彷彿此亦修園所思議不到者要之生熟之異用所關甚巨必不容忽耳萆薢萆薢用根取其入腎莖葉俱青葉作三叉則入肝根黃白色則入肺胃根多節而虛軟則能化陰伸陽而治痹風寒濕之在腰背骨節而痛強者陰不化也以萆薢達之而陰化風寒濕之為陰痿為失溺為老人五緩者陽不伸也以萆薢導之而陽伸後世以萆薢為分清濁之劑亦由陰化陽伸而後清升濁降即止小便數除莖中痛均不出是義耳化陰非能益陰伸陽非能助陽蓋萆薢者所以驅風寒濕也萆薢味苦則發氣平則降力能外拓而性復下趨故驅風寒濕而解之於至卑此所以謂萆薢也防己防己之根外白內黃有黑紋如車輻解氣味辛平故治由腎以抵脾肺風濕之疴肺主皮毛將毋從皮毛而散乎然車能環轉不能外溢故防己絕不發汗而第直泄於小便如金匱己椒藶黃丸義見大黃千金三物木防己湯可按也陶隱居云防己是療風水要藥水與飲皆濕類也故防己黃耆湯治風濕防己茯苓湯治水木防己湯治飲名雖有三理無少異惟風水二字誠有不得而析者風陽邪而風從外入令人振寒風寒初受即宜汗解防己非其責也內伏之風若內無陰邪亦未能獨存故水飲濕悉其所因依水飲濕去則風與俱去如此之風方可治以防己然苓朮不能而防己獨能之者以黑紋如車輻解正有風水相隨之妙致也或云防己地黃湯治病如狂狀妄行獨語不休無寒熱其脈浮豈亦有水飲濕也而顧以防己治耶曰此仲聖別出手眼之方未可與他並論者也趙氏謂血虛從邪邪並於陽而然按本篇固以脈浮為血虛素問陰不勝其陽則脈流薄疾並乃狂固可為如狂之據此注允矣而不言邪為何邪徐氏則謂風邪併入於心心火熾盛故如狂妄行獨語不休較趙注為明晰矣而於是方用藥之所以然則皆未發出竊細玩之四物酒漬取汁自非陽邪表邪不爾生地黃獨多自非補血涼血不爾有表邪而用桂枝防風可知是外入之風邪以生地黃偶桂枝防風可知治不以汗解不以汗解而有酒行藥勢以搜之則邪不至或遺四物取生汁而地黃取蒸汁則陰陽得以分理既所以退陽而安陰矣然而風無出路則風仍不息陰不復位則陰仍羈陽欲並者而使之分仲聖所以有取於防己也夫防己者走表而亦下行者也操運轉之技則表間之風自隨之得息具返本之能則被擾之陰亦因之得靜或謂防己治風濕不治風燥不知風藥中用地黃至數倍則風亦轉燥為潤正與防己相宜可謂以人巧奪天工矣澤瀉豬苓茯苓澤瀉三者皆淡滲之物其用全在利水仲聖五苓散豬苓湯三物並用而不嫌於復此其故愚蓋得之本經與內經矣本經豬苓利水道茯苓利小便澤瀉消水內經三焦為水道膀胱為水府腎為三焦膀胱之主合二者觀之得非豬苓利三焦水茯苓利膀胱水澤瀉利腎水乎豬苓者楓之餘氣所結楓至秋杪葉赤如火其無風自動天雨則止遇暴雨則暗長二三尺作用與少陽相火正復無異膀胱藏津液非氣化不出茯苓色白入肺能行肺氣以化之凡水草石草皆屬腎澤瀉生淺水而味鹹入腎何疑三物利水有一氣輸瀉之妙水與熱結之證如五苓散豬苓湯若非三物並投水未必去水不去則熱不除熱不除則渴不止小便不通其能一舉而收全效哉消渴上中焦皆有之或陰虛津虧而渴或津被熱爍而渴或熱與水結而渴三物第利水以除熱何嘗如人參栝蔞根有生津補陰之能李氏謂淡滲之物其能去水必先上行而後下降以仲聖用三物稽之正不必過高其論也雖然於三物中求止渴惟澤瀉其庶幾耳何則本經無澤瀉起陰氣之文而別錄固有之澤瀉起陰雖不及葛根挹胃汁以注心肺而得氣化於水獨莖直上即能以生氣朝於極上仲聖又不啻明告我矣凡眩悸顛眩多歸功於茯苓而澤瀉湯治冒眩偏無茯苓冒眩者支飲格於心下下之陰不得濟其上之陽於是陽淫於上如覆冒而眩以生澤瀉不特逐飲且能起陰氣以召上冒之陽復返於本白朮崇土第以資臂助耳大明之主頭旋耳鳴殆得仲聖此旨也又腎氣丸治消渴皆腎藥雖用茯苓亦只借以協桂附化腎陽萸地益陰而不能升陰腎陰不周於胸則渴猶不止此豬苓可不加而澤瀉不得不加故曰止渴惟澤瀉為庶幾也菖蒲鄒氏云人身靈明猶火蓄石中人身軀體猶石能蓄火假使軀體為寒水所蒙靈明為痰涎所壅則運動不周視聽不協外之不化由於內之不出惟菖蒲生水石間而辛溫芳烈有陽畢達有陰悉布故凡水液渾濁為神明之翳者悉主之疏極精審準是以用菖蒲始克有當菖蒲用以開心孔發音聲甚效然須審定病之宜辛溫者王孟英昌陽瀉心湯以菖蒲偶竹茹枇杷葉等味亦妙內用仲聖瀉心湯三物而以菖蒲代生薑蓋義各有當也水萍水萍浮於水面而味辛氣寒能發皮膚中濕熱之邪汗故本經主暴熱身癢傷寒論云不得小汗出身必癢其身癢為有風寒之邪宜以麻桂取微汗此則濕熱不汗出而癢故水萍主之水萍亦汗藥也而與麻桂有霄壤之殊丹溪謂發汗勝於麻黃不加分別後遂有視水萍為峻劑而不敢用者矣本經以下水氣止消渴兩許水萍蓋以其狀外帖水面內含血絡水不能濡則水氣自下日不能爍則陰液固充此效之所以並呈也本經未嘗言風而後世以風藥推之要知其所治為風熱之風非風寒之風如古今錄驗以水萍與牛蒡子薄荷治風熱癮疹則藥病相當矣石斛石斛為腎藥為肺藥為脾藥為腸胃藥諸家論說紛如而咸未親切兼有疏漏茲節採諸說補其不足仍即本經別錄之旨以疏通而證明之石斛借水石而生若石挹水以溉斛斛因石以吸水石屬金內應乎肺氣平亦入肺水則內應乎腎其為引腎陰以供肺肺得之而通調下降無惑矣斛之生不資纖土而味甘淡則得中土之正色黃又主五金之貴合乎胃為戊土而屬陽明燥金與肺皆職司下行故其為用每以肺胃相連而著惟既稟土德何能於脾無與肺胃與大腸皆一氣直下又何能於大腸無與此石斛入腎入肺入胃而兼入脾入大腸之所以然也石斛得金水之專精本經強陰二字足賅全量所謂陰者非寒亦非溫用於溫而溫者寒用於寒而寒者溫別錄逐皮膚邪熱痱氣是溫者寒也療腳膝疼冷痹弱是寒者溫也要不出本經除痹補虛兩端痹何以除運清虛之氣而使腎陰上濟肺陰下輸也虛何以補布黏膩之汁而使撼者遂定豁者遂彌也是故肺胃得之則下氣平氣脾得之則長肌肉腸得之則厚腸腎得之則益精大凡證之恰合夫斛者必兩收除痹補虛之益若專以之除痹專以之補虛則當棄短取長而製劑之有道可矣寇宗奭曰治胃中虛熱有功雷斅曰澀丈夫元氣玩此二說則知有實熱與當利小便者皆不得用粗工以內傷外感悉可倚仗搖筆輒至不知施於內傷而誤其失只在寡效施於外感而誤則不免於閉邪矣骨碎補骨碎補開寶主破血止血補傷折其所破之血乃傷折之瘀血所止之血乃傷折之好血非謂其於他處能破血復能止血也傷在皮膚曰傷破在筋脈曰傷斷在骨曰傷折骨碎補寄生樹上或石上多在背陰處其根有黃赤毛所抽之葉則有青綠黃白赤紫各點宛似效力於骨碎之處而調其血脈又寸寸折之寸寸皆生處處折之處處有汁氣味苦溫故能入腎堅腎補傷折且無花無實力專而不分也李氏謂以骨碎補研末入豬腎中煨熟空心食治久泄頓住其補腎之功自不可沒則他方書治耳鳴牙疼亦必不虛要知其為苦溫之劑勿施於陽勝之體而可耳胡麻胡麻味甘臭香合乎土德且結角上聳飽含脂液而不俯又與脾職之上升無異故主傷中虛羸填髓腦補中而亦補上功在增液則潤肌膚澤骨節烏鬚髮益乳汁皆效有必至陳士良云初食利大小腸久食即否可知其力能下及而性復上注矣大麻仁仲聖麻仁丸證是脾受胃強之累而約而不舒於是脾不散精於肺肺之降令亦失肺與脾胃俱困而便何能下麻仁甘平滑利柔中有剛能入脾滋其陰津化其燥氣但脾至於約其中之堅結可知麻仁能擴之不能破之芍藥乃脾家破血中之氣藥合施之而脾其庶幾不約矣乎夫脾約由於胃強治脾焉得不兼治胃胃不獨降有資於肺肺亦焉得不顧故又佐以大黃枳樸攻胃杏仁抑肺病由胃生而以脾約標名者以此為太陽陽明非正陽陽明也兼太陽故小便數小便數故大便難治法以起脾陰化燥氣為主燥氣除而太陽不治自愈故麻仁為要藥治陽明府病非承氣不可故取小承氣之大黃枳樸而復減少其數也復脈湯用之則佐薑桂以通陽佐膠地麥冬以益陰與後世取汁煮粥以治風治淋總取乎潤燥抉壅柔中有剛也粳米稼穡作甘為土之正味不似他物之甘獨有所偏粳米平調五臟補益中氣有時委頓乏力一飯之後便舒適異常真有人參不逮者可以想其功能矣粳米得金水之氣多於益氣之中兼能養陰故補劑寒劑無不可贊助成功谷為人生至寶而霍亂痧脹與夫欲吐不吐欲瀉不瀉之證周時內咽米飲一口即不可救蓋暑濕穢惡之邪充斥隧絡而米飲入胃輸脾歸肺又適以恢張之使無一隙之餘所以告危如是之速薏苡仁李瀕湖云薏苡仁屬土陽明藥也故能健脾益胃劉氏駁之則云胃為五臟六腑之海其清氣上注於肺所以能注於肺者實由於脾脾氣合於腎以至肺肺氣合於心以歸腎此三陰之氣謂之元氣即中氣也然若胃陽虛則脾之地氣不升於天勢必濕盛化熱湊於胃脘之陽以傷氣胃陽亢則肺之天氣不降於地亦必熱盛化濕還迫於脾臟之陰以傷血傷氣者肺受之為胸痹偏緩甚或肺陰大損為肺痿肺癰更因傷氣而病乎藏血之肝為筋急拘攣傷血者脾受之為腸胃不利甚或脾氣大虛為水腫為久風濕痹且移患於下部為疝凡此皆胃氣之病於上下者也薏苡生於平澤氣寒味甘水土合德乃實結於盛夏則潤下之氣還就炎上而採實在於秋末則熱浮之氣又歸涼降有合於胃達地氣而不病於濕之化熱更合於胃達天氣而不病於熱之化濕舉前證胥能治之夫中氣不病於濕即不病於熱除濕而即能清熱者非胃之專功而胃第為之樞也如李氏言泛泛與燥濕健脾者同論將所謂清熱療痿和血潤筋者歸於何地乎然薏苡為益中氣之要藥而其味淡其力緩如不合群以濟厚集以投亦不能奏的然之效又云此言筋攣乃濕熱傷血而病於筋膜乾者經所謂大筋緛短是也肝臟血而主筋濕熱固血分之病也按李說固未中肯綮而劉氏張皇幽眇致多委折微論臟腑陰陽升降出入不盡如其言而即其言復之實亦有自呈其闕者不能為諱焉傷氣之內插入更因傷氣一句是以筋急拘攣為盡屬傷氣之傳變傷血寧無真正血證而猥以腸胃不利等四項當之皆意為牽合無與實理薏苡能使胃陽不虛胃陽不亢又能使脾合腎以至肺肺合心以歸腎宜乎用處至賾如四物四君子之類何以古方選入者如晨星之落落況雲鬚合群以濟厚集以投則固知薏苡不能兼攬眾長而又何為濫許之乎薏苡能使濕不化熱熱不化濕自是除濕而亦清熱乃又云除濕而即能清熱豈並薏苡之氣寒而亦忘之乎即以薏苡為除濕而又云薏苡潤筋是視薏苡與牛膝無二矣牛膝治筋膜乾之四肢拘攣不可屈伸以其根柔潤而中有白汁也潤筋者不能除濕除濕者不能潤筋理固然也肝藏血而主筋然筋病不得竟指為血病此亦不容不辨者矣本經一書原有漢人羼入之句其精奧處則字字金玉決非聖人不作如薏苡仁主筋急拘攣不可屈伸久風濕痹下氣數語真萬世矩矱自千金外臺以及後相傳之佳方凡用薏苡仁者必兼有筋急拘攣不可屈伸之證寒攣用為佐使亦取其能舒筋古方小續命湯注云中風筋急拘攣語遲脈弦者加薏苡仁李氏以加薏苡為扶脾益肝不知其有舒筋之妙可謂憒憒又薏苡仁丸治脅痛脅痛非肝病耶妊婦禁服薏苡非以其瀉肝墮胎耶然則肝之合筋薏苡安得非肝藥不解金元以來竟無一人闡及天門冬主暴風濕痹薏苡仁主久風濕痹久字固大有義在蓋風濕痹非寒藥所宜風濕久而不解則寒將化熱如金匱麻黃杏仁薏苡甘草湯汗出當風久傷取冷是寒發熱日晡所劇是寒化之熱麻黃所以驅寒薏苡所以除熱無熱非薏苡責也凡此所治悉與本經符合再以薏苡體之綱目載馬志云薏苡取青白色者良蘇頌云薏苡結實青白色雷斆云薏苡顆小色青味甘據此薏苡決非純白苗發於仲春與色青得木氣為多實採於九秋與色白得金氣亦多色青兼白則為金木相媾味甘而淡則入胃不入脾主疏泄者肝司肅降者肺胃亦傳化下行之腑是肺肝挾金木之威直走而下由胃而小腸而膀胱皆其所順由之路且氣寒復歸於腎濕何能不去後人以利小便治疝皆深得此意劉氏以實結盛夏為潤下之氣還就炎上不知實結盛夏是水不畏火不畏火則制火水自就水奚肯就火本經下氣二字又包有至理如此劉氏以此之筋攣為筋膜乾余既略駁之矣考劉氏此篇宗奭曰一段加註云受濕則筋緩然濕即化熱濕合於熱則傷血血不能養筋則又攣縮筋攣固有因血虛者而此則不然鄒氏云筋之為物寒則堅勁堅勁則短縮熱而緛緩緛緩則弛長此為不挾濕者言也若挾濕則大筋橫脹橫脹則緛短小筋縱伸縱伸則弛長凡物皆然特能短而不能勁與因寒而縮者有異按橫脹之說未經人道較劉氏自勝然靈樞濕熱不攘大筋緛短小筋弛長是緛短時濕已化熱蓋初雖橫脹不致短縮惟化熱之後所謂食氣入胃散精於肝淫氣於筋者遂漸被其爍筋為之縮云不攘則熱由濕化已非一日與本經之言如出一轍薏苡止泄熱驅濕而筋即舒試之屢驗若傷血而待養血則不能如是易矣本經久風濕痹繫於筋急拘攣不可屈伸之下明其病之屬筋而上下文若斷若續幾索解不得金匱胸痹緩急一條正為本經點睛胸痹即風濕痹在手足為不可屈伸在胸為一緩一急皆久而後成皆筋病也緩急二字前人注多支吾惟鄒氏於靈素之言陰蹺陽蹺與足陽明頰筋推類以求並繹巢元方之論胸痹謂五臟六腑之寒氣因虛而上衝胸膈者寒衝於左則逼熱於右寒衝於右則逼熱於左寒者急熱者緩可謂今日發矇曠然已昭矣或問寒濕熱濕各有專藥濕既化熱乃舍治熱濕之專藥而用薏苡不名之為熱濕其亦有說乎曰痹無熱痹濕化之熱終不離寒故不曰濕熱風熱而曰久風濕痹證為熱中有寒緩急自非專由於熱此理惟寇宗奭及之曰受寒使人筋急寒熱使人筋攣若但受熱不曾受寒則不至筋攣雖與鄒說微異然緩急實惟薏苡一物治之何則寒即是濕濕去寒亦去薏苡治筋有專長也然則仲聖何為又加附子乎曰胸痹由於陽虛本非辛溫藥不治用附子不用薤桂者以薏苡有損陽之虞附子足以敵薏苡而捨短取長非以薏苡治熱附子治寒也李氏謂薏苡健脾益胃虛則補母故肺痿肺癰用之劉氏謂治痿獨取陽明陽明濕熱盛則成肺痿肺癰大腸與胃之濕熱散則肺痿肺癰自愈噫二家之言粗疏甚矣夫治痿獨取陽明者為痿躄言之也與肺痿之痿詎得同論且薏苡肺藥而肺痿不治肺痿而至吐膿成肺癰則治之肺癰之中又以胸中甲錯為最宜何則胸中甲錯乃肺熱爍液所致雖在肌膚而與筋膜聯屬肝與有責薏苡泄肺熱而能疏筋膜中乾澀故為妙藥如千金葦莖湯可徵也肺痿何以不治肺痿之因有二屬虛冷者無論矣即肺由熱爍而津液已枯筋膜無故薏苡不能潤液而且竭液奚藉此為腸癰何以治之則亦以身甲錯故甲錯雖不在胸而其為癰膿則一癰膿亦不能專任薏苡而因癰膿而甲錯則非薏苡不任與胸痹之專治緩急無二義尤氏謂此腸癰為小腸癰與余薏苡由胃而小腸而膀胱之說適合或疑肺藥多入大腸薏苡何獨不然曰此正金木相媾肝主疏泄而薏苡為肝藥之據也薏苡之主治肝居首肺次之胃以下皆其所遞及方書胃病無治以薏苡者蓋其補土止補肝中之土所謂五臟皆有土也前人惟視薏苡為補中土之藥故謂其力和緩然用之中的為效極速何和緩之有哉綠豆豆本脾家中宮之物而綠豆皮寒肉平是為由中達外以解熱故外科護心散用綠豆粉使毒氣外出若肌膚之熱毒但須治肌膚者更其所宜矣世以綠豆解藥誤不知綠豆能壓熱解毒非能於無熱毒之誤藥亦化為烏有也扁豆扁豆葉扁豆花白實白實間藏芽處別有一條其形如眉格外潔白且白露後實更繁衍蓋得金氣之最多者凡豆皆甘而入脾故能於夏令濕盛脾弱之時布清肅之令復敦阜之氣此千金與局方治霍亂所以用實也然其補脾之力極厚必得脾受濕困而不腹痛不鬱悶者方與之宜是則別錄主霍亂吐下不止不屬之實而屬之葉固甚有道矣夫霍亂者陰陽清濁二氣相干扁豆當盛熱蘊隆花尚未有而其枝葉愈矗立不撓是陰森之葉與酷烈之日各不相下絕無妨害用於清濁不調之霍亂自然清者歸清濁者歸濁然則唐本草吐利後轉筋生搗一把入少醋絞汁服立瘥者可以證別錄之不誣矣俗稱避暑扁豆棚下能作瘧甚至媆豆亦多不以充蔬此亦有故扁豆以陰森之葉御酷烈之日而花白實白全具金氣其不畏暑明矣不相畏則相爭瘧為邪正相爭之病故有所忌豆壅脾氣更何以解仲聖所以謂患寒熱者不可食也淡豆豉淡豉別錄苦寒李氏謂黑豆性平作豉則溫既經蒸罯故能升能散竊謂仲聖用作吐劑亦取與梔子一溫一寒一升一降當以性溫而升為是別錄主煩躁而仲聖止以治煩不以治躁若煩而兼躁有陽經有陰經陽經則用大青龍湯大承氣湯陰經則用四逆湯甘草乾薑湯吳茱萸湯皆無用淡豉者蓋陽經之煩躁宜表宜下陰經之煩躁宜亟回其陽淡豉何能勝任別錄以主煩躁許之殊有可商煩有虛有實虛者正虛邪入而未集故心中懊憹實者邪窒胸間故心中結痛雖雲實卻與結胸證之水食互結不同故可以吐而去之證繫有熱無寒亦於腎無與所以用豉者豉苦溫而上湧梔泄熱而下降乃得吐去其邪非以平陰逆也張氏謂淡豉主啟陰精上資而鄒氏遂以此為治傷寒頭痛及瘴癘惡毒之據不知其有毫釐千里之失蓋傷寒初起與瘴癘惡毒雖身發熱實挾有陰邪在內故宜於蔥豉辛溫以表汗或協人中黃等以解毒何資於陰臟之精且淡豉亦何能啟陰臟之精者試煎淡豉嘗之便欲作惡可恍然悟矣淡豉溫而非寒亦不治躁確然可信鄒氏過泥別錄遂致詮解各方忽出忽入自相徑庭黑大豆本腎谷蒸罯為豉則欲其自腎直上因其腎谷可以治腎故千金崔氏諸方用以理腎家虛勞因其為豉不能遽下故與地黃搗散與地黃蒸飯鄒氏謂於極下拔出陰翳誠是乃其解蔥豉湯既謂宜於病起猝難辨識又謂是熱邪非寒邪不知葛稚川立方之意以初起一二日頭痛恐寒犯太陽脈洪又恐熱發陽明投以蔥豉則邪解而陰陽兩無所妨正因難辨而出此妙方宜後世多奉以為法煎成入童便者以蔥豉辛溫少加童便則陰不傷而與藏氣相得如淡豉本寒更加以童便之寒蔥白雖辛而亦寒外達之力必致大減恐無此製劑之理也鄒氏又以素問氣寒氣涼治以寒涼行水漬之注家謂熱湯浸漬則寒涼之物能治寒涼於是引傷寒論用豉諸方皆不以生水煮為合以寒治寒之旨金匱梔子大黃湯不以治寒則四味同煮不分先後噫鄒氏誤矣所云注家殆近世不求甚解者耳按氣寒謂北方氣涼謂西方跟上節西北之氣句來治以寒涼行水漬之跟上節散而寒之句來上言其理此明其治王太僕注云西北方人皮膚腠理密人皆食熱故宜散宜寒散謂溫浴使中外條達行水漬之是湯漫漬張隱菴云西北之氣寒涼人之陽熱遏鬱於內故當治以寒涼行水漬之者用湯液浸漬以取汗合二說觀之經所謂漬定是浴以取汗今西北方人慣用此法並非以熱湯漬寒藥若謂以熱湯漬寒藥即可以治寒病則藥物不勝用矣然則梔子豉湯先煮他藥後煮淡豉何故蓋此與瀉心用麻沸湯漬之絞汁無異耳豉本腎谷欲其上達故不多煮大凡用豉以取吐取汗法皆如是取汗如枳實梔子豉湯煮豉止一二沸以有枳實抑之故用豉至一升而煮則一二沸無妨也梔子大黃湯四味同煮則以不取吐不取汗自宜多煮豉用一升亦以所偶為大黃枳實而豉尚欲其治上也他若金匱瓜蒂散則以生水煮取吐矣但豉用七合不云下水若干以生水任煮而不為之限可見必欲竭豉之力味厚則下趨易或疑此與吐法不悖乎不知吐宿食與吐寒飲不同吐宿食自當少抑其上浮之性雖抑之而以苦溫之淡豉偶苦寒之瓜蒂甘酸之赤豆終必激而上行且苦寒甘酸者杵為散苦溫者煮取汁皆有一升一降故拂其性以激發之義安在不為吐法鄒氏於經旨方意咸未徹悟強為扭合不免自誤以誤人矣飴糖土爰稼穡作甘飴糖乃稼穡精華中之精華脾土位居中央若虛乏而當建中建中而不旁鶩者惟飴糖為然故仲聖方凡名建中必有飴糖否則不與以是名補脾之物有五曰人參曰大棗曰粳米曰甘草曰飴糖皆能治脾虛之腹痛而皆有宜有不宜虛而挾寒則必君以驅寒之品如大建中湯之以參飴協椒姜是也寒在下焦不宜如當歸生薑羊肉湯烏頭桂枝湯之無此五物是也附子粳米湯治腹中寒氣雷鳴切痛胸脅逆滿嘔吐何嘗不是下焦之寒何以有粳米甘草大棗又何以無參飴曰此無味不確切須就其證細審之耳寒在腹中而痛實由下焦濁陰上泛致胸脅逆滿嘔吐附子所以溫腎半夏所以止嘔脾虛宜補而有嘔吐之虛則中不宜滯陰則宜益米棗甘草所以補虛而益陰人參嫌其升氣飴嫌其滯中故避之小建中甘草用炙而此不炙亦以其滯故也脅鞕當去棗而此不避以其脅滿而非硬也可謂頭頭是道矣鄒氏謂桂枝加芍藥湯主腹滿痛小建中湯主腹急痛蓋芍藥酸而破陰飴糖甘而緩急此言是矣然小建中治急痛而芍藥仍在者有故也徐氏云桂枝湯外證得之為解肌調營衛內證得之為化氣和陰陽桂姜協草棗所以化陰芍藥協草棗所以化陽芍藥不止治腹滿故小建中於虛勞裡急悸衄等證皆主之惟以治滿痛則於桂枝湯原方加一倍而飴糖則擯之耳鄒氏於建中大小之分創為勢合勢分力專力薄二說而斷之以君尊而臣從命君卑而臣擅命實則終無一當也何以言之小建中所治不一而其扼要在建中以云建中猶建中之小者耳若大建中則專治中藏虛寒不兼顧他經之證腹中寒句是主余皆腹寒之所波及周揚俊云中氣虛則陽氣不布故所積者為寒飲所沖者為寒氣尤在涇云陰凝成象腹中蟲物乘之而動二說極當溫脾無過乾薑補脾無過人參膠飴椒能由脾達腎以消飲而殺蟲亦溫脾之要藥此四物大溫大補不出中宮建中有大於是者乎觀於大建中惟入腹滿一門小建中則分隸於傷寒論與金匱之血痹黃癉婦人雜病各門仲聖製劑標名之意更灼然可見自來注家無論及此者殊足怪也韭根葉同用韭子素問食氣入胃濁氣歸心韭味辛臭濁故歸心尤易以其歸心故素問謂心病宜食韭葉然必心為陰壅陽不能達借韭以達之非可療一切心病也胃脘有瘀血作痛者飲韭汁極效蓋韭以入胃之濁氣歸心即以留胃之濁質治胃推此以治胸痹吐衄膈噎諸證亦即下氣散瘀之功別錄韭子主夢中泄精溺白鄒氏以素問陰藏精而起亟陽衛外而為固釋之極是蓋陽不維陰則陰不起亟而藏精陰不維陽則陽不為固而衛外夢中泄精者陽不維陰也溺白者陰不維陽也韭豐本而子又入腎甘溫足以起亟酸溫足以為固兼斯二長所以為夢中泄精與溺白之妙品此但陰陽兩不相維若虛甚而患是證則韭子無能為役或當更加以溫固之劑矣蔥白蔥之為物莖則層層緊裹而色白氣涼葉則空中銳末而色青氣溫凡仲聖方用蔥無不是白其層層緊裹之中即含有欲出未出之青葉是為陽涵於陰猶少陰寓有真陽其生氣上出含有青葉則又似厥陰色白又似肺信乎其為肝腎為肺藥矣通脈四逆湯證面色赤者陰格陽也陰既格之必當使陰仍向之姜附能扶陽驅陰而不能聯陰陽之睽隔惟蔥白升陰以為之招陽乃飄然而返陽返而面不赤然則白通湯證無面赤何為亦升其陰夫陽在上宜降陰在下宜升少陰下利一往不返失地道上行之德姜附能扶陽而不能升陰以通陽陽不通則陰下溜而利不止故以蔥白冠首而名之曰白通通非通脈之謂也旋覆花湯治肝著欲人蹈其胸上有上下不交之象以旋覆散結而降陽蔥白升陰而上濟新絳佐旋覆並能通陰陽之路俾上下交而成泰至婦人半產漏下肝腎之陰已下沉矣非通其血中結滯之氣與挽之使上不可旋覆新絳所以通之蔥白所以挽之玩此三方蔥白之用於肝腎者悉見矣特是本經主出汗後世亦多用於表劑義又安在蓋心與腎手足少陰相通者也汗為心液蔥白升腎陰即入心營色白味辛則又能開肺衛之郁此汗之所以出也

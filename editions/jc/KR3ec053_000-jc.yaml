body:
  text: 自敘醫可易言乎哉在聖門曰小道在史家曰方伎顧所謂小道者特視大學之道位天地育萬物為小焉耳神聖作之於前賢哲述之於後李唐而降斯道浸微非實有至精至神方可與斯之一境胡為史冊所載代不數人若倉公扁鵲華元化一流則更無代興而特起江氏艮庭有云孔子聖無不通焉有不知醫者自牖執手切其脈也而孔子教人遊藝如禮記疏所稱夫子脈訣卒未聞傳之其人豈真以方伎而賤之蓋其慎也憶余幼時曾以春溫誤服麻黃致舉室怔營迨咸豐丙辰以副車入貲為比部主事留滯京邸又以寒痢為醫投涼劑而誤更醫復然危狀迭見賴友人檢方書鑑前弊而拯之得以無虞余於是始有志於醫恆詣廠肆購書置之几案朝夕披覽雖至困甚亦冀鬼神來告不悟徹不已久之為人療病時或幸中謬竊虛譽然自甲子改官邑令所宰晉祁皖舒皆地當孔道差務絡繹又不用門丁一人事無鉅細靡不親裁計束醫書高閣者凡十八年洎壬午調任盱眙自分無治劇才甫捧檄即乞疾而歸戢影蓬門無以遣日則復取群籍研求加邃乃喟然曰余向之於醫猶門外漢耳今其或者可與入門矣夫學問之道不外致知力行兩端醫何獨不然致知之書如素問靈樞本草經尚矣而傷寒論金匱要略則又南陽先師本致知以為力行之書靈素本經悉括其中學者能即是而寢饋篤好之積以歲月真可引伸觸長施用無窮然而談何易也人知辨證之難甚於辨藥孰知方之不效由於不識證者半由於不識藥者亦半證識矣而藥不當非特不效抑且貽害竊怪古來注仲聖書者無慮數十百家獨於方解鮮精確澄徹其故在本草之學自來多不深求識本草如是遂視方義亦當如是於古人因證施治之微旨去而千里矣讀仲聖書而不先辨本草猶航斷港絕潢而望至於海也夫辨本草者醫學之始基實致知之止境聖人列明辨於學問思之後其功自非易致譾劣如余何足語此然而遐軌勉躡樂豈辭疲秉燭之明歲有增益自戊戌春有六氣感證要義之刻嗣於藥用有心得者即徵諸方方義有見及者並印以藥弗明弗措惟竭吾才今又六更裘葛取所著稽之得藥百二十八味聊依綱目編次釐為四卷大抵援據仲聖兩書而間附以他說他藥隨手札記殊無體例余老矣值時局之艱虞念儒冠之多誤是惟弓冶可得蟬嫣爰命孫兒智浚錄付剞劂以垂來許並問世焉若云臧否人物以自表異斯醫工之故習而非余之所敢蹈爾光緒三十年甲辰夏四月鹿起山人周岩自敘於微尚室時年七十有三緒說本草思辨錄甫授梓適有客以彼都近事醫會相告竊不自揆為發其蔀而余夙嘗欲辨不果者至是亦縱言及之名之曰緒說列為卷首欲學者知審擇端趨向也醫雖藝術而深詣甚難西醫挾形質之說蔑視我中醫而中醫之厭苦其難者得彼說則大喜相與揚西而抑中不思古聖垂示氣化實由洞明形質而西醫解剖形質何從窺見氣化故西醫之在中國能療內證大證為遐邇傳頌者不少概見乃求醫者並不競慕乎西而業醫者反欲自棄其學今且狂瀾特起有訾黃帝內經神農本草南陽先師傷寒論金匱要略為謬為荒誕為羌無故實者矣此等妄談豈足撼數千載而上懸諸日月不刊之聖經而獨惜夫相將入火坑者之甘為眾盲也素問九卷有王太僕補足者一卷靈樞一經或疑即王氏竊取素問為之近人何西池嘗靜坐數息每刻約得二百四十息以靈樞日夜計一萬三千五百息為不經此類固間有偽託靈不如素難經又不如靈素要在人分別觀之而其中淵理不可思議體之人而實萬無不驗者已數千載奉之為圭臬豈癖嗜耶抑別有所希耶非人愚而我獨智蓋彰彰明矣今不商量加邃而徒以風會所趨創為喪心病狂之舉誠世道之隱憂可為太息者矣傷寒論金匱要略直可上擬聖經不當與諸醫書同論醫書汗牛充棟大抵下駟十之七中駟十之二上駟十之一上中駟之書無不由研求內經與仲聖書而出今賤中醫貴西醫而治病則仍以中醫上中駟之書已為彼所唾棄其將於下駟書求進步乎必不能矣醫家故習每好議前人之失而己亦不能無失然皆其人勇於衛道矯枉過正或隱奧之義所見不同者有之未有毫無學問醫亦走方者流因得見臟腑遂謂道即在是敢以無理之詬爭上侮古帝昔聖如著醫林改錯之王清任者可謂謬妄之至矣試歷舉而論之第一篇臟腑記敘開口即以宋元人臟腑圖論與內經混駁一番臟腑圖論原不足取乃其與內經並舉概稱古人其胸中無黑白可知謂古人錯誤者不一而足而不言其所以錯誤忽指稱靈樞曰手少陰三焦主乎上足太陽三焦主乎下而靈樞實無其文尤可笑者謂黃帝慮生民疾苦平素以靈樞之言下問岐伯鬼臾區故名素問尤可忿者謂二公如知之的確可對君言知之不確須待參考何得妄對遺禍後世莊子有言哀莫大於心死其殆言未出而心先死者歟第二篇會厭左氣門右氣門衛總管榮總管氣腑血腑記按此篇記其所見不為不詳謂出氣入氣吐痰飲津涎與肺毫無干涉古人誤以咳嗽等證為肺病肺管兩旁有左右氣門兩管下至肺管前半截處歸併一根入心從心左後下行至肺左過肺入脊復下行至衛總管衛總管有對背心兩管有對腰兩管有腰下兩管腰上對脊正中有十一短管痰飲在管中由管中之氣上攻行過心由肺管前出左右氣門接衛總管之下氣管之多如是痰飲究從何管上至兩氣門何者從左出何者從右出其不言者是仍不知也謂衛總管俗名腰管腰上長兩管一管通氣腑氣腑是抱小腸存元氣之物元氣即火元氣足則食易化虛則難化然則元氣在小腸外能化小腸內之食氣管在肺外肺不能化氣管內之痰飲有是理耶經言臟者藏精氣而不瀉惟肺管清虛故能運管外之痰飲否則肺管已為痰飲塞滿何問痰飲清任不知此理宜其以肺為無用之死臟也第三篇津門津管遮食總提瓏管出水道記接第一篇飲食由小腸化糞一段宜併入此篇與第四篇腦髓說余俱有論列下第五篇氣血合脈說人之有脈與脈之可以驗病斷不出內難經所言清任謂人身氣管出氣血管藏血脈從氣出無與血事手腕肉厚者脈短薄者脈長大小者虛實之分急慢者寒火之分不知氣與血若不相貫則人為呆物脈非指下難明則人皆知醫又謂古人論脈二十七字余不肯深說者非謂古人無容足之地恐後人對證無談脈之言此冀掩其短而適自暴其短書中證治數十條所以無一字言脈也第六篇心無血說西醫謂心內有左右四房皆有管竅為生血回血之用正與內經說合而清任以心為氣出入之路其中無血又云豬心刺破則腔子內血流入於心不刺破之心內並無血是以盆盎之盛水比心心非腑焉能盛血清任於圖內肝下亦注絕不能藏血五字古書豈得呆看經不又云脾臟肉乎吾知清任必更駭之矣卷末附辨方效經錯之源論血化為汗之誤一篇仲聖麻黃桂枝兩湯清任改其文為麻黃湯治頭疼身痛項強發熱惡寒乾嘔無汗桂枝湯治證如前而有汗謂傷寒初得頭疼身痛項強發熱惡寒未有兩胳膊兩手不疼痛發熱惡寒者用麻黃湯亦未有周身皆愈而獨不愈兩胳膊兩手者豈不是方雖效而經絡實錯之明證改仲聖文而又坐仲聖以過何便宜乃爾按項強為陽明病四肢煩疼為太陰病斷非初得時所兼有時疫則有之方不的對而病竟愈亦往往有之庸醫所得以售技者在是自矜者亦在是要知仲聖為天下後世立法不能為庸醫詭遇也謂有汗是傷風從未見桂枝湯治愈一人傷風豈定是有汗桂枝湯不能治傷風近世醫者多有此論而不知其故由本領不濟乎清任以桂枝湯不效因頭疼身痛發熱有汗非傷風證此與桂枝湯別一條頭痛發熱汗出惡風者桂枝湯主之似乎無異而非無異也仲聖不言脈者以太陽病汗出惡風者脈自浮也為問果太陽病乎脈浮惡風乎不言身痛者以太陽病頭痛發熱汗出惡風而又加身痛則桂枝湯宜加減也何為而不加減乎己不細審而遽責效於桂枝可乎不可又有奇者清任用桂枝湯而尚不知為何證曰非傷寒證也乃吳又可所論之瘟疫也又教其侄曰欲明傷寒須看吳又可論是清任固嘗讀又可書者又可因其時疫氣流行時師多以傷寒法誤人故著瘟疫論一書清任時亦疫氣流行胡為以桂枝湯治疫氣夫疫氣與疫氣不同其殆用又可法不應而用仲聖法用仲聖法又不應而復用又可法乎若然則無往不誤矣謂目痛鼻乾不得眠是邪熱上攻頭腦之證仲聖以葛根湯治之又是方效經錯之明證按傷寒論葛根湯證何嘗如是內經有陽明主肉其脈挾鼻絡於目故身熱目痛鼻乾不得眠之文活人書二問亦有之並不言宜葛根湯葛根湯治此證則是陶節庵全生集於葛根湯加白芷升麻云即葛根解肌湯其證尚有發熱頭痛微惡寒無汗脈微洪等字清任既不知陽明病之脈證為何而又張冠李戴妄詆仲聖昏蒙殆無其比謂人生氣血兩管氣管通皮膚有空竅故發汗血管通皮膚無空竅故不發汗是知汗非血化汗固非即是血然汗為心液亦血中之熱氣所蒸而成故奪汗者無血奪血者無汗試無不驗夫血既蒸為汗則已由靜之動故能透毛孔而出若汗出而血亦出或無汗而血自出則血應靜而不靜不為陽之守也其義皆在內經清任何足以知是泰西一切藝術竭其智能孜孜不已無廢於半途其醫於內證雖未見擅場苟參以中國經訓探本窮源亦必有登峰造極之詣如中國盧扁其人者吾中國醫流有恆者鮮每讀一書旨趣未得輒生疑畏故往往古籍遺亡不可復見至內科之有器更未之前聞而不知古固有之其在宋重醫學之日也四庫全書提要載周密齊東野語曰嘗聞舅氏章叔恭云昔倅襄州日嘗獲試針銅人全象以精銅為之腑臟無一不具其外腧穴則錯金書穴名於旁凡背面二器相合則渾然全身蓋舊都用此以試醫者其法外塗黃蠟中實以水俾醫工以分折寸案穴試針中穴則針入而水出稍差則針不可入矣亦奇巧之器也後趙仲南歸之內府叔恭嘗寫二圖刻梓以傳焉今宋銅人及章氏圖皆不傳按此則西洋蠟人形不過具有體質而茲並腧穴用針之法悉寓其中智巧亦何遜西人今雖不可見矣然吾中國近年傑士奮興創制奇器者亦頗有之苟其挽醫學之頹波復銅人之巧制施之證治用彰明效醫林之幸正不獨醫林之幸也唐氏容川所著中西匯通醫經精義一書持中西之平闡造物之秘洵為有功醫學余復何贅茲讀中西書若有所得有可以翼唐氏書者敢抒其一得焉陰者藏精而起亟故腎之精華必聚於上上為末而下為本西人謂腦主知覺心不主知覺是但見其上之精華而不見其下之蘊蓄也是不知陰為陽守陽為陰使也陰陽動靜之理吾中醫亦豈能測識所幸者有神聖之遺經耳醫至今日可謂逸矣西醫自中國周烈王時即有解剖之學至今析極毫釐何如其旁而不知猶是跡象也內科理法云凡人愈留心則知覺之事愈明又云凡能留心者視物較清後亦易記不曰留腦而曰留心可見主權自屬於心又全體通考云腦筋由心叢而來其叢乃脊髓百結兩根之所為腦筋既根於心叢自屬心主知覺腦髓聽命於心此可譬之電線心發電脊過電而腦其至所也蓋腎生精化髓而輸於腦心以陽而為腎之使理固如是必泥跡象以求則所謂銅山西崩洛鐘東應者西醫必更斥其誕矣飲食入胃分清濁兩路而出非經中間泌別不可唐氏引西說飲水入胃即散走膜膈以明水之不入小腸然小腸豈是專受穀食者全體通考論胃與小腸篇皆中有糜粥字是胃與小腸明系水穀雜居外受相火之蒸化說較勝矣而於水穀之納入輸出與泌別若何則一字不題殆未能了了也此當以我中國聖經為斷曰五穀入胃其糟粕精液宗氣分為三隧又曰中焦亦並胃口出上焦之後此所謂受氣者泌糟粕蒸精液化其精微上注於肺按泌別在中焦當即西醫之謂連網王清任之謂津門者是水不盡散膜膈者為其分三隧也夫水穀經胃與小腸蒸化而後所餘皆棄物其揚帆直下可乎而清濁有異也又烏得不泌別此又聖經明告之矣曰水穀者常並居於胃中成糟粕而俱下於大腸濟泌別汁循下焦而滲入焉楊上善注云下焦在臍下當膀胱上口主分別清濁而不納自來醫家從不言有兩泌別者聖經實嘗言之理亦誠然然則泌別在下焦何處乎西醫謂腎主生溺其圖將腎豎割之內有萬錐漏斗腎盞等名下有溺管腎之外廓亦無進溺之口溺固為腎生矣然余不能無疑焉凡人飲水多者溺多少者溺少明系溺由飲來一也所飲之水若全不化溺必將有腫脹泄瀉等病二也溺待腎生勢必不給三也腎生之而旋瀉之竟無所用四也西醫因何致誤殊不可曉唐氏謂左右兩腎繫有竅最深貫脊骨通三焦復有兩管下接膀胱若然則水從中焦下焦而下者皆歷腎系抵膀胱腎系實為泌別之處經言少陽屬腎腎上連肺故將兩臟是合三焦與肺之力以施其伎巧故知此處泌別最有關係內科理法云肺與皮膚出氣多則溺少出氣少則溺多此即內經氣化斯出之理膀胱惟無上口所以溺出必待氣化乃西醫言有上口而王清任曾諦視者又言無上口其殆有上口亦在包膜中非氣化不出者歟自西醫腦髓司知覺之說行於中國而中國人不察信之者眾試更論之腎精生髓由脊入腦猶草木果實之結於頂上余考西醫每云腦筋從某來者多是上來至下以本為末以末為本其弊實由於是然即其說還叩之亦有可正其非者腎有髓質西醫言之不一他處無有腎上核則言腦筋極多非髓由腎生而何中國謂心系貫脊屬腎而西醫亦謂心叢乃脊髓百結兩根之所為非心與腦相通而何西醫言腦有透明之密質心房之裡膜亦言薄滑透明非腦之明根於心之明而何此皆見於全體通考者抑內科理法不云乎背脊髓不通於腦髓即不知覺是又隱以腦髓為不司知覺矣大凡西人之性最長於化學其習醫亦無非化學詰以陰陽五行之理人身十二經脈奇經八脈營衛溪谷之遊行出入則茫然無知即告亦不信中外天資之限人若是所不可解耳全體通考德貞氏自序以中醫為守舊為妄作實乃坐井觀天之見善守舊者其舊皆不可變之天道惟篤守而精研之新義斯出今日之中醫非守舊乃棄舊耳棄舊故妄作非德貞氏之所謂妄作吾慨夫以西人之智而惟斤斤守解剖之學也解剖至此形於何遁然但見其所可見而不見其所不見氣之帥血猶君之帥臣夫之帥婦此理豈尚有可議乃德貞氏不信而轉疑帥氣之無物蓋剖胸則止見胸剖腹則止見腹局守形質之弊必至於此自序又極詆中醫脾動磨胃之說脾磨曰動此中醫之謬談不出於古經脾傷不磨則有之脾若不能磨食則消化之具何以脾列其內非彼之所自為者乎德貞氏憫中國之無良醫而欲中國立剖驗之館用心良厚不知中國古昔未嘗不行此術太素有云若夫八尺之土皮肉在此外生可度量切循而得死可解剖而視下文即繼之以人之所以參天地而應陰陽不可不察古聖惟不專講解剖是以醫學得詣於至極西醫之短即在其守舊不變吾知西醫居中國待多歷年所必有讀中書而翻然改計者矣人身陰陽無判然各具之理陰陽雖分左右而左亦有陰右亦有陽故經言左右者陰陽之道路不言左者陽之道路右者陰之道路大抵肝木自左生心火而上升心火克右之肺金協胃而下降胃亦金也管子左者出者也右者入者也正與此合水生其木而腎之真陰偏位乎左以坎為陰中之陽也火生其土而腎之真陽偏位乎右以離為陽中之陰也蓋生土者命火而剋土以腐熟水穀者少陽之木火肝與膽皆木也故弦為肝膽兩經之脈而皆見於寸口左關近世西醫有肝右之說而中醫亦從而和之於義實無所取且肝亦何嘗居右也肝居脊之正中而膽藏其右葉則左葉自當為肝之正體天地之道左陽而右陰肝得少陽生氣亦必左出而右入診肝脈於右關則謬矣周慎齋主肝右者也云一人病左脅痛後傳之右當不起痛傳於右邪入臟矣噫豈其然乎脅痛在右者比比未聞一痛即死此必其人肝病已深移右而並戕其膽生機全滅故即不起傷寒論循衣摸床微喘直視云脈弦者生澀者死非以弦為有生機乎又有以右脅痛為肺病者肺居膈上脅非其部亦未聞小柴胡湯不治右脅痞硬也鄭氏康成駁說文云今醫病之法以肝為木心為火脾為土肺為金腎為水則有瘳若反其術不死為劇鄭氏以儒而知醫此可為醫者當頭棒喝矣民非水火不生活人身五行亦惟水火尤貴經云一水不勝二火所謂一水者先天腎臟之水也坎中一畫為陽火即生於其中與後天木火為二水陰也火陽也陰靜而陽動人之動作云為全賴乎火經所以有君火相火之名也自來醫家於此二義各執一說紛紜莫定或以君火屬命門或以相火屬心包絡或以君火專屬肝腎或以相火專屬三焦或謂君火生右尺相火或謂相火為元氣之賊不知其於經旨實悖也經云君火以明相火以位王注謂君火在相火之右不主歲運相火守位以稟命君相二字本不費解蓋猶人君端拱而無為相臣協贊以宣力故一主歲運一不主歲運然則君火果何指也經云聖人南面而立前曰廣明後曰太衝太衝之地名曰少陰以南面與太衝之義揆之少陰自當謂足經相火果何指也經云少陽之上相火主之少陽亦當謂足經雖然腎為坎水而其所藏之火實與心之離火相應心以腎為體腎以心為用君火實兼手少陰心視守位稟命之相火則大有不同故少陰之上熱氣主之不言火氣主之火氣以少陽主之者明乎其為臣也非火與熱有二也夫君火兼有兩經未嘗專屬心相火亦兼有兩經自以三焦配膽或疑六經惟三焦不言何火心包絡不言何火心包絡非君火三焦安得為相火曰三焦主出納主腐熟水穀皆火之所為其火即少陽木火也心包絡乃心之宮城專於衛心主權不屬然其托體甚高亦不下濟相火故君火相火兩無所與也前人惟張戴人識此意曰人之心腎為君火三焦膽為相火王宇泰採入證治準繩消癉門不知戴人尚有論否趙養葵偏見之重與戴人同其識高之處亦有可節取者趙以命門火為水中之火君主之火謂應事接物者心棲真養息者腎腎尤重於心趙雖未知手足少陰皆為君主之義論亦前後不符而此數語卻暗與經合試更為引伸以足之先天之火有南面之尊安得不為君火惟恃有應務接物之心故得以棲真養息火則同出一源故同為君火至趙用八味丸治多病不可為訓而八味丸補水中之火則是正方蓋水中之火不宜偏用陽藥有桂附必得有萸地若腎中中有寒邪則宜以姜附驅邪如四逆湯之類恐水中之火出而相拒則加膽汁人尿以靖之不加壯水藥此仲聖本經立方之旨也後人用其方而並得其旨者蓋寡證治準繩發熱門腎虛火不歸經用十全大補湯吞八味丸一段王氏謂水中之火不可以水折故巴蜀有火井焉得水則熾得火則熄桂附固治相火之正藥也以桂附為正藥而譬之巴蜀火井則其於水中之火之治法猶未深知豈忘乎十全大補之有歸地八味之有萸地乎相火關乎人身之重猶國之重賴乎相蓋其秉東方甲木之氣人身得之則四時皆春生機不息經之言少火即此火肝則非其比也肝為厥陰厥陰之盡主疏泄而下降人或以相火屬之由其視相火為腎火也夫陰陽之道誠難言耳以心與腎較則腎火主靜而心火主動以心腎與膽三焦較則君火主靜而相火主動君火所以屬少陰者照四方而神蘊乎內也相火所以屬少陽者生萬物而功普於外也經之所已言者吾以文繹之經之所未言者吾以意逆之庶乎其不至逞臆說而失真理也素問以工不知標本為妄行而標本之屬不一自啟元子注天元紀大論以三陰三陽為標寒暑燥濕風火為本而後世奉為金科玉律實乃大誤不容不辨也夫陰陽者無形之六氣六氣者有形之陰陽絕無分於上下安得別之為標本經之言曰寒暑燥濕風火天之陰陽也三陰三陽上奉之明明以寒暑燥濕風火指為三陰三陽對下下應而言故曰上奉又曰積陽為天積陰為地天地且陰陽之所積若論標本陰陽不更為本乎竊嘗統覽全經凡言標本皆判若兩物敢以經文一言蔽之曰不同腎與肺病與工先病與後病其不同之顯著者不具論少陽之右陽明治之云云此申明左右有紀以不同之間氣為標也少陽之右火氣治之云云此申明上下有位以不同之六承氣為標也按此兩言氣之標皆不同於本故下結以本標不同氣應異象兩語若空說本不同標標不同本何至有此駢枝不同二字自須著眼其次一氣之標詞句佶屈罕得其旨高士宗素問直解以六氣為上一位中見為中一位三陰三陽為下一位陰陽六氣本屬一家乃擘分兩下雜入中氣於中可發一噱亦足徵王注之誤人其弊必至於此玩所謂本也一句不著於中見陽明之上而著於其下尚得撇中氣於本外乎著氣之標一句於見之下尚得謂標氣不在中見之下乎中見與本因互為表裡故俱得為本不能無表裡之分故中見為本之下本之下中之見兩句義蓋如是在見之下者則舍六承氣而奚屬觀新校正以此與六承氣一節均引六元正紀大論為證亦隱然見及之矣或曰厥陰之上風氣主之風氣在厥陰之上故厥陰為標不知此上字猶蔡邕獨斷所謂上者尊位所在也與上下之上有別不然子午之歲上見少陰何以不云下見少陰子午之上少陰主之何以不云熱氣主之觀所謂本也是謂六元兩句連下厥陰之上風氣主之等句亦兩句連下本字兼頂三陰三陽玩味之即見王氏惟誤認標本故其注至真要大論也強名其標本之同異以陰為寒陽為熱有本末同本末異之說天地造化之機其陰陽錯綜難以跡求少陽太陰看似本末同矣而甲木與乙木同氣厥陰非陽己土與戊土同氣陽明非陰同之中暗藏有異少陰太陽看似本末異矣而腎水亦陰小腸火亦陽異之中兼寓有同況經有六而以寒熱概之標本多寡相懸且絕無界畫可守恐無此顢頇之經文歷考醫集以表裡先後之類分標本者皆燦若列眉不稍淆混依王說列六經標本則皆意為分隸按之各家互有出入信乎王說之不可為典要也然則六氣標本所從不同者何謂也曰此一語是冒下總綱下即申明不同之故與所從之何氣又繼之以從本者化生於本云云明乎其從之為化生非病之化生下文百病之起一節乃是說到病生經文何等明顯蓋本猶主也中猶賓也標則亦本亦主而未有定分者也是故從本則中氣從本從中則本氣從中推之從標亦然猶主賓之相為酬酢而他人不與焉者也自專以人身之病言而論者偶觸一事遂詡心得並不統會全文如劉潛江以葛根起陰氣為從太陰行化合陽明從中氣之義是葛根之從非本文之所謂從陸九芝以濕溫為陽明生於中氣之病治以蒼朮白虎不特仲聖濕溫無此說即許叔微之論賊邪亦不然至他病之從生律以此而不合與厥陰亦當有中氣病則兩家皆置不議矣素問言從言化生不可勝數而此一節論者咸以病求總緣未明標義余蓋於此又得一標本相反之旨焉相反者不同之極亦不同也何以言之六氣中從本從標者止少陰太陽少陰一臟兼具水火自反者也而中氣太陽之水又與少陰之火反太陽水也而中氣少陰兼具水火自反者也其火與太陽之水又反其餘四氣則皆木火相生土金相生欲不以反為標義得乎且此義經又明告之矣曰病反其本得標之病治反其本得標之方按所從以化生言故從標者止少陰太陽此以病言統乎六氣故反乎本即為標如間氣六承氣皆是乃王注言少陰太陰二氣餘四氣標本同既以二氣為反獨不思二氣之反是水火本具之反非恍惚無憑之反王氏意中惟橫一懸擬之標本故既不知反之概乎六氣而將四氣除去又並二氣之本相反者而故昧之處處欲伸其說實處處自貢其瑕顧余則因而參考前後得以四通六闢亦王氏之啟余也其木火相生土金相生而一則從母一則從子者奈何陳修園謂木從火化燥從水化是矣但天氣不加君火而相火稟君之命以守位不能為木所化土位中央有面南之尊不能為金所化要之皆相從而後生者也其從標而有取於相反者奈何水與火勢均力敵而不容偏廢壯水之主則陽光以鎮益火之原則陰翳以消相反之中實有相濟之妙故進則為主亦退則為賓不能專從標而或則從本或則從標經文又煞有斟酌如是或曰王氏訓標為末本諸說文不當創為別解曰末者名也不同則徵以實反又不同之所推而極之皆末之一義所引伸也豈戾古哉抑王氏尤有誤者本標不同氣應異象之下王註標者病之始本標不同所以氣應異象下句方以病言標有何病本又何以不病況先病為本後病為標經之明訓何反以病始為標阮氏經籍籑詁引之亦未之深考矣素問之有訓詁權輿於全元起而今不復見學者多宗王氏王氏釋經之功自不可沒而其踳駁則亦往往而有自宋而後注家每有是正獨標本無疵之者不揆檮昧竊擬斯篇願與學者共商之此余舊作素問標本王注辨今復加研核似尚無漏義故錄存之徐洄溪陳修園皆尊信本經與仲聖之至者徐謂神農為開天之聖人實能探造化之精萬物之理仲聖諸方悉本此書藥品不多而神明變化已無病不治又其所著百種錄自謂探本溯源發其所以然之義所著傷寒論類方自謂於方之精思妙用一一註明發其所以然之故陳謂藥性始於神農不讀本草經如作制藝不知題在四書仲聖集群聖之大成即儒門之孔子又其所著本草經讀自謂透發其所以然之妙求與仲聖書字字吻合今按二家之書於本經皆止順文敷衍於仲聖方皆止知大意徐雖較勝於陳而不能實踐其言則一也試姑舉人參一物以明之小柴胡湯胸中煩而不嘔者去半夏人參加栝萎實一枚徐注云不嘔不必用半夏煩不可用人參栝蔞實除胸痹此小陷胸之法按心煩喜嘔為少陽本證或煩而不嘔則方有加減觀心煩喜嘔之用參即可知參之去為煩而不嘔不嘔自無需半夏故以去半夏人參並言之蓋嘔則胸中之邪不至於窒若不嘔而用參則更閉其邪故去參而加以蕩胸之栝蔞實徐以不嘔與煩拆講又但知別錄栝蔞實主胸痹而不知證之何以胸痹故其注語全不中肯況柴胡加龍骨牡蠣湯煩而有參柴胡桂枝幹薑湯煩而不嘔無參不可參觀而得之邪陳謂桂枝加生薑芍藥新加湯特提出沉遲二字以辨身痛不是餘邪乃營血凝滯作痛故以人參借薑桂之力增芍藥領入營分以通之不知仲聖云沉者營氣微也又云遲者營氣不足血少故也人參入營生脈有專能故以脈沉遲明加人參之故豈以為營血凝滯之故又謂四逆湯通脈四逆湯俱不加參慮陰柔之品反減姜附之力而論中有四逆加人參湯者以其利止亡血而加之也茯苓四逆少佐以人參者以煩躁在汗下之後也按二方之證兼有外熱而利故雖脈微不加人參四逆加人參湯惡寒脈微而身不熱故加之夫利止脈不出者加人參仲聖固明明言之是其加參為脈微非為利止亡血至茯苓四逆湯乃少陰陽虛上擾其心故煩躁以四逆扶陽而平躁茯苓入腎而抑陰人參入心而去煩各味俱有實義何得以顢頇了之二家之論方辨藥大率類是又不獨二家為然語有之儒學醫菜作虀噫豈易言哉集中人參未言治煩故補論之

body:
  text: 卷四沉香腎中陽虛之人水上泛而為痰涎火上升而為喘逆沉香質堅色黑而沉故能舉在上之水與火悉攝而返之於腎其氣香性溫則能溫腎以理氣即小便氣淋大腸虛閉亦得以通之而要非以宣泄為通也沉香之用以氣雖功在降攝而凡氣分中之病仍能運轉於中而不留滯若滾痰丸以沉香佐礞石大黃黃芩治實熱老痰則其知沉香也深矣烏藥烏藥色黑味辛氣溫而香其主膀胱腎間冷氣攻衝背膂宜矣而寇宗奭謂與沉香同磨作湯點服治胸腹冷氣甚穩當者何故蓋其根如車轂紋橫生非降亦非升故凡病之屬氣而涉寒者皆可治所謂空通者轉氣機也縮泉丸治小便頻數溫腎固氣惟恃益智山藥佐烏藥則以散冷氣耳黃柏黃柏為五臟腸胃清濕熱之藥表裡上下俱到表有熱可治表不熱而裡熱亦可治色黃入腸胃皮入肺微辛亦入肺氣味俱厚性寒而沉入肝腎入胃則亦入脾入腎則亦入心本經所以主五臟腸胃中結熱也性寒已熱燥則除濕故本經所列黃疸腸痔泄痢女子漏下赤白陰傷蝕瘡皆屬濕熱之疴別録又補出驚氣在皮間肌膚熱赤起目熱赤痛口瘡則所謂五臟腸胃者悉備矣大抵濕下溜而火上出別録所主雖不屬濕而其因未始非濕觀仲聖梔子柏皮湯大黃硝石湯治黃疸為陽明病白頭翁湯治熱痢烏梅丸治嘔吐久痢為陽明兼厥陰病外臺大黃湯更治天行壯熱黃柏一味實賅五臟腸胃故其用頗廣若以治少陰與萸地知母為伍則腎中不必有濕否則如其分以施之必得如二妙散為當蓋苦燥之物無不劫陰以黃柏為滋陰之劑者非也厚朴厚朴苦溫散濕滿其氣向表枳實苦寒泄堅滿其氣向下二物皆胃家氣藥陽明病胃中燥結在血分自宜以滌熱逐實之大黃血藥為君然非氣藥為之前驅則不能鋭師直入此三物並用之故大承氣又加芒硝者芒硝亦血藥而微兼治上猶厚朴氣藥而微兼治表餘邪不至少留而鹹寒尤能速下不止如小承氣之和胃已也枳朴主治多在中焦故為承氣要藥然枳實薤白桂枝湯枳朴並用其證為胸痹與脅下逆搶心則又何說蓋二物雖有溫散寒泄之不同而皆苦中有辛苦多辛少惟其為氣藥而兼辛故心肺之部亦其所到苦多則不能久停心肺而可倚以散逆下氣枳實又為脅痛要藥與厚朴先煮多煮所以平胸脅之逆滿內薤白等數沸所以開心胸之陽痹分之各盡厥職合之則同建奇勳方名出枳實不出厚朴者以脅逆非厚朴所主也夫厚朴非所云氣向表者歟雖非表藥而表證亦兼有可資如厚朴麻黃湯治咳而脈浮以厚朴能隨麻黃輩外散寒邪偕姜夏輩內消寒飲方名以是冠首固無愧爾然則半夏厚朴湯治婦人咽中如有炙臠非胸滿非腹滿亦無表邪又何以用厚朴哉夫咽中者心肺之部千金此證又點出胸滿心下堅五字非心胸間有濕痰凝阻不至如是半夏苓姜有蠲飲之能擅瀉心之用佐以蘇葉之宣氣理血心胸間可由是曠然矣不知千金謂咽中帖帖吐之不出吞之不下其竊據之勢豈易遽拔夫厚朴者消痰下氣力厚氣雄於四物外別樹一幟蓋四物以功勝而厚朴以力勝合以成劑奏效乃神此厚朴所以匹半夏而並標之歟杜仲本經杜仲主腰脊痛脊有誤作膝者注家即以腰膝釋之不知杜仲辛甘色黑皮內有白絲纏聯為肝腎氣藥非血藥其溫補肝腎之功實在腰脊性溫化濕而甘能守中不特腰脊痛可止即陰下癢濕小便餘瀝何不可已別録謂腳中痠疼不欲踐地不俗之故自在腰脊與不能有異總當以主腰脊痛為用是物之主腦即後世治頻慣墮胎亦豈為腳膝事哉楝實楝實苦入心酸入肝寒入腎為心肝腎三經之藥苦寒清熱下行而酸復迫之故導上中之熱由小便水道而出其勢甚捷本經主溫疾傷寒大熱煩狂溫疾傷寒即溫病大熱而至煩狂是熱無所泄緩則生變故以此亟泄其熱非謂溫病可全恃楝實也心痛腹痛之為熱痛者用之靡不奏效即牙宣出血不止以楝實末裹塞齒齦即止其導熱下行之速真有可立待者矣疝有熱有寒史記太倉公治疝用火齊湯熱疝也金匱治疝用大烏頭煎寒疝也楝實為治疝要藥則於寒鬱熱者為宜蓋肝腎內寓真陽陰錮之而陽不得達則寒亦釀熱楝實酸苦能入而湧泄之即劉氏所謂導氣達陽也病本屬寒不能捨巴豆故紙等藥而獨建其功用楝實治疝者須識此義昔人治遺精如固陽丸鹿茸益精丸既濟固真丹治真陽上越氣喘痰鳴如黑錫丹皆其中有楝實皆用楝實為從治然其證陰中有陽溫其陰不得不退其陽雖從治亦正治也皂莢皂莢子陽在上不與陰化而為風陰遂變為痰涎皂莢以金勝木通氣利竅風無不搜斯濕無不去故凡痰涎湧塞而為中風為喉痹者胥倚以奏功陽在下不與陰化而為風陰遂被劫而生燥皂莢氣浮而子較沉故子能祛在下之風風去則陰得伸其津潤之權而大腸之燥結以通凡風藥必燥而皂莢以多脂為佳皂子之仁又黏而韌其能利大便亦兼得辛潤之力也訶黎勒訶黎勒苦溫能開酸澀能收開則化痰涎消脹滿下宿食發音聲收則止喘息已瀉痢然苦多酸少雖澀腸而終泄氣古方用是物皆極有斟酌仲聖訶黎勒散治氣利氣利者氣與矢俱失也必有痰涎阻於腸中訶黎勒既澀腸而又化痰涎最於是證相得又以粥飲和服安其中氣是訶黎勒之泄亦有功無過矣千金訶黎勒丸治氣滿閉塞不能食喘息不能食喘息由於氣滿閉塞氣滿閉塞非有痰涎宿食不爾然去其痰涎宿食而既逆在上之氣豈能即返訶黎勒能一物而兩治之兩治之物無沖和之性蜜丸又所以和之也與仲聖用訶黎勒之意正復無異若訶子清音湯治中風不語是但用其泄矣協以甘桔則不至過泄而音可開真人養臟湯治久痢脫肛是但用其澀矣協以參朮歸芍諸藥則不至徒澀而痢可止肛可收凡此皆用藥之權衡不可不知者也桑根白皮桑根白皮甘辛入脾肺而氣寒復入膀胱能驅脾肺中之水氣從小便出故水腫腹滿臚脹胥治之咳嗽惟肺有水氣及伏火者宜之肺虛無火因風寒而嗽者服之則錮閉邪氣而成久嗽此仲聖於王不留行散所以謂風寒勿取也楮實本經與陶隱居抱朴子皆甚言楮實之功而方書用於補劑者楊氏還少丹外不多見大抵以其物賤而修真祕旨又言久服成骨軟與濟生祕覽治骨哽遂不復重諸家亦未有發明其所以然者竊思補益與軟骨並不相背特其義殊奧耳種楮必雜以麻冬則賴麻作暖春又燒麻以肥楮三年即成大樹而枝葉皆有白汁皮可為紙可為布實則色深紅而煎之如飴夫是故具陰體而得陽用為手足少陰之藥遇腎陰不足而陽常畜縮者用之以充腎液伸腎權最為切合若腎中陽虛而陰有餘陰虛而陽易升與陰陽並虛之證皆非所宜此本經主陰痿之旨也夫補陰而又能伸陽者其所補之陰未始不隨陽以俱伸與純陰填補有別水腫者陰不與陽化而水聚也肌膚不充者陽不得陰濟而氣乏也目不明者陰不升而陽無光也本經所臚楮實皆足以任之然則其能軟骨何故骨屬腎甘能損腎腎傷於濕者腰腳為之痠軟濕亦陰也楮實甘寒益陰而不能益陽久服骨何能不軟此審證製劑之不善於楮實夫何尤識此義而用於喉痹骨哽則正見其功至吳廷紹治烈祖食飴而噎以楮實具陰體而得陽用足釋少陰壅蔽之氣又以甘導甘宜其效矣惟大明謂壯筋骨則似是實非不免於誤人爾枳實別録枳實破結實消脹滿是其滿為堅滿破結實即下宿食之謂似不如厚朴之散濕滿兼可治上矣然枳實氣藥而味苦酸胸脅之堅滿亦其所司故別録於胸脅曰除痰癖不曰除痰飲水者柔物亦動物然水至於停則與腸胃之水穀相比為奸而非可以滲之利之者故別録於除胸脅痰癖下又繼之以逐停水而不隸於胸脅蓋即堅滿之在腸胃有需於枳實者矣大小承氣湯與枳實薤白桂枝湯用枳實之義已詳厚朴不贅更以別録心下急痞痛逆氣脅風痛繹之夫瀉心諸湯治心痞大小陷胸治結胸枳實宜可用矣而皆不掄入曷故蓋痞為虛邪宜輕散不宜實攻結胸雖屬實邪而滌熱泄水別有專藥小陷胸則與瀉心不殊但以連夏瀉心加栝蔞降痰濁而已得皆無俟枳實代籌枳實所司維何曰胸痹與結胸皆按之而痛其所以異者一則為熱結而一則為陽微也雖然枳實不氣向下乎氣向下則胸膈非停駐之所非寒藥乎寒藥則於陽微有妨不知仲聖有因材而使之妙焉橘枳生薑湯以橘姜化氣於上枳實從而泄之桂枝生薑枳實湯以桂姜化氣於上枳實從而泄之要非氣塞與懸痛有堅滿可泄亦不用枳實方名不以冠首者以枳實為佐理也大柴胡湯柴胡芩夏能治胸滿不能治心中痞硬心下滿痛得枳實則痛硬除以枳實能泄堅滿也按全方為表裡兼治之劑大黃枳實芍藥所以攻裡柴胡芩夏薑棗所以解表生薑加多又使與枳實化心中之痞硬即橘枳生薑湯治胸痹之法是枳實於諸藥皆與有功而方名顧不之及者何也抑知其往來寒熱之為少陽病乎柴胡乃少陽主藥且能去腸胃中結氣自當推以冠軍曰大者以非小柴胡之常法也枳朮湯以白朮消水飲枳實泄心下堅大枳實氣向下而以味甘而厚之白朮載之使不速下既回翔於心遂漸及於腹至腹耎而收功此以枳實治心下之又一法也別録所言殆亦由仲聖諸方紬繹而得之者歟枳殼枳殼乃枳實之老而殼薄者既名枳殼須去穰核用之殼實古原不分性用亦無所異若治胸膈痞塞枳殼較枳實少勝然何如以枳實協辛溫輕揚之橘皮桂枝為奏功尤大乎惟本經主大風在皮膚中如麻豆苦癢除寒熱結則惟去穰核之枳殼為宜蓋癢為風寒熱結為痹於皮膚中除風除痹用枳實則易走里難與枳殼爭能此證類本草枳殼所以主風癢麻痹也梔子梔子花白蕊黃仁赤其樹最喜灌溉意在條達其性體為心肺肝胃三臟一腑之藥惟花時不採而採者為黃赤之實體輕入氣而性陰又入血其治在心肝胃者多在肺者少苦寒滌熱而所滌為瘀郁之熱非浮散之熱亦非堅結之熱能解鬱不能攻堅亦不能平逆故陽明之腹滿有燥屎肺病之表熱咳逆皆非其所司獨取其秉肅降之氣以敷條達之用善治心煩與黃疸耳心煩或懊憹或結痛黃疸或寒熱不食或腹滿便赤皆郁也心煩心下濡者為虛胸中窒者為實實與虛皆汗吐下後餘邪留踞皆宜吐去其邪梔子解鬱而性終下行何以能吐協以香豉則一升一降邪不任受則吐黃疸之瘀熱在表其本在胃梔子入胃滌熱下行更以走表利便之茵陳輔之則瘀消熱解而疸以愈然則梔子於肺無與乎仲聖云凡用梔子湯病人舊微溏者不可與服之肺與大腸相表裡服梔子則益其大腸之寒此可為秉金氣之一證至治肝則古方不可勝舉總不離乎解鬱火凡肝鬱則火生膽火外揚肝火內伏梔子解鬱火故不治膽而治肝古方如瀉青丸涼肝湯越鞠丸加味逍遙散之用梔子皆是涼膈散有梔子以治心也瀉黃散有梔子以治胃也而瀉白散不遴入則以肺中氣熱而不涉血者梔子不與也本經主胃中熱氣朱丹溪謂最清胃脘之血究梔子之治氣血皆有而血分為多然不能逐瘀血與丹皮桃仁分功其解血中之鬱熱只在上中焦而不在下焦亦不入足太陽與手足少陽不入足太陽故不利小便茵陳蒿湯所以必先煮茵陳許學士之治酒皶鼻朱丹溪之治熱厥心痛集簡方之敷折傷腫痛皆屬血中鬱熱其餘之治悉可類推酸棗仁酸棗叢生而氣薄氣薄則發泄味酸亦泄啖之使陽不得入於陰故醒睡仁則甘平甘平由酸而來性故微斂而微守酸棗肝藥仁不能大戾乎棗亦必入肝皮赤則入心內黃則入脾酸棗仁自當為心肝脾三經之藥心得之則神安肝得之則魂藏脾得之則思靖其治不得眠尚有何疑獨是酸棗仁湯治虛勞虛煩不得眠則更有進焉按梔子豉湯證亦為虛煩不得眠而彼為有傷寒餘邪此由於虛勞故加虛勞字以別之勞之為病其脈浮大手足煩陰寒精自出酸削不能行此云虛煩不得眠脈必浮而微數蓋陽上淫而不下則煩陰下虧而不上則不得眠其責在腎非酸棗仁收攝浮陽不能使心肝脾咸循其職故推酸棗仁為君而臣以知母滋腎之液茯苓泄腎之邪擾心之煩可不作矣而心腎不交猶未足以成寐後世醫者必將以遠志配棗仁為一降一升之法不知遠志乃陰中升陽之藥此非陽不升而實陰不升既以棗仁攝之知母滋之茯苓泄之陰中之陰自有能升之理特三物皆下行而腎陰向上之機不能無滯故又加芎藭通陰陽以利之甘草居中宮以和之標之曰酸棗仁湯者以酸棗仁為首功也山茱萸今人用山茱萸惟取其強陰益精原非不是但其木高丈餘二月開花一交冬令即便結實是全稟厥陰木氣而實酸溫足以溫肝祛風宣竅故又治鼻塞耳聾目黃面皰至主心下邪氣寒熱與出汗之文或疑其無是能矣不知其色紫赤兼入心包且秉風木疏蕩之姿汗為心液焉得不溱溱以出汗汗出則寒熱之邪亦去凡此又當於補益之外詳究其義者然則腎氣丸用之蓋不第強陰益精之謂已女貞實本經女貞主治張石頑謂咸指枸骨諸家誤列於此觀鄒氏之疏則知張氏實誤矣女貞當春夏秋生長之會被蠟蟲蝕肌吮血身無完膚仍不廢開花結實而其所成之蠟非他膏脂可及是故中之所以補五臟之所以安精神之所以養百疾之所以除皆人於熱氣耗敗之餘之大效非本經無端加以隆譽然則用女貞者當知苦平非溫補之品而功與溫補埒者其故自有在矣衛矛衛矛以甄權破陳血落胎與日華子通月經破癥結兩說按之自屬善敗惡血故和劑局方用以治産後敗血但其三面如箭羽古惟燔之以遣祟方藥少用則用之於除邪殺鬼乃為合宜考千金外臺諸方療惡疰心痛卒暴心痛忽中惡氣毒痛鬼瘧日發及務成子螢火丸非善取其長者歟五加皮五加皮莖柔皮脆用在於根宜下焦風濕之緩證若風濕搏於肌表則非其所司古方多浸酒釀酒及酒調末服之以行藥勢心疝少腹有形為寒肺熱生痿躄為熱本經並主之劉潛江云腎肝氣虛故病於濕濕者陰之淫氣也陰淫則陽不化而為風風者陽之淫氣也陽淫則陰愈不化而更病於濕至病濕固已陰錮陽陽蝕陰而成濕熱矣按此論甚精五加皮辛苦而溫惟善化濕耳化其陰淫之濕即驅其陽淫之風風去則熱已濕去則寒除即別録之療囊濕陰癢小便餘瀝腰腳痛痹風弱五緩皆可以是揆之鄒氏以本經之益氣別録之堅筋骨強志意為身半以上事實則腎肝受治之益不必析之為兩事也枸杞本經別録枸杞不分子皮苗葉而就其文體會之本經之五內邪氣熱中消渴周痹風濕別録之下胸脅氣客熱頭痛是枸杞皮與苗葉之治本經之久服堅筋骨耐寒暑別録之補內傷大勞噓吸強陰利大小腸是枸杞子之治此沈芊緑之言分別頗當按陶隱居本經序於地骨皮下列熱中消渴字千金治虛勞客熱虛勞苦渴皆用地骨皮地為陰骨為里皮為表氣味甘淡而寒故所治為肺肝腎三臟虛熱之疴臟陰虧則熱中消渴胸脅氣逆頭為之痛周痹乃風寒濕客於分肉之間今曰周痹風濕必周痹由寒變熱之候靈樞所謂神歸之則熱者也千金而外後人又以地骨皮退內潮外潮治骨蒸骨槽風吐血下血目赤口糜小兒耳疳下疳等證然系益陰以除熱有安內之功無攘外之力雖表裡兼治而風寒之表熱非所能解也枸杞子內外純丹飽含津液子本入腎此復似腎中水火兼具之象味厚而甘故能陰陽並補氣液驟增而寒暑不畏且腎氣實則陰自強筋骨自堅噓吸之一出一入自適於平液枯之體大小腸必燥得之則利惟多用須防其滑而純丹又能增火也後世之方如金髓煎四神丸枸杞酒可謂竭枸杞之才矣竊意本經之主周痹風濕耐寒暑非皮與子同用之不能有此效俟明者政之蔓荊實蔓荊實別録主風頭痛腦鳴用者往往鮮效蓋人知蔓荊為辛寒之藥而不知其苦溫乃過於辛寒也本經味苦微寒微字本有斟酌別録補出辛平溫則全體具見便當於此切究其義巢氏病源云頭面風者是體虛陽經脈為風所乘也諸陽經脈上走於頭面運動勞役陽氣發泄腠理開而受風謂之首風夫曰體虛曰陽氣發泄明系陽虛之受風非內熱之搏風陽虛之證其標在上其本在下然或宜治標或宜治本因雖一而證則殊宜治本者陽氣弱而不振根柢將摧宜治標者陽氣弛而偶傾輕翳竊據治本雖天雄可與治標則蔓荊適宜試思頭痛非陽虛有風何至腦鳴風為陽陽虛腦鳴為陰蔓荊生於水濱實色黑斑宜其入腎然氣味辛寒而兼苦溫又得太陽本寒標熱之氣化用能由陰達陽以陽化陰其體輕虛上行雖本經所謂筋骨間寒熱濕痹拘攣者亦能化濕以通痹而搜逐之任性終不耐故古方用之者少惟風頭痛腦鳴則確有專長其不效者人自不察耳愚又思蔓荊知己之少不自今始也徐之才謂散陽明風熱竟視與薄荷牛蒡無二張潔古謂陽中之陰實則陰中之陽謂涼諸經之血實則氣藥非血藥其尚有知者則李瀕湖之主頭面風虛張石頑之血虛有火禁用而其所以然仍未之闡發也藥物之難明甚矣哉茯苓茯苓結於土中久而不變宜其得陰氣多與豬苓埒矣然楓擅召雨之能松挺不雕之概一毗於陰一毗於陽毗於陽者能耗陰不能起陰不能起陰即不能止渴故五苓散治汗出而渴不渴則主以茯苓甘草湯栝蔞瞿麥湯治渴有茯苓不能無栝蔞小柴胡湯渴加人參小青龍湯渴加栝蔞皆獨不加茯苓此可徵茯苓之非渴藥能起陰以止渴者莫如葛根栝蔞以葛根栝蔞起陰而不利小便也起陰而兼利小便則止渴之力必減故豬苓澤瀉次之茯苓又次之然五苓散豬苓湯偏以之治渴更非葛根栝蔞所能代者何哉蓋其渴非他脈浮發熱飲水而小便不利耳不去其病起陰奚濟茯苓與豬苓澤瀉泄水則小便利茯苓豬苓與桂枝滑石達表則表邪解去其蔽陰灼陰而陰自升陰自升者渴亦止此茯苓之於渴所以得廁名其間也雖然其中又甚有故不得不辨者焉二苓澤瀉之治渴是治飲水而小便不利之渴以其水為渟瀦之水不受胃變則嘔格其腎陰則渴故得以泄水利小便而愈若是痰飲胃亦賴之以養其濃厚者且無走小便之理將毋水能致渴飲不能致渴耶而仲聖謂嘔家本渴反不渴者心下有支飲又謂胸中有留飲其人短氣而渴二說相反曷故夫飲而曰支謂其如支流不正出也不正出則腎陰猶得以上潮故不渴留飲是正留於胸中氣焉得不短而渴焉得不作是則痰與飲宜分者也水與飲有分有不分者也以渴不渴定茯苓與豬澤之去取可矣抑又思之仲聖用此三物之證多渴與嘔兼豈非治渴而亦治嘔不知嘔吐之專藥為半夏生薑猶葛根栝蔞為消渴之專藥仲聖之以茯甘五味姜辛湯治咳滿也曰嘔者復納半夏既有茯苓又納半夏以茯苓不治嘔也不納豬澤不治嘔也乃嘔吐篇之豬苓散明明治嘔吐思水茯苓澤瀉湯明明治胃反吐而渴欲飲水今必曰不治嘔其誰信之然必曰治嘔與小半夏湯等此何以多思水飲水之證獨是泄水以止渴者其義易曉泄水以止嘔則嘔已自去其水何待藥為是則仲聖之言為甚可味也豬苓散思水者三字是對上後思水而言此思水為先思水先思水而後嘔吐所謂先渴卻嘔者為水停心下也水停心下者愈渴亦愈飲嘔不能有裨故其用二苓也所以泄水用白朮也所以生津茯苓澤瀉湯特提胃反吐三字胃反者胃虛且寒不至有渴今渴欲飲水是陰中有陽之證故於吐下加一而字以折醒之與他胃反不同與他嘔吐亦不同薑桂甘術所以溫胃而止吐茯苓澤瀉所以泄水而止渴證既兼見藥亦分理有生薑無半夏者渴忌半夏也無豬苓者無表證者也泄水而兼能止渴者以澤瀉為優故入澤瀉至茯苓協澤瀉泄水協生薑平逆協桂枝化氣協甘草白朮補中為益良多故以標方名冠首以茯苓與豬澤較雖同不治嘔而以茯苓為猶有參贊之功何則甘先入脾淡主養胃茯苓甘淡非豬澤可比是其於嘔也不用剿而用撫者也外此茯苓以泄水奏績者又於仲聖方得三事焉曰眩曰悸曰咳必別其近似而真始出則與嘔渴無二也眩有肺痿上虛而眩失精下損而眩谷疸因食而眩茯苓詎可漫施心下有支飲其人苦冒眩茯苓宜可用矣不知澤瀉湯無渴而用澤瀉以其於冒眩有專長也且使輔以茯苓則澤瀉方欲至極上治冒而茯苓偏從而抑之全功必墮白朮則蠲飲而守中足為澤瀉策應故寧退茯苓而進白朮然則冒與非冒何別乎蓋冒者上之陽為水飲所格而不得入於陰則淫於上如覆冒是眩在陽盛以澤瀉泄其水而濟以陰眩乃得息若水飲上凌而上之陽不能與陰爭則陰與水相比為患而眩亦生是眩在陰盛惟茯苓稟陽和之性擅化氣之長水遇之而自卻陽得之而即伸仲聖似此治眩之方不一可不煩枚舉水停心下而眩者亦水停心下而悸眩在外悸在內惟派別而源同故眩定者悸亦定心下悸者水侵其心臍下悸者水發自腎似不能悉主以茯苓矣然上中下之水應皆從小便出者舍茯苓其奚屬且始而臍下悸者後必心下亦悸所謂水在腎心下悸也其悸非茯苓得治者如小建中湯桂枝甘草湯炙甘草湯非溫養中氣補益心陽不可茯苓淡滲適傷其正故擯之也咳之因亦致多矣茯苓所司為痰飲之咳然有痰飲而不宜者半夏麻黃湯有痰飲而悸以麻黃髮心陽而泄之於表徐忠可謂之老痰老痰非滲得去甘遂半夏湯有留飲而利以甘遂甘草加白芍就其利而下之必欲使走小便則謬此外有痰飲而宜辛散宜苦降者無論矣夫咳者肺病茯苓下滲則肺邪不解故咳證用之頗鮮惟咳而沖氣挾痰飲而上胸滿由痰飲而得者以茯苓下之泄之厥效甚捷然則茯苓非能治咳治痰飲耳非能治痰實治飲耳苓桂朮甘湯治痰飲如神而其推茯苓為君也在使微飲從小便去也痰飲之有需於茯苓可知矣抑其治飲治水能使上中下統泄之於小便者有故茯苓甘淡為胃之正藥色白而純則兼入肺肺主皮毛而太陽為之應故又入太陽淡滲則又從皮毛而入太陽之府肺胃職司下降膀胱氣化則出其利小便蓋有高屋建瓴之勢焉仲聖於小便不利而必曰加茯苓者職是故也夫利小便者仲聖之明文實本經之遺訓斷不必以止消渴滋學者之惑顧謂利小便足盡其長乎而不然也試更即仲聖方核之腎氣丸主小便不利並消渴小便反多蓋小便不利者腎中陰氣之壅也以茯苓與桂附消其陰則由壅得通小便反多者腎中陽氣之弱也以茯苓與桂附扶其陽則轉弱為強且用以祛表濕如防己茯苓湯用以解咽窒如半夏厚朴湯用以開胸痹如茯苓杏仁甘草湯用以下症痼如桂枝茯苓丸用於補劑如薯蕷丸用於風劑如侯氏黑散蓋惟茯苓以甘淡之味溫和之性能於氣中消水水中化氣隨他物而膺繁劇者胥不出乎此旨若非製劑得宜則茯苓之真不見而亦未必無害矣豬苓本經豬苓利水道不云止消渴而仲聖以豬苓名方者必渴而後與之惡得無故鄒氏謂豬苓起陰氣以和陽化水譬之楓葉已丹遂能即落雖本經別録無起陰之文然考爾雅正義述異記一統志南方草木狀物類相感志荀伯子臨川記所載楓樹諸靈異確與陰氣相感豬苓生楓樹下其皮至黑氣味俱薄未必不能起陰況水道既利三焦得通腎氣之由三焦而上者自亦滋溉於其胸釋名消渴者腎氣不周於胸也消渴奚能不止此與澤瀉之止消渴有相侔之處然有不如澤瀉者焉澤瀉形圓一莖直上能起極下之陰以濟極上之陽平極上之陽淫豬苓甘淡不能直上至頭故澤瀉湯治冒眩而豬苓不與然豬苓之陰陰中有陽能開腠理達表與茯苓為伯仲而澤瀉亦不與五苓散豬苓湯所以治脈浮發熱者以其有豬苓茯苓也夫以豬苓視茯苓所同者為太陽陽明藥耳豬苓究何足與茯苓比烈茯苓結於土中豬苓亦結於土中茯苓肉白豬苓亦肉白茯苓甘淡豬苓亦甘淡而茯苓之白光潔而純豬苓之白幽暗而獷茯苓甘淡得土味之正豬苓甘淡得土味之偏此茯苓所以主治廣豬苓所以主治狹也竹茹竹青而中空與膽為清淨之府無出無入相似竹茹甘而微寒又與膽喜溫和相宜故黃芩為少陽經熱之藥竹茹為少陽腑熱之藥古方療膽熱多用竹茹而後人無知其為膽藥者噦逆之因不一胃虛而膽熱乘之亦作噦逆橘皮竹茹湯以參棗甘草補胃養陰橘皮生薑和胃散逆竹茹除膽火則為清噦之源橘皮湯無竹茹者以手足厥為肝逆也婦人乳子之時中虛膽熱膽熱必犯其胃嘔逆而至煩亂熱亦甚矣竹皮大丸以石膏白薇除胃熱而斂浮陽竹茹涼膽而清其源恐中虛難任寒藥故加桂枝之辛甘以導之藥兼陰陽故加甘草以和之喘則以柏實輯肝氣又所以輔竹茹之不逮也蜂蜜蜂蜜生性涼能清熱熟性溫能補中甘而和故解毒甘而滑故潤燥甘緩可以去急故止心腹肌肉瘡瘍諸痛甘潤可以泄澤養正故通三焦除衆病和百藥仲聖以蜜煎導通大便蜜當為下利之所忌矣然下利有用之者一為豬膚湯少陰伏邪內發陰下泄而陽上乘致下利咽痛胸滿心煩液傷而脾亦困矣以豬膚從陽引陰而平邪熱陽不至上乘矣白粉扶脾而止利陰不至下泄矣白蜜則佐豬膚潤液助白粉安中故加之一為甘遂半夏湯脈伏者有留飲在內欲自利利反快者利不即利即利則快心下續堅滿者利後滿減過時又續是為飲在上而腸則燥致飲欲去不去幾與滯下無異故以半夏白芍消飲於上而降之甘遂甘草借其相反之勢以激之白蜜是潤液化燥以速其去猶滯下之用阿膠此二方用蜜之意也白殭蠶蠶者食桑之蟲桑能去風蠶性故近之且感風而僵更於感風之病為宜味辛氣溫而性燥故治濕勝之風痰而不治燥熱之風痰朱丹溪謂從治相火散濁逆結滯之痰者正合汪訒庵刪去從治字而以為散相火逆結之痰則其視殭蠶為何如藥矣小兒驚癇夜啼是肝熱生風又為痰濕所痼而陽不得伸是以入夜彌甚殭蠶劫痰濕而散肝風故主之至男子陰瘍女子崩中赤白産後余痛無非厥陰之風濕為患無他奧義鄒氏謂蠶食桑而有津液留於中又解之為釋泥淖塞漏卮不特於殭蠶燥濕去風之義背據其所言亦不免自相矛盾水蛭水蛭虻蟲同為吮血之品能逐瘀破結而仲聖抵當湯抵當丸必二味並用桃核承氣湯下瘀血湯又二味並不用其所以然之故有可得而言焉成氏云咸勝血血蓄於下勝血者必以咸為主故以水蛭為君苦走血血結不行破血者必以苦為助故以虻蟲為臣張隱菴張令韶云虻蟲水蛭一飛一潛在上之熱隨經而入飛者抵之在下之血為熱所瘀潛者當之按此論水蛭虻蟲精矣而抵當湯所佐之大黃桃仁亦非泛而不切蓋四物皆血藥而桃為肺果桃仁氣微向表協虻蟲為走表逐瘀大黃滌熱下行協水蛭為走里破結而同歸於抵少腹下血抵當丸之證與抵當湯盡同惟少腹滿則尚不至於硬矣小便本不利而今反利則蓄血必暫而未久矣用湯方減少其數又搗丸煮服者以隨經之熱留於表分者多用峻藥輕取之法使熱邪盡入網羅而瘀不復聚正不少傷也若桃核承氣湯證則與抵當懸絶矣太陽病不解至下者愈為一截言蓄血而血自下者不必攻也血自下者亦自愈也其外不解者至當先解外為一截言血不自下則宜攻然太陽傳本有表邪未罷者當先解其外未可以下有蓄血而遂攻之也外解已至宜桃核承氣湯為一截外解曰已少腹急結曰但可見表證已無不必顧表少腹急結而非硬滿其人亦不如狂洄溪所謂瘀血將結之時也桃核承氣湯即調胃承氣湯加桃仁桂枝加桃仁桂枝而仍名承氣明示此證之有關於陽明蓋太陽病汗解之後原有陽明腑實之慮今不腑實而少腹急結未始非腸胃之熱下迫膀胱以桃仁協調胃承氣則下逐膀胱之血瘀亦上清陽明之熱迫加桂枝者膀胱寒水之腑熱結初萌驟以黃硝折之氣必先郁故以桂枝化膀胱之氣且桂枝協甘草能散結緩急又為少腹急結之要藥觀桂枝茯苓丸之下症溫經湯之瘀血在少腹不去土瓜根散之少腹滿痛皆用桂枝即可知此之非為解表矣彼用桂枝斂以芍藥此用桂枝引以黃硝桂枝所以能抵少腹也下瘀血湯瘀血在臍下不在少腹不曰蓄而曰著是其血瘀未久腹痛亦新著之故況在産後豈宜峻攻既服枳實芍藥散而不愈其為血被熱灼而不行無疑矣治以大黃桃仁滌熱逐瘀䗪蟲導血通絡蜜丸和藥而不傷液酒煮行藥而不疾下合之則共成臍下去著之功此與抵當湯丸之用虻蛭顧可以同年語乎桃核承氣湯之治愚既辨之詳矣惟此條熱結膀胱四字前人多看作太陽傳本之公共語謂熱邪隨經入於膀胱有水結有血結五苓散所以治水結桃核承氣湯抵當湯丸所以治血結不知熱結膀胱但有血結並無水結蓋膀胱為津液之腑氣化則能出故小便不利是氣病非血病按巢氏病源淋病至於熱甚則變尿血何嘗非膀胱之熱由氣入血而外臺治血淋諸方無用桃仁虻蛭者以尿血而非蓄血也血不蓄則熱可謂之盛不可謂之結且五苓散之不治膀胱熱結固顯有可證者觀仲聖用五苓散諸證不曰脈浮微熱則曰水逆須末服而又多飲暖水出汗是欲使邪從表解若熱結膀胱何能逆挽而出其所以渴與小便不利者太陽之標為寒邪所迫熱將傳本遂與少陰水臟均不得施化即三焦之水道亦滯而不鬯於是上不濟以腎陰而渴下則水欲泄而不利服五苓散而諸弊俱祛以熱不在膀胱也且五苓之利小便烏得與滑石亂髮白魚戎鹽瞿麥之屬等量齊觀為問桂枝利小便乎而桂枝非四兩不利小便今只半兩桂枝茯苓合而利小便乎而防己茯苓湯桂苓並用則治水氣在皮膚桂枝茯苓澤瀉合而利小便乎而茯苓澤瀉湯桂苓澤瀉並用則治胃反吐茯苓豬苓白朮合而利小便乎而豬苓散二苓白朮並用則治思水嘔吐白朮澤瀉合而利小便乎而澤瀉湯術瀉並用則治支飲苦冒眩善夫柯氏之論五苓散也曰重在脈浮微熱不重在小便不利真得仲聖立方之旨矣蠐螬蠐螬生於糞壤糞壤猶人身之惡血逮其變蟬則吸風飲露最為清潔猶人身之目不容纖塵故其破瘀血則蠐螬之出於糞壤也主目中淫膚青翳白膜則蠐之變蟬化穢濁為清潔也仲景䗪蟲丸正以其兩目黯黑而用之然虛勞而非有血瘀者不宜龍骨龍骨非無真者特不易得耳藥肆所售乃龍蟄土中至春啓蟄上騰其所伏處土遂黏埴似石而形似龍故其用與真龍為近龍為東方之神而骨黏舌其用在心肝二經為多能收斂浮越之正氣安魂魄鎮驚癇至主心腹鬼疰精魅則以神物能辟邪惡也治泄精瀉利漏下則以味甘歸土澀可去脫也徐氏謂龍骨斂正氣而不斂邪氣故傷寒邪氣未盡者亦用之鄒氏謂龍骨牡蠣推挽空靈之陰陽與他發斂著物之陰陽者異故桂枝柴胡兩湯可以會合成劑龍骨攝陽以歸土牡蠣據陰以召陽二說皆極精龍齒龍骨以白者為上齒以蒼者為優生則微黑煅之則如翡翠色可愛較白者功用更捷許叔微云肝臟魂能變化故遊魂不定者治之以龍齒古方如遠志丸龍齒清魂散平補鎮心丸皆收攝肝氣之劑也鯪鯉甲即穿山甲穿山甲主五邪驚啼悲傷其可驚啼之邪無論五臟何邪自屬非分之來難以驟當而後發為驚啼由驚啼而悲傷邪則乘肺虛而並之此時通氣道之留阻而先解其邪斯則穿山甲所克任者若調其偏駁安其神志則更有他藥宜酌劑以善其後也後人用穿山甲多見於瘡瘧兩門蓋瘧必有風痰濕濁痹其經絡瘡則肌腠壅滯非性鋭善穿之物不能疏排而發之若瘧涉於虛瘡至潰後則非其所能為矣烏賊魚骨烏賊魚由寒烏入水而化其骨白骨為腎之合而色白則屬肺是為攝氣入血故能化血中之氣肉腴潤而骨獨燥又能燥血中之濕血閉癥瘕驚氣入腹腹痛環臍者血為氣鬱也漏下赤白陰蝕腫痛瘡多膿汁者血為濕亂也治以烏賊魚骨如磁石之引針琥珀之拾芥矣再以驚氣入腹之旨繹之驚則氣亂入腹則氣下趨而靡所止烏賊魚能於水中下碇黏石又何患驚氣之不止哉龜甲水族離水則僵陸蟲沒水輒斃惟龜常湛於水固生終令居陸亦生所以能治水火相齧之病輕狡者遲重則殆遲重者不能輕狡惟龜腹背自遲重首尾四肢自輕狡所以能治中外不相應之病衷甲者以其堅為蔽以其裹為衛惟龜雖有甲而縱橫成理片片可㙭雖可㙭而上下緊裹無少罅隙所以能治當開不開當闔不闔並開闔參爭之病漏下赤白小兒囟不合非不闔乎癥瘕非不開乎瘧非開闔之參爭乎五痔陰蝕小兒頭瘡難燥非水火之相齧乎濕痹四肢重弱非中外之不相應乎蓋人之一身無不以水火為樞機水與火相違則氣張而體不隨之張氣翕而體不隨之翕此能助之張助之翕火無水養者此能滋其水水為火格者此能熄其火以至水停幽隱而火之途徑難通火善萌動而水之滋溉不及均藉此以增損維繫之此鄒氏之論自來注家無此精當為略更數字而存之龜甲所治之水非流動之水所治之火非披猖之火鄒氏所論之水火正須善會張氏云龜甲能引陽氣下歸復通陰氣上行可與鄒說並參惟陰陽以理言水火以證言耳凡人靜則明生龜居四靈之一而靜鎮不擾故能收攝囂浮而靈明自浚諸家謂為滋原非不是要不如別録資智二字品題之妙鱉甲牡蠣鱉甲牡蠣之用其顯然有異者自不致混於所施惟其清熱耎堅人每視為一例漫無區分不知此正當明辨而不容忽者甲介屬金金主攻利氣味鹹寒則入陰此二物之所同清熱耎堅之所以並擅而其理各具其用亦因而分鱉有雌無雄其甲四圍有肉裙以肉裹甲是為柔中有剛陰中有陽蠣有雄無雌磈礧相連如房房內有肉是為剛中有柔陽中有陰鱉介屬而卵生色青則入肝而氣沉向里蠣介屬而化生色白且南生東向得春木之氣則入肝而氣浮向外向里則下連腎向外則上連膽本經於鱉甲主心腹癥瘕堅積於牡蠣主驚恚怒氣拘緩仲聖用鱉甲於鱉甲煎丸所以破癥瘕加牡蠣於小柴胡湯所以除脅滿所謂向里連腎向外連膽者正即此可推其耎堅不能無銛鈍之差清熱亦大有深淺之別也由斯以觀凡鱉甲之主陰蝕痔核骨蒸者豈能代以牡蠣牡蠣之主盜汗消渴瘰癧頸核者豈能代以鱉甲鱉甲去惡肉而亦斂潰癰者以陰既益而陽遂和也牡蠣治驚恚而又止遺泄者以陽既戢而陰即固也文蛤考仲聖文蛤散文蛤湯渴不用栝蔞之屬有表邪不用桂枝之屬而獨用文蛤幾莫明其故逮即所治之三證細究之而後知宜文蛤不宜他藥者固自有至精至切之義焉蛤者雀所化具自外飛入水之概殼有文彩又其精氣所注用在殼而味鹹則為由表以入里氣寒性燥則能清熱而勝濕其清裡熱只清上焦心肺之熱以鹹平無深入之能氣復走表又分其勢也活人書治血結胸李防禦治痰嗽面腫皆治在心肺之明徵而仲聖又有精者焉病在陽應汗解而不汗解則熱邪遺留於表以冷水噀之灌之內心煩而外粟起則其寒為外附之寒不必治寒而只須治熱治濕文蛤治表間熱濕恰與證合若不瘥必熱已退而鹹寒不克任之與五苓散者取其淡辛化氣而表邪得盡也吐後渴欲得水而貪飲貪飲由心肺熱熾渴飲在於吐後必表間尚有餘邪故以麻杏發汗即以文蛤協石膏清熱甘草和之於中薑棗調之於表麻杏只三兩而蛤膏各用至五兩意自在於清熱麻杏力微故兼主微風此湯實非為風寒設也至渴欲飲水不止亦主以文蛤散不止即貪飲之謂而無吐後之餘邪則止其熱渴已足療病文蛤治表熱不必有渴治心肺之裡熱則正能止渴蓋其渴非津虧與小便不利也雞矢白雞子白雞子黃雞屬酉金又為巽木具金木之氣本有伐土之長用其水穀所化之矢白則尤能化滯消積領濁下趨故脾土職復則鼓脹以消風木氣平則轉筋自止利小便並止遺溺者以遺溺故小便不利也用白者取其得金氣多無白亦可不拘聖惠方用原蠶沙治霍亂轉筋是從雞矢白散脫胎亦以蠶沙能勝風去濕領濁下趨耳卵白為陽黃為陰白氣輕而黃氣重故白能解散浮陽療目熱赤痛與咽中生瘡黃能涵育真陰主心中煩不得臥與百合病吐後孩子熱瘡妊娠胎漏本經卵白止小兒下泄一語最宜體會小兒熱泄只以氣清微寒之卵白治之即效若丈夫則宜於苦寒矣今人治泄不知有熱壅經隧水穀不能化赤而直趨大腸一證概從事於淡滲溫燥讀此能無惘然豬膽汁傷寒論少陰病下利脈微者與白通湯利不止厥逆無脈乾嘔煩者白通加豬膽汁湯主之是膽汁明為乾嘔煩而加乾嘔煩者少陽木火上衝心胃所致若但寒則不煩不幹嘔也霍亂下利清穀裡寒外熱汗出而厥者通脈四逆湯主之吐已下斷汗出而厥四肢拘急不解脈微欲絶者通脈四逆加豬膽汁湯主之於四肢拘急下又益之曰不解必已依法治之而猶不解也以白通加豬膽汁湯之例推之其所先與當即為通脈四逆湯服之而汗出肢厥如故更見拘急不解脈微欲絶非治之不得其當也蓋四肢為諸陽之本陰邪充斥於四肢則陽被陰縛欲伸不得投以姜附熱藥則陽拒於內陰爭於外拘急何自而解夫拘急乃筋脈之收引筋屬肝肝與膽為表裡其姜附之不任受者膽為之也相火不治君火何能獨治故或為嘔煩或為拘急此豬膽汁所以並加之也膽汁苦寒施於垂絶之微陽豈尚能堪此不知其陰中之火憤而思競正非膽汁不靖故從治亦即正治抑仲聖用此為至慎矣少陰寒邪直中乃陽氣暴虛非本虛且內寓元陽故當其下利而嘔煩可加膽汁霍亂亦吐亦下正中氣散亂之際膽汁甚忌故必拘急不解並吐已下斷而後加之且不解者如故之謂拘急之始何嘗不宜膽汁而仲聖不遽用者又有可旁通以見之者焉在桂枝加附子湯曰四肢微急在四逆湯曰內拘急曰四肢拘急在芍藥甘草湯曰微拘急皆不用膽汁獨拘急而至不解則用之非以其苦寒傷正而慎之乎乃張隱菴謂膽汁能起腎臟之汁資心主之血果爾則仲聖方當不止一二見矣何不察之甚哉膽臟肝葉病每相連醫家亦多連稱否則偏注於肝動云肝氣肝陽鮮有別之為膽病者然肝為陰經膽為陽經肝為風木膽為相火凡見上升與火之證肝必挾膽或竟屬膽病李瀕湖謂豬膽去肝膽之火此即余從治亦正治之說第與肝並舉之耳成無己則謂通脈四逆加膽汁是補肝而和陰又稱肝而不及膽以兩說權之李自較勝於成劉潛江卻揚成而抑李曰豫見一醫治或瀉或止每以豬膽汁炒黃連柴胡和他藥用之遂止不以膽汁炒則不應若不有以補肝令血和而風靜僅如時珍所云平肝膽之火則黃連輩何以鮮功甚矣劉氏之暗也膽汁與姜附並用語人以膽汁是正治膽火人固未必肯信今以膽汁與柴連偶去膽汁即不應則不啻膽汁自表其功矣何則膽汁苦寒而滑極利大便若是肝瀉自應加膽汁而瀉作何以無膽汁則瀉反不止非所謂肝病挾膽者歟治肝以連是以寒勝熱以苦燥濕也治膽以膽則平膽中壯火以扶生氣不使隨肝下走也治肝而不治膽所以無效況柴胡為少陽藥顯系相協以挽少陽之氣成氏之說鑿空無據劉氏輒從而和之醫道誠難言爾豬膚少陰之熱上為咽痛以少陰同氣之物而留連於上以除熱非豬膚莫任故醫家多用此取效而仲聖豬膚湯實開其先今試以鄙說備一解焉下利咽痛心煩皆少陰病惟胸滿疑涉少陽不知少陰脈之支別從肺出絡心注胸中下利既泄其腎陰其虛陽之上乘者遂得因中土無權紛擾於經氣所到之處而致咽痛與胸滿心煩以其虛而非實故胸滿不至於痛不必用攻陷之劑此時伏邪初發尚未由血及氣亦無事於苦寒傷正豬水畜而膚甘寒輕浮自能從上引下而客熱以平然下利非濕也非加白蜜不足以潤燥益陰患見於上下則宜建中非加白粉熬香不足以悅脾振困此證無與於少陽固矣而鄒氏更以痙病用大承氣湯有胸滿字為涉陽明之據又豈足為訓歟羊肉羊之為物古說至賾或謂火畜禮月令及周官庖人注或謂土畜淮南子時則訓及呂覽孟春注或謂西方之性牲子胎教篇或謂土木之母淮南子時則訓五行已占其四而自愚思之即謂之水畜亦何恧焉羊以西北方産者為美有長髯可當長髯主簿之目古今注又好登歷山崖傾仄處略無怖意其腎氣之充固非他畜比惟於五行咸具中以得火土之氣為尤多故仲聖用治寒疝腹痛與産後腹中㽲痛取其氣熱味甘足以溫脾緩中而藥之能溫脾緩中者尚有之茲何以非羊肉不可則以證不獨在脾羊肉正不獨治脾也素問病名心疝少腹當有形又任脈為病男子內結七疝寒疝即七疝之一何能於腎無與即仲聖之大烏頭煎抵當烏頭桂枝湯皆治寒疝腹痛皆用烏頭烏頭者外驅寒濕內溫腎陽者也外臺烏頭湯且以治寒疝發作時令人陰縮況脅痛裡急明是寒襲厥陰産後血虛無不下寒小建中湯雖治腹痛豈能愈此大證兌為羊兌卦二陽在下一陰居上羊蓋具剛很之性易大壯疏而能於陰中化陽者寒疝乃肝腎之陰同受寒纍羊肉溫脾緩中而肝腎之虛寒亦得其溫補之益故用之是證最為切當其必與歸姜協力以成功者羊肉能於陰中化陽不能散陰中之寒邪此歸姜辛溫之能事謂為羊肉之前驅可也阿膠阿膠為補血聖藥不論何經悉其所任味厚為陰阿膠之味最厚用必以補不宜補者勿用白頭翁湯加阿膠則曰下利虛極內補當歸湯則曰去血過多加阿膠仲聖孫真人皆有明訓然非填補比不得與熟地山藥同論也阿膠以濟水黑驢皮煎煉而成性易下行且滑大腸於下利非宜何以白頭翁加甘草阿膠湯治下利不知此乃滯下之熱痢正借其滑利之功故張潔古加減平胃散治熱痢以膿多而用之渴者非熱爍其液即下焦陰液不上朝阿膠不能清熱而性下行何能止渴乃豬苓湯治發熱而渴又治下利而渴證不宜阿膠而偏佐以阿膠不知此皆因熱而渴而利水畜於中而熱與水得液既大傷更與以豬苓輩淡滲燥劫之物液不幾涸矣乎佐阿膠所以潤液而救豬苓輩之偏非治其渴與利也推之黃土湯燥濕鱉甲煎丸破結溫經湯行瘀大黃甘遂湯下血逐水亦斷非滋柔濁膩之阿膠所能為力蓋其補血潤液而下行不致掣燥濕破結行瘀下血逐水之肘且能輔其不逮故有需於阿膠若執黃土湯諸方而以燥濕各事責阿膠則何異捫燭扣槃之見矣犀角犀角一物或謂胃藥或謂心藥或謂性升或謂性降或謂取汗最捷或謂治血與經旨不合夫毒物入土即化牛屬土而犀角黑中有黃花黃中有黑花雖水畜未嘗不秉土德謂為胃藥無愧釋名心纖也所識纖微無不貫也犀角中有白星徹端夜視光明謂為心藥無愧其角長而且鋭空而通氣氣味苦酸而兼鹹寒故能至極上極下亦能至極內極外其實非升非降不發汗不逐實心胃藥而不專走心胃血藥而不泛治血證觀千金外臺兩書用犀角之證在上者有之在中在下者有之在表者有之在裡者有之無分於上下表里而總惟血熱而有毒者宜之諸家之說不免皆有所偏論犀角之精者必首推鄒氏然謂用犀角必外有表證而兼肌膚有故乃其所引外臺諸證則並無表證夫表證者有表邪宜發汗之謂犀角與麻黃並用有之不能專任以發汗鄒氏又以金匱升麻鱉甲湯無犀角為無表證外臺治喉痛有犀角為有表證而升麻鱉甲湯證非無喉痛不解何以疏舛若是鄒氏引魏培之犀角是倒大黃之戲語鬯發大黃治火之自中及下犀角治火之自下及上義至精矣而猶有未盡者本經大黃主下瘀血犀角主解百毒就此繹之大黃除血分之熱結是逐而下之犀角除血分之熱毒是解而散之大黃不言解毒是熱結於虛處致用多在腸胃犀角不言下瘀是熱淫於實處致用多在肌膚大黃之味至苦色至黃性復猛厲自能逐物而下犀角靈異之品無論何處遇毒輒赴謂其自上而降自下而升則譽之不當矣陸九芝世補齊醫書犀角升麻辨看似精詳細核之則疏舛殊甚升麻代犀角孫真人千金方已有此語不始於朱奉議活人書二物皆中空通氣入陽明經味苦能發故本經皆主解百毒然升麻主氣犀角主血升麻升陽氣而解毒犀角清血熱而解毒原有不同似未可以相代不知孫真人用犀角之方不一獨於傷寒雜治門木香湯則云熱毒盛者加犀角無犀角以升麻代之蓋其所治瘡煩疼是陽氣為陰邪所郁故方中用木香等辛溫宣陽之藥熱盛則有毒升麻能解毒而升陽亦無所妨故可以代犀角朱奉議以此法施於犀角地黃湯等方固宜見譏於陸而陸實亦不能無誤提邪外出引邪內陷之說由來已久愚何敢闢以臆見獨是仲聖傷寒金匱兩書發表攻裡分別甚嚴即在陰經而用汗法非兼見太陽脈證則必邪在於表在於上若邪離本經入他經則治以他經之藥邪得藥而自解非提出之使他徙而後解也其邪雖不在裡而不得用汗法者仲聖又常反復叮嚀以致意此皆鑿鑿可證者陸氏亦知提邪外出之非發汗不外出乎可以發汗之邪邪本在表在上未聞有從里從下提而出之以發其汗者或謂升麻之名以升得之自屬以升為治不知所謂升麻者為能升陽氣於至陰之下也周慎齊云凡生病處皆為陰為火為陽氣不到升麻升陽氣以愈病非提邪氣以離病不得併為一談至於引邪內陷只可謂之致不可謂之引凡無病之處先為藥傷邪因乘虛而入是為藥誤所致非如物交物之得以相引若寒藥治寒病熱藥治熱病可謂邪為藥引矣然此是滋蔓以益其本病非陷入而別有變病陸引喻氏論趙某室人誤用犀角領邪攻心一案以明犀角非胃藥之據夫犀角誤用為禍誠烈謂犀角非胃藥則其測犀角何淺又以犀角治熱入血室為能從至幽至隱拔邪外出故謂之升微論犀角之治邪非拔邪也從至幽至隱以升拔其邪亦無此治理仲聖治熱入血室用小柴胡湯似乎升矣不知傷寒金匱兩書論此證諸條惟續得寒熱發作有時一條主小柴胡湯且將發作有時句復沓言之明示人以非有此證不用此湯蓋肝膽二經互相為用熱雖入於肝臟寒熱如瘧則邪不離乎少陽以小柴胡湯和解之最為合拍是柴胡尚屬和法犀角更何足言升乃活人書謬於仲聖經水適來晝日明瞭暮則讝語如見鬼狀為熱入血室一條增加宜小柴胡湯五字竟視小柴胡湯為治熱入血室之通劑可謂粗疏之至矣或詰余曰子言提邪外出之證必邪之在表在上者乃寓意草載周信川患休息痢喻氏以逆流挽舟之法提內陷之邪從表出而愈何子之執滯也余曰逆流挽舟之說後人多非之其實非提邪出表且與仲聖有暗合之處可兩下研核而知也喻氏痢疾論云下痢必從汗先解其外後調其內此治痢初起之要訣學者所宜切記至失表而成久痢邪已深入云用逆流挽舟之法引而出之於外則不知其挽從何處若從極下逆挽而上顯犯少陰病在裡不可發汗之戒引喻過當不無流弊金匱下利脈反弦發熱身汗者自愈一條喻氏以此下利為久痢非用逆挽之法無以得此夫弦為少陽之脈寒利得之自屬病氣將退陽氣來復之徵喻氏強題就我憑空結撰實不可為訓然則以此法治周信川休息痢而愈者何也病者年已七十有三面目浮腫肌膚晦黑別無他狀非陽虛陰盛而何痢有冷熱兩種此當是冷痢而濕重熱輕因其陽氣下陷與濕熱相搏故脈沉數而有力喻氏謂陽邪陷入於陰者非也病在腸胃與少陰無涉以仲聖陽明病與小柴胡湯取汗之法比例求之彼為上焦不通津液不下胃因不和故不大便此為邪壅腸胃津液不布傳化無權故久痢不止彼以小柴胡湯和解其外而濈然汗出此以人參敗毒散升散其里而皮間得潤小柴胡湯本方無取汗之文服之而汗出者其上焦通也休息痢本不能發汗服人參敗毒散而亦似有汗者升陽以化濕陰陽和而穀味熏膚充身也因人參敗毒散雖有人參究屬劫劑故改用補中益氣湯而始收全功方中柴胡參草薑棗即小柴胡湯去芩夏彼為挾熱此為挾寒彼宜通此宜固故芩夏無所用之又凡仲聖治寒利之方不雜一下走之藥甚或用石脂餘糧以固下蔥白以升陰義詳蔥白喻氏則外以布卷墊定肛門使氣不下泄內服湯以升舉之得仲聖意而不呆用仲聖之方非明哲那能如是雖然仲聖亦逆流挽舟以治利耳而喻氏用之謂為提邪出表得毋有不察者存乎兩頭尖即牡鼠屎鼠善穿而屎為下輸之穢物頭尖則鋭故藉以導穢濁之邪有奇效別録同蔥豉煎服治時行勞復夫時行病愈之後熱邪之未盡者必伏於陰分隨人氣壯而消氣乏而作緣勞復病無不發熱治宜散宜泄而不宜補蔥豉所以散之於表鼠屎所以泄之於里豉以腎谷蒸罯而成其用為由陰達陽鼠屎則降濁以升清也仲聖枳實梔子豉湯治勞復以枳梔瀉上中之熱使下行淡豉搜下伏之熱使上解別録意亦猶是初無大異活人書更以蔥豉鼠屎與枳梔合併成方則慮之惟恐不周矣仲聖燒裩散治傷寒陰陽易導其熱從前陰而出活人書師其意立豭鼠糞湯以出黏汗取效蓋韭根臭濁入心氣辛達表與鼠糞同用而多於鼠糞則能使陰分感受之邪悉舉而泄之於表治陰易不治陽易者以二者皆陽藥能消陰不能瀉陽也葉香岩治淋濁用兩頭尖亦從此脫胎亂髮發亦名血餘古以男子年近二十無疾病者剪頂心發燒研入藥故本經名發髲功用與亂髮無異亂髮乃梳櫛下發也以皂角水洗淨曬乾入罐固濟煅存性用水出高原故腎華在發發者血之餘血者水之類此滑攖寧注素問語也而本經發髲主五癃關格不通利小便水道若移滑語作此疏亦確不可易仲聖豬膏發煎治黃疸與陰吹正喧以豬膏潤燥亂髮引入下焦血分消瘀通關格利水道滑石白魚散乃利小便之重劑病不專在氣分滑石利竅驅濕熱不輔以白魚亂髮血中之氣藥則膀胱之水道猶不得利凡仲聖用血餘與本經正如符節之合後世因本經有自還神化一語不得其解遂附會其說或謂補真陰或謂益水精曾是通關格之物而能有補益之實者耶別録合雞子黃煎之消為水療小兒驚熱百病雞子甘溫育陰本治小兒虛熱之妙品血餘得之則變峻逐為宣鬯而陰分之積熱以解痰逆以平以此法塗熱瘡小兒及産婦亦俱宜古方元精丹則以血餘配入首烏等一切補腎之藥為便後脫血之良方此皆得製劑之道而血餘乃有功而無過非血餘之本能然也鼻衄以血餘燒灰吹之立止即齒血便血與諸竅出血燒灰送服亦無不止此蓋色黑止血而血餘更以血入血故應如桴鼓要不可忘其為消瘀之厲劑也人尿童男者尤良李瀕湖謂人尿入胃輸脾歸肺下通水道入膀胱皆其舊路是當為利水之妙品而方書俱不主利水良以鹹寒入血不兼走氣能益陰清熱消瘀而不能利水不能利水故於益陰清熱消瘀愈顯其用寇宗奭謂此物性寒不宜多服朱丹溪則力闢其非至引八十老婦常服人尿而健以為證不知人之稟賦不齊遇陽有餘而陰不足之人原得其益若陽虛與血虛無熱者豈能相宜仲聖白通加豬膽汁湯內有人尿所以平嘔煩瀉陰中之陽葛稚川蔥豉湯內有人尿所以防溫邪之傷陰或陰分之寒已化熱皆取其鹹寒清熱惟系曾經腑臟輸化之物與人身陰氣相得非他物鹹寒可比故治産婦血暈與夫勞嗽血滲入肺吐血衄血骨蒸發熱中暍昏悶折傷跌撲致有靈驗余親串中有一婦曾於産後血暈飲童尿而瘥後乃以童尿殞命蓋此婦本陽虛之體逮體肥於前陽虛亦更甚於前家人狃於前效而用之適以取禍寇氏性寒之說顧可忽乎哉
